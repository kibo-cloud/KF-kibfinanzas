<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>kibFinanzas</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1f9d55" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="kibFinanzas">
<link rel="apple-touch-icon" href="./apple-180.png">
<link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png">
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --card2:#ffffff; --txt:#111114; --txt2:#8a8a8e;
  --sep:rgba(60,60,67,.13); --acc:#1f9d55; --acc-soft:rgba(31,157,85,.12);
  --neg:#d0453a; --fill:#e9e9ee; --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);
  --nav:rgba(248,248,250,.88); --r:20px; --halo:rgba(31,157,85,.10);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --card:#161618; --card2:#1e1e21; --txt:#f4f4f6; --txt2:#8e8e93;
    --sep:rgba(255,255,255,.10); --acc:#34c17b; --acc-soft:rgba(52,193,123,.16);
    --neg:#f0655b; --fill:#2a2a2e; --shadow:none; --nav:rgba(20,20,22,.86); --halo:rgba(52,193,123,.16);
  }
}
html[data-tema="claro"]{
  --bg:#f2f2f7; --card:#ffffff; --card2:#ffffff; --txt:#111114; --txt2:#8a8a8e;
  --sep:rgba(60,60,67,.13); --acc:#1f9d55; --acc-soft:rgba(31,157,85,.12);
  --neg:#d0453a; --fill:#e9e9ee; --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);
  --nav:rgba(248,248,250,.88); --halo:rgba(31,157,85,.10);
}
html[data-tema="oscuro"]{
  --bg:#000000; --card:#161618; --card2:#1e1e21; --txt:#f4f4f6; --txt2:#8e8e93;
  --sep:rgba(255,255,255,.10); --acc:#34c17b; --acc-soft:rgba(52,193,123,.16);
  --neg:#f0655b; --fill:#2a2a2e; --shadow:none; --nav:rgba(20,20,22,.86); --halo:rgba(52,193,123,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  font-size:17px; line-height:1.35; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(150px + env(safe-area-inset-bottom));
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* ── header ── */
header{
  position:sticky;top:0;z-index:40;background:var(--nav);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--sep);padding-top:env(safe-area-inset-top);
}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;min-height:46px;padding:5px 0}
.hd h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.02em;grid-column:2;grid-row:1;text-align:center;white-space:nowrap}
.ojo{width:40px;height:40px;padding:0;border:0;border-radius:50%;background:none;color:var(--txt2);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ojo:active{background:var(--sep)}
.ojo .ojo-no{display:none}
html[data-oculto] .ojo{color:var(--acc)}
html[data-oculto] .ojo .ojo-ver{display:none}
html[data-oculto] .ojo .ojo-no{display:block}
.hd h1 .kf{font-weight:800;letter-spacing:.01em}
.hd h1 .anio{font-weight:500;color:var(--txt2);font-size:16px;margin-left:6px}
.estado{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--txt2);grid-column:1;grid-row:1;min-width:0;line-height:1.15}
.estado span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:0 0 auto}
.dot.sucio{background:#e0a300}
.btn-guardar{grid-column:3;grid-row:1;justify-self:end;
  flex:0 0 auto;background:var(--acc);color:#fff;font-size:15px;font-weight:600;
  padding:9px 16px;border-radius:22px;min-height:40px;
}
.btn-guardar[disabled]{opacity:.45}

/* ── avisos ── */
.aviso{
  background:var(--card);border:1px solid var(--sep);border-radius:var(--r);
  padding:14px 16px;margin:12px 0;font-size:15px;box-shadow:var(--shadow);
}
.aviso p{margin:0 0 10px}
.aviso .fila{display:flex;gap:8px}
.mini{
  background:var(--fill);border-radius:12px;padding:9px 14px;font-size:15px;
  font-weight:600;min-height:40px;
}
.mini.on{background:var(--acc);color:#fff}

/* ── vistas ── */
.vista{display:none;padding-top:2px}
.vista.on>*:first-child{margin-top:8px}
.vista.on{display:block}
h2.tit{font-size:13px;font-weight:600;color:var(--txt2);margin:22px 4px 8px;letter-spacing:0}

/* ── selector de mes ── */
.meses{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;scroll-snap-type:x proximity}
.meses::-webkit-scrollbar{display:none}
.meses button{
  flex:0 0 auto;min-width:60px;min-height:44px;padding:0 14px;border-radius:14px;
  background:var(--card);border:1px solid var(--sep);font-size:14px;font-weight:600;
  color:var(--txt2);scroll-snap-align:center;
}
.meses button.on{background:var(--acc);color:#fff;border-color:transparent}

/* ── resumen ── */
.saldo{
  background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);
  border:1px solid var(--sep);position:relative;overflow:hidden;
}
.saldo:before{content:'';position:absolute;right:-80px;top:-110px;width:220px;height:220px;border-radius:50%;
  background:var(--halo);pointer-events:none}
.tri{display:flex;gap:10px;margin-bottom:14px}
.tri div{flex:1;min-width:0}
.tri small{display:block;font-size:12px;color:var(--txt2);margin-bottom:2px}
.tri b{font-size:16px;font-weight:600;letter-spacing:-.01em;display:block;overflow:hidden;text-overflow:ellipsis}
.final{border-top:1px solid var(--sep);padding-top:12px}
.final small{font-size:12px;color:var(--txt2)}
.final-fila{display:flex;align-items:center;justify-content:space-between;gap:10px}
.final-fila .big{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.final .big{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:2px}
.big.ok{color:var(--acc)} .big.mal{color:var(--neg)}
.barras{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.barra small{display:flex;justify-content:space-between;font-size:12px;color:var(--txt2);margin-bottom:4px}
.pista{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.pista i{display:block;height:100%;border-radius:3px;background:var(--txt2)}
.pista i.verde{background:var(--acc)}

/* ── secciones ── */
.sec{background:var(--card);border-radius:var(--r);margin-top:12px;box-shadow:var(--shadow);border:1px solid var(--sep);overflow:hidden}
.sec>header{position:static;background:none;border:0;padding:0;backdrop-filter:none}
.sechd{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;min-height:52px;text-align:left}
.sechd .nom{flex:1;font-size:16px;font-weight:600}
.sechd .sub{font-size:16px;font-weight:600;color:var(--txt2)}
.chev{width:12px;height:12px;border-right:2px solid var(--txt2);border-bottom:2px solid var(--txt2);transform:rotate(45deg);margin-left:2px;transition:transform .18s}
.sec.cerrada .chev{transform:rotate(-45deg)}
.sec.cerrada .cuerpo{display:none}
.cuerpo{border-top:1px solid var(--sep)}
.item{display:flex;align-items:center;gap:6px;padding:6px 4px 6px 12px;border-bottom:1px solid var(--sep);min-height:48px}
.item:last-child{border-bottom:0}
.item input.nombre{
  flex:1;min-width:60px;border:0;background:none;padding:8px 0;font-size:16px;outline:none;
  text-overflow:ellipsis;
}
.item input.monto{
  width:112px;flex:0 0 auto;text-align:right;border:0;background:none;padding:8px 2px;
  font-size:16px;font-weight:600;outline:none;font-variant-numeric:tabular-nums;
}
.item input.monto:focus,.item input.nombre:focus{background:var(--fill);border-radius:8px}
.item .x{width:36px;height:44px;flex:0 0 auto;color:var(--txt2);font-size:20px;line-height:1}
.mas{display:block;width:100%;padding:14px 16px;text-align:left;color:var(--acc);font-weight:600;font-size:15px;min-height:48px}
.nota{padding:10px 16px 14px;font-size:13px;color:var(--txt2)}
.nota.mal{color:var(--neg)}
.manual .cuerpo{padding:12px 16px 4px}
.manual p{margin:0 0 10px;font-size:15px;line-height:1.5}
.manual ul{margin:0 0 10px;padding-left:18px;font-size:15px;line-height:1.5}
.manual li{margin-bottom:4px}
.acciones .btnlink{display:block;background:var(--card);padding:15px 16px;text-align:left;font-size:16px;min-height:52px;line-height:22px;text-decoration:none;color:var(--txt)}
.faj .mini{flex:0 0 auto;padding:7px 10px;border-radius:9px;background:var(--fill);color:var(--acc);font-size:13px;font-weight:600;min-height:36px}
.chk{width:23px;height:23px;flex:0 0 auto;border-radius:50%;border:2px solid var(--sep);
  display:flex;align-items:center;justify-content:center;color:transparent;transition:background .18s,border-color .18s,color .18s,transform .12s}
.chk svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chk.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chk:active{transform:scale(.88)}
.item.pago input.nombre{color:var(--txt2)}
.item.pago input.monto{color:var(--txt2)}
.orden{border:1px solid var(--sep);border-radius:12px;overflow:hidden}
.ofila{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 14px;min-height:50px;border-bottom:1px solid var(--sep);background:var(--card)}
.ofila:last-child{border-bottom:0}
.ofila span{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ofila button{width:42px;height:42px;flex:0 0 auto;border-radius:11px;background:var(--fill);color:var(--txt);font-size:13px}
.ofila button[disabled]{opacity:.3}
.topein{width:130px;flex:0 0 auto;text-align:right;border:0;background:none;padding:8px 4px;font-size:16px;font-variant-numeric:tabular-nums;color:var(--txt);outline:none}
.tinfo{padding:0 16px 10px;margin-top:-4px;border-bottom:1px solid var(--sep)}
.tinfo small{display:block;font-size:12px;color:var(--txt2);margin-bottom:4px}
.tinfo small.mal{color:var(--neg)}
.tinfo .pista i{background:var(--acc)}
.tinfo .pista i.mal{background:var(--neg)}
.dinfo{display:block;width:100%;text-align:left;padding:0 16px 10px;margin-top:-2px;font-size:13px;color:var(--txt2);border-bottom:1px solid var(--sep);min-height:0}
.dinfo.vacia{color:var(--acc);font-weight:600}
.item.mov{gap:10px}
.item.mov .fecha{color:var(--txt2);font-size:13px;font-variant-numeric:tabular-nums;flex:0 0 auto}
.item.mov .nom{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.item.mov .monto{font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 auto}
.campo{margin-bottom:10px}
.campo label{display:block;font-size:13px;color:var(--txt2);margin:0 0 4px 4px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(150px + env(safe-area-inset-bottom));z-index:55;display:none;align-items:center;gap:12px;
  background:var(--txt);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:480px;margin:0 auto}
.toast.on{display:flex}
.toast span{flex:1}
.toast button{color:var(--acc);font-weight:700;font-size:15px;min-height:32px;padding:0 6px}
.subtit{padding:14px 16px 4px;font-size:13px;font-weight:600;color:var(--txt2);border-top:1px solid var(--sep)}

/* ── tablas ── */
.tabla{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);border-radius:var(--r);border:1px solid var(--sep);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--sep)}
th{font-size:12px;font-weight:600;color:var(--txt2);position:sticky;top:0;background:var(--card)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);font-weight:600}
tr.tot td{border-bottom:0;font-weight:700;background:var(--card2)}
tr.tot td:first-child{background:var(--card2)}

/* ── charts ── */
.chart{background:var(--card);border-radius:var(--r);padding:14px;border:1px solid var(--sep);box-shadow:var(--shadow)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.leyenda{display:flex;gap:16px;font-size:12px;color:var(--txt2);margin-top:8px}
.leyenda i{display:inline-block;width:10px;height:2px;vertical-align:middle;margin-right:5px}

/* ── ranking ── */
.rank{background:var(--card);border-radius:var(--r);padding:6px 16px 14px;border:1px solid var(--sep);box-shadow:var(--shadow)}
.rk{padding:9px 0}
.rk small{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:10px}
.rk small span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk small span:last-child{color:var(--txt2);flex:0 0 auto}

/* ── filas de ajuste ── */
.fila-in{display:flex;align-items:center;gap:10px;padding:6px 16px;border-bottom:1px solid var(--sep);min-height:52px}
.fila-in label{flex:1;font-size:16px}
.fila-in input{width:150px;text-align:right;border:0;background:none;padding:10px 4px;font-size:16px;font-weight:600;outline:none;font-variant-numeric:tabular-nums}
.fila-in input:focus{background:var(--fill);border-radius:8px}
.fila-in:last-child{border-bottom:0}
.seg{display:flex;gap:4px;background:var(--fill);border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px 10px;border-radius:9px;font-size:14px;font-weight:600;color:var(--txt2);min-height:38px}
.seg button.on{background:var(--card);color:var(--txt);box-shadow:var(--shadow)}
.lista{background:var(--card);border-radius:var(--r);border:1px solid var(--sep);box-shadow:var(--shadow);overflow:hidden}
.faj{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px 11px 12px;min-height:56px;text-align:left;border-bottom:1px solid var(--sep);background:var(--card);color:var(--txt);text-decoration:none}
.faj:last-child{border-bottom:0}
.faj:active{background:var(--fill)}
.faj .ico{flex:0 0 32px;width:32px;height:32px;border-radius:9px;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center}
.faj .ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.faj .tx{flex:1;min-width:0}
.faj .tx b{display:block;font-size:16px;font-weight:500;color:var(--txt)}
.faj .tx small{display:block;font-size:13px;color:var(--txt2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.faj .tx small.mal{color:var(--neg)}
.faj .tx small.ok{color:var(--acc)}
.faj .chev{flex:0 0 auto;transform:rotate(-45deg);margin-right:4px}
.faj.acento .tx b{color:var(--acc);font-weight:600}
.faj .seg{flex:0 0 auto;width:52%;max-width:230px}
.faj .seg button{min-height:32px;padding:5px 6px;font-size:13px}
.volver{display:flex;align-items:center;gap:6px;color:var(--acc);font-size:16px;font-weight:500;padding:6px 0 2px;margin-top:4px}
.volver i{width:10px;height:10px;border-left:2px solid var(--acc);border-bottom:2px solid var(--acc);transform:rotate(45deg);margin-left:4px}
.subtit{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:6px 4px 14px}
.pie{font-size:13px;color:var(--txt2);text-align:center;padding:26px 0 8px}
.lista .anios{padding:12px 14px}
.acciones{display:flex;flex-direction:column;gap:1px;background:var(--sep);border-radius:var(--r);overflow:hidden;border:1px solid var(--sep)}
.acciones button{background:var(--card);padding:15px 16px;text-align:left;font-size:16px;min-height:52px}
.acciones button.acento{color:var(--acc);font-weight:600}
.texto{font-size:14px;color:var(--txt2);line-height:1.5;padding:2px 4px}
.texto b{color:var(--txt)}

/* ── fab + nav ── */
.fab{
  position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:45;
  height:56px;padding:0 22px;border-radius:28px;background:var(--acc);color:#fff;
  font-size:16px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.22);display:flex;align-items:center;gap:8px;
}
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--nav);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--sep);display:flex;padding-bottom:env(safe-area-inset-bottom);
}
nav button{flex:1;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--txt2);font-size:10px;font-weight:600;min-height:52px}
nav button.on{color:var(--acc)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ── modal ── */
.velo{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center}
.velo.on{display:flex}
.hoja{
  width:100%;max-width:520px;background:var(--card);border-radius:20px 20px 0 0;
  padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;
}
@media(min-width:560px){ .velo{align-items:center} .hoja{border-radius:20px;margin:0 16px} }
.hoja h3{margin:0 0 14px;font-size:19px;font-weight:700}
.hoja input[type=text]{
  width:100%;padding:14px;border-radius:12px;border:1px solid var(--sep);background:var(--bg);
  font-size:17px;outline:none;margin-bottom:12px
}
.hoja input.grande{font-size:30px;font-weight:700;text-align:center;padding:16px;letter-spacing:-.02em}
.hoja input:focus{border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chips button{
  padding:0 14px;min-height:44px;border-radius:22px;background:var(--fill);
  font-size:15px;font-weight:600;border:1px solid transparent
}
.chips button.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.hoja .fila{display:flex;gap:8px}
.hoja .fila button{flex:1;min-height:50px;border-radius:14px;font-size:16px;font-weight:600;background:var(--fill)}
.hoja .fila button.pri{background:var(--acc);color:#fff}
.hoja .fila button.mal{color:var(--neg)}
.hoja .fila button.pri.mal{background:var(--neg);color:#fff}

.neg{color:var(--neg)}
/* ── modo trabajo ── */
.hoja input[type=date]{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--sep);background:var(--bg);font-size:17px;outline:none;margin-bottom:12px;min-height:50px;-webkit-appearance:none;appearance:none}
.tj-lb{display:block;font-size:13px;color:var(--txt2);margin:4px 0 8px 4px}
.hoja .chips{margin-bottom:12px}
.tj-acc{display:flex;gap:8px;margin-top:12px}
.tj-acc button{flex:1;min-height:48px;border-radius:14px;font-size:15px;font-weight:600;background:var(--card);border:1px solid var(--sep);box-shadow:var(--shadow)}
.tj-acc button.pri{background:var(--acc);color:#fff;border-color:transparent}
.tj-f{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;min-height:58px;text-align:left;border-bottom:1px solid var(--sep);background:var(--card);color:var(--txt)}
.tj-f:last-child{border-bottom:0}
button.tj-f:active{background:var(--fill)}
.tj-f .tx{flex:1;min-width:0}
.tj-f .tx b{display:block;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ═══ 16 · terminaciones: curvas, relieve y respuesta al toque ══════
   Solo CSS. No toca el DOM, ni los datos, ni el almacenamiento.
   Las curvas viven en variables para que todo frene igual. */
:root{
  --curva:cubic-bezier(.22,1,.36,1);        /* frena suave: aperturas y entradas */
  --curva-sale:cubic-bezier(.4,0,1,1);      /* arranca rápido: salidas */
  --curva-viva:cubic-bezier(.2,.9,.3,1);    /* con algo de vida: barras y números */
  --toque:.08s;                              /* apretar es inmediato */
  --suelta:.24s;                             /* soltar vuelve despacio */
  --shadow:0 1px 1.5px rgba(16,18,27,.04),0 5px 14px -4px rgba(16,18,27,.07);
  --shadow-alto:0 2px 8px rgba(16,18,27,.07),0 18px 40px -12px rgba(16,18,27,.22);
}
@media (prefers-color-scheme: dark){
  :root{ --shadow:none; --shadow-alto:0 -1px 0 rgba(255,255,255,.07); }
}
html[data-tema="claro"]{
  --shadow:0 1px 1.5px rgba(16,18,27,.04),0 5px 14px -4px rgba(16,18,27,.07);
  --shadow-alto:0 2px 8px rgba(16,18,27,.07),0 18px 40px -12px rgba(16,18,27,.22);
}
html[data-tema="oscuro"]{ --shadow:none; --shadow-alto:0 -1px 0 rgba(255,255,255,.07); }

/* apretar: nunca resalta el recuadro gris de Android, nunca selecciona texto,
   nunca espera los 300 ms del doble toque */
button{touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input,textarea{touch-action:manipulation}

/* respuesta al toque: baja rápido, vuelve despacio */
.tj-acc button,.tj-prod,.tj-linea,.tj-pasar,.tj-rec,.hoja .fila button,.chips button,.seg button,
.mini,.acciones .btnlink,.toast button,.mas,#nav button,.item .x,.fab,.meses button{
  transition:transform var(--suelta) var(--curva),background .2s var(--curva),
             border-color .2s var(--curva),color .2s var(--curva),opacity .2s var(--curva);
}
.tj-acc button:active,.hoja .fila button:active,.tj-pasar:active,.tj-linea:active{transform:scale(.975);transition-duration:var(--toque)}
.tj-prod:active{transform:scale(.955);transition-duration:var(--toque)}
.chips button:active,.seg button:active,.mini:active,.tj-rec:active,.toast button:active{transform:scale(.93);transition-duration:var(--toque)}
.item .x:active{transform:scale(.82);transition-duration:var(--toque)}
#nav button:active .np{transform:scale(.88);transition-duration:var(--toque)}
.acciones .btnlink:active,.mas:active{background:var(--fill)}
.np{transition:background .22s var(--curva),transform var(--suelta) var(--curva)}
.fab:active{transform:scale(.93);transition-duration:var(--toque)}
.meses button:active{transform:scale(.93);transition-duration:var(--toque)}
button.tj-f{transition:background .2s var(--curva)}
button.tj-f:active{background:var(--fill);transition-duration:var(--toque)}

/* relieve: lo que flota se despega más que lo que está apoyado.
   La hoja mantiene su propia máquina de estados (arrastrando · vuelve · yendo): no se toca. */
.hoja{box-shadow:var(--shadow-alto);overscroll-behavior:contain}
.toast{box-shadow:var(--shadow-alto)}
.fab{box-shadow:0 4px 10px -2px rgba(16,18,27,.16),0 12px 28px -8px rgba(16,18,27,.28)}
.fab:active{box-shadow:0 2px 6px -2px rgba(16,18,27,.2)}

/* aperturas y cierres con la misma curva */
.velo{transition:background .24s var(--curva)}
.chev{transition:transform .22s var(--curva)}
.vista.on{animation:kfEntra .22s var(--curva)}
.vista.der{animation:kfDer .3s var(--curva)}
.vista.izq{animation:kfIzq .3s var(--curva)}
.vista.on>.sec,.vista.on>.lista,.vista.on>.tabla,.vista.on>.manual>.sec{
  animation-duration:.28s;animation-timing-function:var(--curva);   /* en largo, para no pisar el retardo escalonado */
}
.pista i{transition:width .34s var(--curva-viva),background .25s var(--curva)}
#v-trabajo .pista i,.rank .pista i{animation:kfBarra .6s var(--curva-viva)}

/* el precio es lo que se mira antes de tocar: tiene que leerse de una */
.tj-prod small{color:var(--txt);opacity:.72}

/* los números que cuentan no tienen que bailar de ancho */
.big,.tri b,.sechd .sub,.tj-prod small,.tj-cz .mt,.saldo .final small{font-variant-numeric:tabular-nums}

/* la pista de altura solo mientras se pliega de verdad, no todo el tiempo */
.cuerpo{will-change:auto}
.cuerpo[data-anim="1"]{will-change:height}

/* teclado: un aro visible sin ensuciar el toque en el celular */
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* quien pidió menos movimiento no ve nada de esto: gana por !important aunque esté más arriba */
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

var ultimos = {};
function contar(id, hasta, fmt){
  var el = document.getElementById(id);
  if(!el) return;
  var desde = ultimos[id];
  ultimos[id] = hasta;
  if(oculto || menosMovimiento() || desde === undefined || desde === hasta){ return; }
  var t0 = 0, dur = 520;
  var paso = function(t){
    if(!t0) t0 = t;
    var p = Math.min(1, (t - t0) / dur);
    var e = 1 - Math.pow(1 - p, 3);           // desacelera al final
    var vivo = document.getElementById(id);
    if(!vivo) return;
    vivo.textContent = fmt(desde + (hasta - desde) * e);
    if(p < 1) requestAnimationFrame(paso);
  };
  if(window.requestAnimationFrame) requestAnimationFrame(paso);
}

function scrollLateral(el){

}
function seDeslizaAlCostado(el){
  // no robarle el gesto a lo que ya se mueve para los costados
  while(el && el !== document.body){
    if(el.className && typeof el.className === 'string' &&
       /\b(meses|tabla|chart|hoja|orden|velo)\b/.test(el.className)) return true;
    if(el.scrollWidth > el.clientWidth + 4 && scrollLateral(el)) return true;   // un texto cortado con puntos suspensivos no se desplaza
    el = el.parentNode;

function plegarAnim(sec, cerrar){
  var cu = sec.querySelector('.cuerpo');
  if(!cu || menosMovimiento()){ sec.classList.toggle('cerrada', cerrar); return; }
  if(cu.getAttribute('data-anim') === '1') return;   // ya está en movimiento, no encimar
  cu.setAttribute('data-anim', '1');
  cu.style.overflow = 'hidden';
  var fin = function(){ limpiarAlto(cu); cu.removeAttribute('data-anim'); };
  if(cerrar){
    cu.style.height = cu.scrollHeight + 'px';
    void cu.offsetHeight;
    cu.style.transition = 'height .22s ease, opacity .16s ease';
    cu.style.height = '0px'; cu.style.opacity = '0';
    setTimeout(function(){ sec.classList.add('cerrada'); fin(); }, 230);
  } else {
    sec.classList.remove('cerrada');

    void cu.offsetHeight;
    cu.style.transition = 'height .26s cubic-bezier(.2,.8,.3,1), opacity .22s ease';

function mesesCargados(s){
  var out = [], i;
  for(i=0;i<12;i++) if(s[i].totalIngresos || s[i].totalGastos) out.push(i);
  return out;
}
function anillo(pct){
  var r = 26, c = 2*Math.PI*r, off = c * (1 - Math.max(0, Math.min(1, pct)));
  return '<svg viewBox="0 0 64 64" class="anillo" aria-hidden="true">'
       +   '<circle cx="32" cy="32" r="'+r+'" fill="none" stroke="var(--fill)" stroke-width="7"/>'
       +   '<circle cx="32" cy="32" r="'+r+'" fill="none" stroke="var(--acc)" stroke-width="7" stroke-linecap="round"'
       +     ' class="prog" transform="rotate(-90 32 32)" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/>'
       + '</svg>';
}
function resumenAnio(s){
  var act = mesesCargados(s), i, n = act.length;
  if(n < 2) return '<div class="resumen vacio">'
    + '<div class="res-txt"><p>Cargá ' + (n === 0 ? 'un par de meses' : 'un mes más') + ' y acá te resumo el año: cuánto entra, cuánto se va y con cuánto cerrás.</p></div></div>';
  var sumG = 0, sumI = 0, sumA = 0, peor = act[0], mejor = act[0], rojos = [];
  for(i=0;i<n;i++){
    var c = s[act[i]];
    sumG += c.totalGastos; sumI += c.totalIngresos; sumA += c.ahorroMesARS;
    if(c.totalGastos > s[peor].totalGastos) peor = act[i];
    if(c.totalGastos < s[mejor].totalGastos) mejor = act[i];
    if(c.disponibleFinal < 0) rojos.push(MESES[act[i]]);
  }
  var promG = Math.round(sumG/n), promI = Math.round(sumI/n), promA = Math.round(sumA/n);
  var pct = sumI > 0 ? sumA/sumI : 0, ultimo = act[n-1], faltan = 11 - ultimo;
  var h = '<div class="resumen">';
  h += '<div class="res-hd">' + anillo(pct)
     + '<div class="res-pct"><b>' + Math.round(pct*100) + '%</b>'
     + '<small>de lo que entra lo estás ahorrando</small></div></div>';
  h += '<div class="res-txt">';
  h += '<p>Por mes entran <b>'+fARS(promI)+'</b> y se van <b>'+fARS(promG)+'</b>. Te quedan <b>'+fARS(promI-promG)+'</b>.</p>';
  h += '<p>Gastaste más en <b>'+MESES[peor]+'</b> y menos en <b>'+MESES[mejor]+'</b>.</p>';
  if(faltan > 0 && promA !== 0) h += '<p>A este ritmo cerrás diciembre con <b>'+fARS(s[ultimo].ahorroAcumulado + promA*faltan)+'</b>.</p>';
  if(rojos.length) h += '<p class="mal">' + (rojos.length === 1 ? 'En <b>'+rojos[0]+'</b> gastaste' : 'En <b>'+rojos.length+' meses</b> gastaste')
     + ' más de lo que entró.</p>';
  h += '</div><div class="res-pie">' + n + ' ' + (n === 1 ? 'mes cargado' : 'meses cargados') + ' de ' + D.anio + '</div></div>';
  return h;
}

function lineas(a, b){
  var W=340, H=170, pl=34, pr=6, pt=8, pb=20, i;
  var max = Math.max.apply(null, a.concat(b).concat([1]));
  max = Math.ceil(max/4)*4 || 1;
  var x = function(i){ return pl + i*(W-pl-pr)/11; };
  var y = function(v){ return pt + (H-pt-pb) * (1 - v/max); };
  var g = '';
  for(i=0;i<=3;i++){
    var v = max*i/3, yy = y(v);
    g += '<line x1="'+pl+'" y1="'+yy+'" x2="'+(W-pr)+'" y2="'+yy+'" stroke="currentColor" stroke-opacity=".12"/>'
       + '<text x="'+(pl-5)+'" y="'+(yy+3.5)+'" font-size="8.5" text-anchor="end" fill="currentColor" opacity=".5">'+corto(v)+'</text>';
  }
  function path(arr){ var d=''; for(var i=0;i<12;i++) d += (i?'L':'M') + x(i).toFixed(1) + ' ' + y(arr[i]).toFixed(1) + ' '; return d; }
  for(i=0;i<12;i+=2) g += '<text x="'+x(i)+'" y="'+(H-6)+'" font-size="8.5" text-anchor="middle" fill="currentColor" opacity=".5">'+CORTOS[i]+'</text>';
  g += '<path class="trazo" d="'+path(b)+'" fill="none" stroke="var(--txt2)" stroke-width="2" stroke-linejoin="round"/>';
  g += '<path class="trazo" d="'+path(a)+'" fill="none" stroke="var(--acc)" stroke-width="2.4" stroke-linejoin="round"/>';
  for(i=0;i<12;i++) if(a[i]) g += '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(a[i]).toFixed(1)+'" r="2.4" fill="var(--acc)"/>';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ingresos contra gastos por mes">'+g+'</svg>';
}
function barras(arr){
  var W=340, H=150, pl=34, pr=6, pt=8, pb=20, i;
  var max = Math.max.apply(null, arr.concat([1]));
  var min = Math.min.apply(null, arr.concat([0]));
  max = max <= 0 ? 1 : max;
  var base = pt + (H-pt-pb) * (max/(max-min));
  var g = '<line x1="'+pl+'" y1="'+base.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+base.toFixed(1)+'" stroke="currentColor" stroke-opacity=".2"/>'
        + '<text x="'+(pl-5)+'" y="'+(pt+8)+'" font-size="8.5" text-anchor="end" fill="currentColor" opacity=".5">'+corto(max)+'</text>';
  var an = (W-pl-pr)/12;
  for(i=0;i<12;i++){
    var v = arr[i], alto = Math.abs(v)/(max-min)*(H-pt-pb);
    var xx = pl + i*an + an*0.16, ancho = an*0.68;
    var yy = v >= 0 ? base - alto : base;
    g += '<rect x="'+xx.toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+ancho.toFixed(1)+'" height="'+Math.max(alto,0.6).toFixed(1)+'" rx="2" fill="'+(v<0?'var(--neg)':'var(--acc)')+'" opacity="'+(v?1:.25)+'"/>';
    if(i%2===0) g += '<text x="'+(xx+ancho/2).toFixed(1)+'" y="'+(H-6)+'" font-size="8.5" text-anchor="middle" fill="currentColor" opacity=".5">'+CORTOS[i]+'</text>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ahorro acumulado por mes">'+g+'</svg>';
}

function bloque(k, t, cuerpo){
  return '<div class="sec '+(ayudaAbierta[k]?'':'cerrada')+'"><button class="sechd" data-act="colAyuda" data-k="'+k+'">'
       + '<span class="nom">'+t+'</span><i class="chev"></i></button><div class="cuerpo">'+cuerpo+'</div></div>';
}

function fechaArchivo(){ var d = new Date(); function p(x){ return (x<10?'0':'')+x; } return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function diagCompartir(){
  var out = [];
  if(!navigator.share) return 'este navegador no tiene menú de compartir';
  if(!navigator.canShare) return 'comparte, pero no deja consultar si acepta archivos';
  var intentos = [['.json','application/json','json'],['.json','text/plain','json como texto'],['.txt','text/plain','txt']], i, f;
  for(i=0;i<intentos.length;i++){
    var ok = false;
    try{ f = new File(['{}'], 'x'+intentos[i][0], {type:intentos[i][1]}); ok = navigator.canShare({files:[f]}); }catch(e){ ok = false; }
    out.push(intentos[i][2] + ': ' + (ok ? 'sí' : 'no'));
  }
  return out.join(' · ');
}
function archivoCompartible(texto, base){
  // Chrome en Android no deja compartir cualquier tipo de archivo: se prueban varias combinaciones
  var intentos = [
    [base + '.json', 'application/json'],
    [base + '.json', 'text/plain'],
    [base + '.txt',  'text/plain']
  ], i, f;
  if(!(navigator.share && navigator.canShare)) return null;
  for(i=0;i<intentos.length;i++){
    try{
      f = new File([texto], intentos[i][0], {type:intentos[i][1]});
      if(navigator.canShare({files:[f]})) return f;
    }catch(e){}
  }
  return null;
}
function hacerCopia(){

      if(e && e.name === 'AbortError') return;
      descargar(texto, nombre, 'application/json'); listo();

      // si la app tenía datos y ese año viene en la copia, me quedo ahí; si estaba vacía, abro el último año de la copia
      recordarAnio(teniaDatos && claves.indexOf(String(D.anio)) > -1 ? D.anio : ultimo);
      cargar();

function exportarCSV(){
  var s = serie(D), l = [], i;

  l.push(['Mes','Ingresos','Gastos fijos','Gastos variables','Gastos','Ahorro ARS','Pesos a dólares','Dólares comprados','Pagado a','Saqué del ahorro','Dólares vendidos','Repuse','A reponer','Deudas','Disponible final','Ahorro acumulado','USD del mes','USD acumulado'].join(';'));
  for(i=0;i<12;i++){
    var x = s[i];
    l.push([MESES[i], x.totalIngresos, x.subtotalFijos, x.subtotalVariables, x.totalGastos,
            x.ahorroMesARS, x.compraARS, x.compraUSD, Math.round(x.cotizacionPagada*100)/100, x.sacadoARS, x.ventaUSD, x.reposicionARS, x.aReponer, x.totalDeudas, x.disponibleFinal, x.ahorroAcumulado, x.usdMes, x.usdAcumulado]
           .map(function(v,k){ return k===0 ? c(v) : String(v).replace('.',','); }).join(';'));
  }

function duplicar(){
  var s = serie(D), n = JSON.parse(JSON.stringify(D)), i, j, k;
  n.anio = D.anio + 1;
  n.ahorroAnioAnterior = s[11].ahorroAcumulado;
  Object.keys(n.planDeudas).forEach(function(k){ var e = estadoDeuda(k, 11); if(e) n.planDeudas[k].pagadasAntes = e.pagadas; });
  n.usdAnioAnterior = s[11].usdAcumulado;
  n.aReponerAnterior = s[11].aReponer;
  n.actualizado = '';
  for(i=0;i<12;i++){
    var m = n.meses[i];
    for(j=0;j<SECS.length;j++){
      k = SECS[j].k;
      for(var q=0;q<m[k].length;q++) m[k][q].monto = 0;
    }
    m.ahorroMesARS = 0; m.ahorroMesUSD = 0; m.compraARS = 0; m.compraUSD = 0;
    m.retiroARS = 0; m.ventaUSD = 0; m.ventaARS = 0; m.reposicionARS = 0; m.movimientos = [];
  }
  if(sucio) guardar();
  if(leerAnio(n.anio)){ alerta('Ese año ya existe', 'El ' + n.anio + ' ya está guardado en este teléfono. Cambiá de año desde Ajustes en vez de crearlo de nuevo.'); return; }
  var viejo = D.anio;
  D = n; recordarAnio(D.anio); mes = 0; arrancado = true;
  var cargadas = 0;
  Object.keys(D.planDeudas).forEach(function(nn){
    var pp = D.planDeudas[nn];
    if(!pp.cuotas || !pp.total) return;
    cargadas += cargarCuotas(nn, 0).poner;
  });
  guardar(); render();
  alerta('Listo el ' + D.anio, 'Creé el año con los meses en cero, las mismas categorías y el cierre de '
    + viejo + ' como saldo inicial.'
    + (cargadas ? ' Además dejé cargadas ' + cargadas + ' cuotas de las deudas que seguían abiertas.' : '')
    + ' Ya estás trabajando en él; el ' + viejo + ' sigue guardado.');
}

function pildora(txt, mal){
  var p = document.getElementById('pild');
  if(!p) return;
  p.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4.5 12.5l5 5.2L19.5 7"/></svg><span>' + txt + '</span>';
  p.className = 'pild on' + (mal ? ' aviso' : '');
  ultPild = Date.now();
  if(tPild) clearTimeout(tPild);
  tPild = setTimeout(function(){ p.className = 'pild' + (mal ? ' aviso' : ''); }, 1900);
}
function toast(txt, accion, act, id){
  var t = document.getElementById('toast');
  t.innerHTML = '<span>' + txt + '</span>' + (accion ? '<button data-act="'+act+'" data-id="'+esc(id)+'">'+accion+'</button>' : '');
  t.classList.add('on');
  if(tToast) clearTimeout(tToast);
  tToast = setTimeout(function(){ t.classList.remove('on'); }, 5000);
}
function copiarAnterior(k){
  var act = D.meses[mes][k], ant = D.meses[mes-1][k], i, j, copiables = 0;
  // "Del trabajo" no se copia: lo cargan los pases. Si no queda nada con monto, se avisa sin tocar el mes
  for(i=0;i<ant.length;i++) if(!(k === 'ingresos' && esRenglonTrabajo(ant[i].nombre)) && num(ant[i].monto)) copiables++;
  if(!copiables){ toast('No hay nada para copiar: “' + RENGLON_TRABAJO + '” lo cargás desde Trabajo'); return; }
  for(i=0;i<ant.length;i++){
    if(k === 'ingresos' && esRenglonTrabajo(ant[i].nombre)) continue;
    var hallado = false;
    for(j=0;j<act.length;j++) if(act[j].nombre === ant[i].nombre){ act[j].monto = num(ant[i].monto); hallado = true; break; }
    if(!hallado) act.push({nombre:ant[i].nombre, monto:num(ant[i].monto)});
  }
  tocar(); renderMes();
  toast('Copié ' + MESES[mes-1].toLowerCase() + ' en ' + MESES[mes].toLowerCase());
}

function pintarComoCobras(){

  var h = '', q;
  if(cbx.frec === 'semanal'){

    h += '<button data-act="icDia" data-v="0" class="' + (cbx.dias[0] === 0 ? 'on' : '') + '">D</button></div>';
  } else {
    l.textContent = cbx.frec === 'mensual' ? '¿Qué día del mes? (si querés)' : cbx.frec === 'quincenal' ? 'Elegí los dos días del mes' : 'Elegí los días del mes';
    var dim = diasDelMes(D.anio, mes);
    h = '<div class="grilla-dias">';
    for(q=1;q<=dim;q++) h += '<button data-act="icDia" data-v="' + q + '" class="' + (cbx.dias.indexOf(q) >= 0 ? 'on' : '') + '">' + q + '</button>';

  }

function pintarNotaCobras(){
  var e = document.getElementById('icNota'); if(!e) return;
  var it = {frec:cbx.frec, dias:cbx.dias, monto:0}, n = cuantosPagos(it, D.anio, mes);
  var tot = document.getElementById('icTotal'), cada = document.getElementById('icCada');
  if(cbx.ult === 'cada'){ var vc = parseNum(cada.value); tot.value = n > 0 && vc > 0 ? fARS(Math.round(vc * n)) : ''; }
  else { var vt = parseNum(tot.value); cada.value = n > 0 && vt > 0 ? fARS(Math.round(vt / n)) : ''; }
  e.className = 'nota';
  if(!n){ e.className = 'nota mal'; e.innerHTML = 'Elegí al menos un día.'; return; }
  var t2 = parseNum(tot.value);
  it.monto = t2;
  e.innerHTML = t2 > 0 ? cobroTxt(it) + '. En el mes suman <b>' + fARS(t2) + '</b>.'
                       : 'Poné el total del mes o cuánto es cada pago, y hago la otra cuenta.';
}
function guardarComoCobras(quitar){
  var it = D.meses[mes].ingresos[cobroIdx]; if(!it) return;
  if(quitar){ it.frec = ''; it.dias = []; }
  else {
    var n = cuantosPagos({frec:cbx.frec, dias:cbx.dias}, D.anio, mes);
    if(!n){ errorEn('icNota', 'Elegí al menos un día.'); return; }
    var t = Math.round(parseNum(document.getElementById('icTotal').value));
    if(!(t > 0)){ errorEn('icNota', 'Falta el total del mes o cuánto es cada pago.'); return; }
    it.frec = cbx.frec; it.dias = cbx.dias.slice(); it.monto = t;
  }

  pildora(quitar ? 'Listo' : 'Guardado');
}
function abrirPlan(i){
  var it = D.meses[mes].deudas[i], p = planDe(it.nombre) || {total:0, cuotas:0, pagadasAntes:0};
  planIdx = i;
  abrirHoja('<h3>' + esc(it.nombre || 'Deuda') + '</h3>'
    + '<div class="campo"><label>Total del préstamo</label><input type="text" id="plTotal" inputmode="decimal" value="'+(p.total?fARS(p.total):'')+'"></div>'
    + '<div class="tj-dos">'
    +   '<div class="campo"><label>Cantidad de cuotas</label><input type="text" id="plCuotas" inputmode="numeric" value="'+(p.cuotas||'')+'"></div>'
    +   '<div class="campo"><label>Recargo % (opcional)</label><input type="text" id="plRec" inputmode="decimal" placeholder="sin recargo" value="'+(num(p.recargo)?String(p.recargo).replace('.',','):'')+'"></div>'
    + '</div>'
    + '<div class="nota" id="plCuota" style="padding:0 0 12px"></div>'
    + '<div class="campo"><label>Cuotas que ya pagué antes de '+D.anio+'</label><input type="text" id="plAntes" inputmode="numeric" value="'+(p.pagadasAntes||'')+'"></div>'

  var refrescarCuota = function(){
    var t = parseNum(document.getElementById('plTotal').value);
    var c = Math.round(parseNum(document.getElementById('plCuotas').value));
    var r = parseNum(document.getElementById('plRec').value);
    var e = document.getElementById('plCuota');
    if(!e) return;
    var tc = t * (1 + r/100);
    e.innerHTML = (t > 0 && c > 0)
      ? 'Cada cuota queda en <b>' + fARS(Math.round(tc/c)) + '</b>' + (r ? ', con el ' + String(r).replace('.', ',') + ' % ya sumado (' + fARS(Math.round(tc)) + ' en total)' : ', sin recargo') + '.'
      : 'Poné el total y la cantidad de cuotas y te digo cuánto queda cada una. El recargo es opcional.';
  };
  document.getElementById('plTotal').addEventListener('input', refrescarCuota);
  document.getElementById('plCuotas').addEventListener('input', refrescarCuota);
  document.getElementById('plRec').addEventListener('input', refrescarCuota);
  refrescarCuota();
  var f = document.getElementById('plTotal'); if(f) f.focus();
}
var planIdx = -1;
function guardarPlan(quitar){
  var it = D.meses[mes].deudas[planIdx]; if(!it) return;
  var n = String(it.nombre||'').trim();
  if(quitar){ delete D.planDeudas[n]; }
  else {
    var c = Math.round(parseNum(document.getElementById('plCuotas').value));
    if(!n || c <= 0){ alerta('Falta la cantidad de cuotas', 'Necesito al menos saber en cuántas cuotas es la deuda.'); return; }
    D.planDeudas[n] = {total:parseNum(document.getElementById('plTotal').value), cuotas:c,
                       recargo:parseNum(document.getElementById('plRec').value),
                       pagadasAntes:Math.max(0, Math.round(parseNum(document.getElementById('plAntes').value)))};
  }
  cerrarHoja(); tocar(); renderMes();
  if(!quitar) ofrecerCarga(n, mes);
}
function ofrecerCarga(nombre, desde){
  var p = planDe(nombre); if(!p || !p.cuotas || !p.total) return;
  var pc = planDeCarga(nombre, desde);
  if(pc.poner <= 0){
    if(pc.sobran > 0) alerta('No entran en ' + D.anio,
      'Faltan ' + pc.sobran + ' cuotas de <b>' + esc(nombre) + '</b>, pero ya no quedan meses en ' + D.anio
      + '. Se cargan solas cuando crees el año ' + (D.anio+1) + ' desde Ajustes.');
    return;
  }
  var cuerpo = 'Cada cuota queda en <b>' + fARS(pc.valor) + '</b>.<br><br>Voy a cargarla en <b>' + esc(nombre) + '</b> '
    + (pc.poner === 1 ? 'en ' + MESES[pc.desde].toLowerCase()
                      : 'de ' + MESES[pc.desde].toLowerCase() + ' a ' + MESES[pc.hasta].toLowerCase()
                        + ' (' + pc.poner + ' cuotas)')
    + '. Lo que ya tengas cargado en esos meses en esta deuda se reemplaza.';
  if(pc.sobran > 0) cuerpo += '<br><br>Quedan ' + pc.sobran + ' para después: se cargan solas cuando crees el año ' + (D.anio+1) + '.';
  preguntar('Cargar las cuotas', cuerpo, 'Cargar', function(){
    var r = cargarCuotas(nombre, desde);
    tocar(); renderMes();
    toast('Cargué ' + r.poner + (r.poner === 1 ? ' cuota' : ' cuotas') + ' de ' + fARS(r.valor));
  });
}

    D.ui.col[k] = !D.ui.col[k];

    var nom = D.meses[mes][kk][ii].nombre || 'este ítem';
    confirmar('Borrar '+esc(nom), 'Se borra solo de '+MESES[mes]+'. Los otros meses quedan como están.', 'Borrar', function(){
      borrado = {k:kk, i:ii, mes:mes, it:D.meses[mes][kk][ii]};
      D.meses[mes][kk].splice(ii,1); tocar(); conScroll(renderMes);

    });

  }

  if(a === 'delCripto'){
    var ic = +b.getAttribute('data-i'), ac = D.cripto[ic];
    confirmar('Borrar '+esc(ac.activo || 'este activo'), 'Se borra la cantidad y el precio que cargaste. No se puede deshacer.', 'Borrar', function(){
      D.cripto.splice(ic,1); tocar(); renderUSD(); toast('Activo borrado');

  if(a === 'ocultoSet'){ var q = b.getAttribute('data-v') === '1'; if(q !== oculto) alternarOculto(); return; }
  if(a === 'elegir'){ guardar(true); return; }

  if(a === 'verpc'){ versionPC(); return; }

  if(a === 'ajRaiz'){ ajVista = ''; renderAjustes(); window.scrollTo(0,0); return; }
  if(a === 'duplicar'){ duplicar(); return; }
  if(a === 'volver130'){ volverAntesDe130(); return; }
  if(a === 'tema'){ D.ui.tema = b.getAttribute('data-v'); aplicarTema(); tocar(); renderAjustes(); return; }
  if(a === 'copia'){ hacerCopia(); return; }
  if(a === 'restaurar'){ document.getElementById('fileJson').click(); return; }
  if(a === 'imprimir'){ imprimir(); return; }

  if(a === 'bajar'){ moverOrden(+b.getAttribute('data-i'), 1); return; }

velo.addEventListener('click', function(ev){ if(ev.target === velo){ pendiente = null; cerrarHoja(); } });

document.addEventListener('input', function(ev){
  var t = ev.target;
  if(t.classList.contains('monto') || t.classList.contains('nombre')){
    aplicarInput(t, false);
  }
});
document.addEventListener('keydown', function(ev){
  var t = ev.target;
  if(ev.key === 'Enter' && t && t.classList && (t.classList.contains('monto') || t.classList.contains('nombre'))){ ev.preventDefault(); t.blur(); }
});
document.addEventListener('focusin', function(ev){
  var t = ev.target;
  if(t.classList && t.classList.contains('monto')){
    var v = valorDe(t);
    t.value = t.classList.contains('pct') ? (Math.round(num(v)*10000)/100 || '') : crudo(v);
    if(t.select) t.select();
  }
});
document.addEventListener('focusout', function(ev){
  var t = ev.target;
  if(t.classList && t.classList.contains('monto')){
    aplicarInput(t, true);
    var v = valorDe(t);
    t.value = t.classList.contains('pct') ? fPct(v)
            : t.classList.contains('usd') ? fUSD(v)
            : t.classList.contains('cant') ? crudo(v)
            : fARS(v);
  }
});
function valorDe(t){
  var ci = t.getAttribute('data-cripto');
  if(ci !== null) return D.cripto[+ci][t.getAttribute('data-campo')];
  var campo = t.getAttribute('data-campo');
  if(campo){
    if(campo === 'ahorroAnioAnterior' || campo === 'usdAnioAnterior' || campo === 'cotizacionUSD') return D[campo];
    return D.meses[mes][campo];
  }
  return D.meses[mes][t.getAttribute('data-k')][+t.getAttribute('data-i')].monto;
}
function aplicarInput(t, final){
  var v = t.classList.contains('nombre') ? t.value : parseNum(t.value);
  var ci = t.getAttribute('data-cripto');
  if(ci !== null){
    var cc = D.cripto[+ci], cf = t.getAttribute('data-campo');
    if(cc[cf] !== v){ cc[cf] = v; tocar(); }
    if(final) renderUSD(); return;
  }
  var campo = t.getAttribute('data-campo');
  if(campo){
    if(campo === 'metaAhorroPct') v = num(v)/100;
    v = num(v);
    var cambio = false;
    if(campo === 'cotizacionUSD'){ if(v > 0 && D.cotizacionUSD !== v){ D.cotizacionUSD = v; D.cotizacionFecha = new Date().toISOString(); cambio = true; } }
    else if(campo === 'ahorroAnioAnterior' || campo === 'usdAnioAnterior'){ if(D[campo] !== v){ D[campo] = v; cambio = true; } }
    else if(D.meses[mes][campo] !== v){ D.meses[mes][campo] = v; cambio = true; }
    if(cambio) tocar();
    refrescar();
    if(final && (tab === 'anio' || tab === 'usd')) conScroll(render);
    return;
  }
  var it = D.meses[mes][t.getAttribute('data-k')][+t.getAttribute('data-i')];
  if(t.classList.contains('nombre')){
    if(t.getAttribute('data-k') === 'deudas'){
      var viejo = String(it.nombre||'').trim(), nuevo = String(v).trim();
      if(viejo !== nuevo && D.planDeudas[viejo] && !D.planDeudas[nuevo]){
        D.planDeudas[nuevo] = D.planDeudas[viejo]; delete D.planDeudas[viejo];
        // una deuda con plan es la misma en todos los meses: el nombre viaja con ella
        for(var mj=0;mj<12;mj++){ var ld = D.meses[mj].deudas; for(var mq=0;mq<ld.length;mq++) if(ld[mq] !== it && String(ld[mq].nombre||'').trim() === viejo) ld[mq].nombre = v; }
      }
    }
    if(it.nombre === v) return;
    it.nombre = v;
  } else {
    if(it.monto === num(v)) return;
    it.monto = num(v);
  }
  tocar(); refrescar();

function normTrab(t){

function resumenTrab(){
  var hoy = hoyISO(), mesAct = hoy.slice(0,7), i;
  var r = {porCobrar:0, vencido:0, prox30:0, cobradoMes:0, sinAsignar:0, hoyVendido:0, hoyVentas:0, mesVendido:0,
           cobrado:0, aAcreditar:0, hayPlazo:false};
  for(i=0;i<T.facturas.length;i++){
    var f = T.facturas[i];
    if(f.fecha === hoy){ r.hoyVendido += f.monto; r.hoyVentas++; }
    if(f.fecha.slice(0,7) === mesAct && f.fecha <= hoy) r.mesVendido += f.monto;
    if(f.contado){
      // cobrada en el momento: es plata que ya entró (o que entra ese día, si la fecha es futura)
      if(f.fecha <= hoy) r.cobrado += f.monto; else r.aAcreditar += f.monto;
      if(f.fecha.slice(0,7) === mesAct && f.fecha <= hoy) r.cobradoMes += f.monto;
      continue;
    }
    r.hayPlazo = true;
    var s = saldoFac(f); if(!s) continue;
    var d = diasEntre(hoy, venceFac(f));
    r.porCobrar += s;
    if(d < 0) r.vencido += s; else if(d <= 30) r.prox30 += s;
  }
  for(i=0;i<T.cobros.length;i++){
    var c = T.cobros[i];
    if(c.fecha.slice(0,7) === mesAct && c.fecha <= hoy) r.cobradoMes += c.monto;
    if(c.fecha <= hoy) r.cobrado += c.monto; else r.aAcreditar += c.monto;   // un echeq con fecha futura todavía no es plata
    r.sinAsignar += sinAsignar(c);
  }
  r.pasado = 0; r.pasadoMes = 0;
  for(i=0;i<T.pases.length;i++){ r.pasado += T.pases[i].monto; if(T.pases[i].fecha.slice(0,7) === mesAct) r.pasadoMes += T.pases[i].monto; }
  r.gastado = 0; r.gastadoMes = 0; r.gastoFuturo = 0; r.vendidoSimpleMes = 0; r.hoyForma = {};
  r.hoyGanancia = 0; r.hayCosto = false; r.porFuente = []; r.hayFuente = false; r.facturadoMes = 0; r.facturado12 = 0; r.vencenSemana = 0; r.vencenSemanaMonto = 0;
  for(i=0;i<T.gastos.length;i++){
    var g = T.gastos[i];
    if(g.fecha <= hoy){ r.gastado += g.monto; if(g.fecha.slice(0,7) === mesAct) r.gastadoMes += g.monto; }
    else r.gastoFuturo += g.monto;   // programado: se descuenta cuando llega el día
  }
  var mf = {}, of = [];
  for(i=0;i<T.facturas.length;i++){
    var fh = T.facturas[i];
    if(fh.fecha === hoy && fh.contado){
      r.hoyForma[fh.forma] = (r.hoyForma[fh.forma] || 0) + fh.monto;
      if(fh.costo > 0){ r.hayCosto = true; r.hoyGanancia += ganancia(fh); }
    }
    if(!fh.fuente) continue;
    r.hayFuente = true;
    if(fh.fecha.slice(0,7) !== mesAct || fh.fecha > hoy) continue;
    var kf = clave(fh.fuente);
    if(!mf[kf]){ mf[kf] = {nombre:fh.fuente, total:0, n:0}; of.push(kf); }
    mf[kf].total += fh.monto; mf[kf].n++;
  }
  for(i=0;i<of.length;i++) r.porFuente.push(mf[of[i]]);
  r.porFuente.sort(function(a, b){ return b.total - a.total; });
  var hace12 = sumarDias(hoy, -365);
  for(i=0;i<T.facturas.length;i++){
    var fa = T.facturas[i];
    if(fa.tipo === 'simple'){ if(fa.fecha.slice(0,7) === mesAct && fa.fecha <= hoy) r.vendidoSimpleMes += fa.monto; continue; }
    if(fa.fecha.slice(0,7) === mesAct && fa.fecha <= hoy) r.facturadoMes += fa.monto;
    if(fa.fecha > hace12 && fa.fecha <= hoy) r.facturado12 += fa.monto;
    var sa = saldoFac(fa); if(!sa) continue;
    var dv = diasEntre(hoy, venceFac(fa));
    if(dv >= 0 && dv <= 7){ r.vencenSemana++; r.vencenSemanaMonto += sa; }
  }
  r.disponible = Math.round(r.cobrado - r.gastado - r.pasado);
  return r;
}

// Busca qué facturas explican un pago: primero la combinación exacta; si no hay,
// la que deja una diferencia chica (lo típico de una retención). Nunca más de 14 candidatas.
function sugerir(P, cand){
  var n = Math.min(cand.length, 14), mejor = null, k;
  if(!(P > 0) || !n) return [];
  for(var mask=1; mask < (1<<n); mask++){
    var s = 0, cnt = 0;
    for(k=0;k<n;k++) if(mask & (1<<k)){ s += cand[k].s; cnt++; }
    var dif = s - P;
    if(dif < -0.5 || dif > s * RETENCION_MAX) continue;
    var p = Math.abs(dif) < 1 ? 0 : dif;
    if(!mejor || p < mejor.p || (p === mejor.p && cnt < mejor.c)) mejor = {m:mask, p:p, c:cnt};
  }
  if(!mejor) return [];
  var out = [];
  for(k=0;k<n;k++) if(mejor.m & (1<<k)) out.push(cand[k].id);
  return out;
}
// Reparte un pago entre las facturas elegidas (ordenadas por vencimiento)
function repartir(P, sel, modo){
  var S = 0, out = [], i, resto = P;
  for(i=0;i<sel.length;i++) S += sel[i].s;
  if(!sel.length) return out;
  if(P >= S - 0.5){ for(i=0;i<sel.length;i++) out.push({f:sel[i].f.id, m:sel[i].s, r:0}); return out; }
  if(modo === 'retencion'){
    var acum = 0;
    for(i=0;i<sel.length;i++){
      var m = i === sel.length - 1 ? P - acum : Math.round(sel[i].s * P / S);
      m = Math.max(0, Math.min(sel[i].s, m)); acum += m;
      out.push({f:sel[i].f.id, m:m, r:sel[i].s - m});
    }
    return out;
  }
  for(i=0;i<sel.length && resto > 0;i++){ var mm = Math.min(sel[i].s, resto); resto -= mm; out.push({f:sel[i].f.id, m:mm, r:0}); }
  return out;
}

function copiarTexto(t){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(function(){ toast('Copié el mensaje: pegalo en WhatsApp o en un mail'); }, function(){ copiarViejo(t); }); return; }
  }catch(e){}
  copiarViejo(t);
}
function copiarViejo(t){
  var a = document.getElementById('rcTexto'); if(!a) return;
  a.focus(); a.select();
  try{ document.execCommand('copy'); toast('Copié el mensaje: pegalo en WhatsApp o en un mail'); }catch(e){ toast('Seleccioná el texto y copialo'); }
}
function enviarTexto(t){
  if(navigator.share){
    navigator.share({text:t}).then(function(){ cerrarHoja(); }, function(e){ if(!(e && e.name === 'AbortError')) copiarTexto(t); });
    return;
  }
  copiarTexto(t);   // si el navegador no tiene menú de compartir, queda copiado para pegarlo donde quieras
}

function guardarProducto(){
  var nom = val('pxNombre').trim(), rp = leerMonto('pxPrecio'), rc = leerMonto('pxCosto');
  if(!nom){ errorEn('pxNota', 'Falta el nombre.'); document.getElementById('pxNombre').focus(); return; }
  if(rp.vacio){ errorEn('pxNota', 'Falta el precio.'); document.getElementById('pxPrecio').focus(); return; }
  if(!rp.ok){ errorEn('pxNota', 'Precio: ' + rp.msg + '.'); document.getElementById('pxPrecio').focus(); return; }
  if(!(rp.v > 0)){ errorEn('pxNota', 'El precio tiene que ser mayor que cero.'); document.getElementById('pxPrecio').focus(); return; }
  if(!rc.ok && !rc.vacio){ errorEn('pxNota', 'Lo que te cuesta: ' + rc.msg + '.'); document.getElementById('pxCosto').focus(); return; }
  if(rc.v > rp.v){ errorEn('pxNota', 'Te cuesta más de lo que lo vendés. Si es así, dejá el costo vacío.'); document.getElementById('pxCosto').focus(); return; }
  antesDeCambiar();
  var viejo = px.id ? prodPorId(px.id) : null;
  var datos = {nombre:nom, precio:Math.round(rp.v), costo:Math.round(rc.v), forma:px.forma};
  if(viejo){ for(var k in datos) viejo[k] = datos[k]; }
  else { datos.id = tjId(); datos.creada = new Date().toISOString(); T.productos.push(datos); }
  guardarTrab(true); renderTrabajo(); abrirProductos();
  pildora(viejo ? 'Producto actualizado' : 'Producto guardado');
}

    antesDeCambiar();
    T.productos = T.productos.filter(function(x){ return x.id !== id; });
    guardarTrab(true); renderTrabajo(); abrirProductos();
    pildora('Producto borrado');
  });
}

function generarAbonos(){

  var hoyM = hoyISO().slice(0,7), nuevas = 0, i, guard;
  for(i=0;i<T.facturas.length;i++){
    var f = T.facturas[i];
    if(!f.abono || f.tipo !== 'factura') continue;
    var ym = f.abonoHasta || f.fecha.slice(0,7); guard = 0;
    var hay = {}; hay[f.fecha.slice(0,7)] = 1;
    for(var j=0;j<T.facturas.length;j++) if(T.facturas[j].abonoDe === f.id) hay[T.facturas[j].fecha.slice(0,7)] = 1;
    while(ym < hoyM && guard++ < 120){
      ym = mesSiguiente(ym + '-01').slice(0,7);
      if(hay[ym]) continue;   // ese mes ya tiene su copia: nunca dos del mismo abono
      var n = {id:tjId(), creada:new Date().toISOString(), tipo:'factura', cliente:f.cliente, concepto:f.concepto, monto:f.monto,
               cantidad:f.cantidad, precio:f.precio, contado:f.contado, plazo:f.plazo, forma:f.forma, fecha:fechaEnMes(f.fecha, ym),
               numero: f.numero ? siguienteNumero() : '', abono:false, abonoHasta:'', abonoDe:f.id};
      T.facturas.push(n); nuevas++;

/* pasar a lo personal: suma a un renglón de Ingresos, sin tocar ninguna fórmula del mes */
function renglonTrabajo(d, m, crear){
  var ls = d.meses[m].ingresos, i;
  for(i=0;i<ls.length;i++) if(String(ls[i].nombre || '').trim().toLowerCase() === RENGLON_TRABAJO.toLowerCase()) return ls[i];
  if(!crear) return null;

}
function aplicarPase(p, signo){
  var abierto = p.anio === D.anio, d = abierto ? D : leerAnio(p.anio);
  if(!d) return false;
  var it = renglonTrabajo(d, p.mes, signo > 0);
  if(!it) return false;
  it.monto = Math.max(0, Math.round(num(it.monto) + signo * p.monto));
  if(abierto){ sucio = true; guardar(); return true; }
  d.actualizado = new Date().toISOString();                 // otro año: se escribe ese año guardado, el abierto no se toca
  try{ localStorage.setItem(PREF + d.anio, JSON.stringify(d)); }catch(e){ return false; }
  return true;
}
function fechaPaseDefecto(){
  // si tenés abierto el año de hoy, va a hoy; si tenés abierto otro año, va al mes que estás mirando de ese año
  var h = hoyISO(); if(D.anio === +h.slice(0,4)) return h;
  var dim = new Date(Date.UTC(D.anio, mes + 1, 0)).getUTCDate();
  return D.anio + '-' + dos(mes + 1) + '-' + dos(Math.min(+h.slice(8,10), dim));
}
function destinoPase(){ var fe = val('psFecha'); if(!esISO(fe)) fe = hoyISO(); return {fecha:fe, anio:+fe.slice(0,4), mes:+fe.slice(5,7) - 1}; }
function anioExiste(a){ return a === D.anio || !!leerAnio(a); }
function abrirPase(){
  var r = resumenTrab();
  if(r.disponible <= 0){
    alerta('Todavía no hay plata para pasar', 'Se pasa a lo personal lo que ya cobraste.'
      + (r.aAcreditar ? ' Lo que tiene fecha más adelante vas a poder pasarlo cuando llegue ese día.' : ' Cuando cargues una venta cobrada o un cobro, aparece acá.'));
    return;
  }
  abrirHoja('<h3>Pasar a lo personal</h3>'
    + '<input type="text" id="psMonto" class="grande tj-in" inputmode="decimal" placeholder="0" autocomplete="off">'
    + '<div class="chips"><button data-act="tjPaseTodo">Todo: ' + fARS(r.disponible) + '</button></div>'
    + campoTj('Fecha', '<input type="date" id="psFecha" class="tj-in" value="' + fechaPaseDefecto() + '">')
    + '<div class="nota" id="psNota" style="padding:0 0 14px"></div>'
    + '<div class="fila"><button data-act="cerrarHoja">Cancelar</button><button class="pri" data-act="tjGuardarPase">Pasar</button></div>');
  var fe = document.getElementById('psFecha'), mo = document.getElementById('psMonto');
  fe.addEventListener('input', notaPase); fe.addEventListener('change', notaPase); mo.addEventListener('input', notaPase);
  notaPase(); mo.focus();
}
function notaPase(){
  var e = document.getElementById('psNota'); if(!e) return;
  var d = destinoPase(), r = resumenTrab(), rq = leerMonto('psMonto'), m = Math.round(rq.v);
  e.className = 'nota';
  if(!rq.ok && !rq.vacio){ e.className = 'nota mal'; e.innerHTML = 'Monto: ' + rq.msg + '.'; return; }
  if(!anioExiste(d.anio)){ e.className = 'nota mal'; e.innerHTML = 'El ' + d.anio + ' no está creado en la app. Elegí una fecha de un año que tengas.'; return; }
  if(m > r.disponible + 0.5){ e.className = 'nota mal'; e.innerHTML = 'Es más de lo que tenés disponible (' + fARS(r.disponible) + ').'; return; }
  e.innerHTML = 'Se suma a Ingresos de <b>' + MESES[d.mes] + ' ' + d.anio + '</b>, en el renglón <b>' + RENGLON_TRABAJO + '</b>. Disponible: ' + fARS(r.disponible) + '.'
    + (d.anio !== D.anio ? '<br><span class="neg">Ojo: tenés abierto ' + D.anio + ', así que en la pestaña Mes no lo vas a ver hasta que cambies de año.</span>' : '');
}
function guardarPase(){
  var rq = leerMonto('psMonto'), m = Math.round(rq.v), d = destinoPase(), r = resumenTrab();
  if(!rq.ok && !rq.vacio){ errorEn('psNota', 'Monto: ' + rq.msg + '.'); document.getElementById('psMonto').focus(); return; }
  if(!(m > 0)){ errorEn('psNota', 'Falta cuánto querés pasar.'); document.getElementById('psMonto').focus(); return; }
  if(m > r.disponible + 0.5){ errorEn('psNota', 'Es más de lo que tenés disponible (' + fARS(r.disponible) + ').'); return; }
  if(!anioExiste(d.anio)){ errorEn('psNota', 'El ' + d.anio + ' no está creado en la app. Elegí una fecha de un año que tengas.'); return; }
  var p = {id:tjId(), fecha:d.fecha, monto:m, anio:d.anio, mes:d.mes, creada:new Date().toISOString()};
  if(!aplicarPase(p, 1)){ errorEn('psNota', 'No pude sumarlo al mes. Probá de nuevo.'); return; }
  T.pases.push(p); tjAntes = null;
  guardarTrab(true); cerrarHoja(); renderTrabajo();
  toast('Pasé ' + fARS(m) + ' a Ingresos de ' + MESES[d.mes] + (d.anio !== D.anio ? ' ' + d.anio : ''), 'Deshacer', 'tjDeshacerPase', p.id);
}
function quitarPase(id, avisar){
  var p = null, i;
  for(i=0;i<T.pases.length;i++) if(T.pases[i].id === id) p = T.pases[i];
  if(!p) return;
  var ok = aplicarPase(p, -1);
  T.pases = T.pases.filter(function(x){ return x.id !== id; });
  tjAntes = null; paseQuitado = p;
  guardarTrab(true); renderTrabajo();
  var msg = ok ? 'Saqué ' + fARS(p.monto) + ' de Ingresos de ' + MESES[p.mes]
               : 'Pase borrado. No encontré el renglón “' + RENGLON_TRABAJO + '” en ' + MESES[p.mes] + ': revisalo en Mes.';
  if(avisar) toast(msg, ok ? 'Deshacer' : '', 'tjReponerPase');
  else toast(ok ? 'Deshecho' : msg);
}
function reponerPase(){
  var p = paseQuitado; if(!p) return;
  paseQuitado = null;
  if(!aplicarPase(p, 1)){ toast('No pude volver a sumarlo'); return; }
  T.pases.push(p); guardarTrab(true); renderTrabajo();
  toast('Listo, quedó como antes');
}
function verPase(id){
  var p = null, i; for(i=0;i<T.pases.length;i++) if(T.pases[i].id === id) p = T.pases[i];
  if(!p) return;
  abrirHoja('<h3>Pasado a lo personal</h3><div class="tj-det">'
    + renglon('Monto', fARS(p.monto)) + renglon('Fecha', fDia(p.fecha))

    + '</div><div class="fila"><button class="mal" data-act="tjBorrarPase" data-id="' + esc(p.id) + '">Borrar</button>'
    + '<button data-act="cerrarHoja">Listo</button></div>');
}
function accionTj(a, b){
  var id = b.getAttribute('data-id'), v = b.getAttribute('data-v');
  if(a === 'tjModo'){ modoTrabajo(v === '1'); return; }
  if(a === 'tjCol'){ var k = b.getAttribute('data-k'); T.ui.col[k] = !T.ui.col[k]; plegarAnim(b.parentNode, !!T.ui.col[k]); guardarTrab(true); return; }

  if(a === 'tjModoTr'){ if(T.modo !== v){ T.modo = v === 'pro' ? 'pro' : 'simple'; guardarTrab(true); renderTrabajo(); } return; }
  if(a === 'tjEditarFac'){ var fe0 = facPorId(id); if(fe0 && fe0.tipo === 'simple') abrirVenta(id); else abrirFactura(id); return; }

    else { di.style.display = 'none'; fx.plazo = +v; }
    marcarChips('fxPlazo', b); notaFx(); return;
  }
  if(a === 'tjFxForma'){ fx.forma = v; fx.formaTocada = true; marcarChips('fxForma', b); return; }
  if(a === 'tjVtPeriodo'){ marcarChips('fxPeriodo', b); cambiarPeriodo(v); return; }
  if(a === 'tjVender'){ venderProducto(id); return; }
  if(a === 'tjProds'){ abrirProductos(); return; }
  if(a === 'tjNuevoProd'){ abrirProducto(null); return; }
  if(a === 'tjEditProd'){ abrirProducto(id); return; }
  if(a === 'tjGuardarProd'){ guardarProducto(); return; }
  if(a === 'tjBorrarProd'){ borrarProducto(id); return; }
  if(a === 'tjPxForma'){ px.forma = v; marcarChips('pxForma', b); return; }
  if(a === 'tjNuevoCobro'){ abrirCobro(null); return; }
  if(a === 'tjVerCobro'){ verCobro(id); return; }
  if(a === 'tjEditarCobro'){ abrirCobro(id); return; }
  if(a === 'tjCbForma'){ cb.forma = v; marcarChips('cbForma', b); return; }
  if(a === 'tjCbSel'){ cb.sel[id] = !cb.sel[id]; cb.manual = true; cb.modo = ''; dibujarCobro(); return; }
  if(a === 'tjCbModo'){ cb.modo = v; pintarResCobro(); return; }
  if(a === 'tjGuardarCobro'){ guardarCobro(); return; }
  if(a === 'tjBorrarCobro'){ borrarCobro(id); return; }
  if(a === 'tjDeshacer'){ deshacerTj(); return; }
  if(a === 'tjPasar'){ abrirPase(); return; }
  if(a === 'tjPaseTodo'){
    var r0 = resumenTrab(), mi = document.getElementById('psMonto'), dv = Math.max(0, r0.disponible);
    if(mi){
      if(oculto){ mi.value = ''; mi.setAttribute('placeholder', '••••'); mi.setAttribute('data-guardado', String(dv)); }   // con el ojito cerrado no se escribe el número
      else { mi.value = montoInput(dv); mi.removeAttribute('data-guardado'); }
      notaPase();
    }
    return;
  }
  if(a === 'tjDelTrabajo'){
    var tot = pasesDelMes(D.anio, mes);
    preguntar('Este renglón lo maneja Trabajo',
      'En ' + MESES[mes] + ' pasaste ' + fARS(tot) + ' desde la pestaña Trabajo. Para cambiarlo o sacarlo, borrá esos pases desde ahí: así la plata vuelve al disponible del trabajo y los dos lados siguen cerrando.',
      'Ir a Trabajo', function(){ if(!T.activo){ T.activo = true; guardarTrab(true); aplicarModo(); } irATab('trabajo'); });
    return;
  }
  if(a === 'tjGuardarPase'){ guardarPase(); return; }
  if(a === 'tjDeshacerPase'){ quitarPase(id, false); return; }
  if(a === 'tjVerPase'){ verPase(id); return; }
  if(a === 'tjBorrarPase'){
    var pp = null; for(var q=0;q<T.pases.length;q++) if(T.pases[q].id === id) pp = T.pases[q];
    if(!pp) return;
    confirmar('Borrar el pase', 'Se descuentan ' + fARS(pp.monto) + ' del renglón “' + RENGLON_TRABAJO + '” de ' + MESES[pp.mes] + ' ' + pp.anio + '.', 'Borrar', function(){ quitarPase(id, true); });
    return;
  }
  if(a === 'tjReponerPase'){ reponerPase(); return; }
  if(a === 'tjNuevoGasto'){ abrirGasto(null); return; }
  if(a === 'tjVerGasto'){ verGasto(id); return; }

  if(a === 'tjGuardarGasto'){ guardarGasto(); return; }
  if(a === 'tjBorrarGasto'){ borrarGasto(id); return; }
  if(a === 'tjGxCat'){ gx.cat = v; marcarChips('gxCat', b); return; }
  if(a === 'tjGxMon'){ gx.moneda = v === 'USD' ? 'USD' : 'ARS'; marcarChips('gxMon', b); document.getElementById('gxUsd').style.display = gx.moneda === 'USD' ? 'block' : 'none'; totalGx(); return; }
  if(a === 'tjTope'){ abrirTope(); return; }
  if(a === 'tjTopeGuardar'){ guardarTope(false); return; }
  if(a === 'tjTopeQuitar'){ guardarTope(true); return; }
  if(a === 'tjRepetir'){ repetirFac(id); return; }
  if(a === 'tjCSV'){ csvTrabajo(); return; }

  if(a === 'tjAbonoOff'){ var fa = facPorId(id); if(fa){ antesDeCambiar(); fa.abono = false; guardarTrab(true); cerrarHoja(); renderTrabajo(); toast('Listo: no se repite más', 'Deshacer', 'tjDeshacer'); } return; }
  if(a === 'tjRecordar'){ abrirRecordar(b.getAttribute('data-k')); return; }
  if(a === 'tjCopiarMsg'){ copiarTexto(val('rcTexto')); return; }
  if(a === 'tjEnviarMsg'){ enviarTexto(val('rcTexto')); return; }
}

/* ═══ 13b · seguro de actualización ═════════════════════════════════
   Al pasar de una versión anterior a la 1.30 se guarda una copia cruda de lo
   que había, por las dudas. No convierte ni reescribe nada: los años siguen
   exactamente como estaban, y los campos nuevos se leen con valor por defecto. */
var LSESQ = 'kibo.esquema', LSPRE130 = 'kibo.respaldo.pre130', ESQUEMA = '1.30';
function seguroActualizacion(){
  try{
    if(localStorage.getItem(LSESQ) === ESQUEMA) return false;
    var datos = {}, hay = false, i, k;
    for(i=0;i<localStorage.length;i++){
      k = localStorage.key(i);
      if(!k || k.indexOf('kibo.') !== 0) continue;
      if(k === LSESQ || k === LSPRE130) continue;
      datos[k] = localStorage.getItem(k); hay = true;
    }
    if(hay && !localStorage.getItem(LSPRE130)){
      try{ localStorage.setItem(LSPRE130, JSON.stringify({version:'anterior a 1.30', fecha:new Date().toISOString(), datos:datos})); }
      catch(e){}   // si no entra, seguimos igual: nada de lo que ya está se toca
    }
    try{ localStorage.setItem(LSESQ, ESQUEMA); }catch(e){}
    return hay;
  }catch(e){ return false; }
}
function respaldoPrevio(){
  try{ var r = JSON.parse(localStorage.getItem(LSPRE130) || 'null'); return r && r.datos ? r : null; }catch(e){ return null; }
}
function diasDelRespaldo(){
  var r = respaldoPrevio(); if(!r || !r.fecha) return 0;
  return Math.floor((Date.now() - new Date(r.fecha).getTime()) / 864e5);
}
function volverAntesDe130(){
  var r = respaldoPrevio(); if(!r) return;
  confirmar('Volver a como estaba antes de actualizar',
    'Se restaura todo tal cual estaba el ' + r.fecha.slice(8,10) + '/' + r.fecha.slice(5,7) + ', antes de la 1.30. <b>Lo que cargaste desde entonces se pierde</b>, incluido lo de la pestaña Trabajo. Hacé una copia de seguridad antes, si no la tenés.',
    'Restaurar', function(){
      try{
        var i, k, borrar = [];
        for(i=0;i<localStorage.length;i++){ k = localStorage.key(i); if(k && k.indexOf('kibo.') === 0 && k !== LSPRE130) borrar.push(k); }
        for(i=0;i<borrar.length;i++) localStorage.removeItem(borrar[i]);
        for(k in r.datos) if(r.datos.hasOwnProperty(k)) localStorage.setItem(k, r.datos[k]);
        localStorage.removeItem(LSPRE130);
      }catch(e){ pildora('No se pudo restaurar', true); return; }
      location.reload();
    });
}
function avisoActualizado(){
  var e = document.getElementById('avisos'); if(!e) return;   // reemplaza al recordatorio de copia: este ya lo incluye
  e.innerHTML = '<div class="aviso"><p>Actualizaste a la <b>versión 1.30</b>. Tus datos quedaron como estaban y ahora tenés la pestaña <b>Trabajo</b> si vendés o facturás por tu cuenta. Por las dudas, hacé una copia de seguridad antes de seguir.</p>'
    + '<div class="fila"><button class="mini on" data-act="copia">Hacer copia ahora</button>'
    + '<button class="mini" data-act="cerrarAviso">Después</button></div></div>';
}

/* ═══ 14 · arranque ═══════════════════════════════════ */
try{ localStorage.setItem(PREF + 'test', '1'); localStorage.removeItem(PREF + 'test'); }
catch(e){ hayLS = false; }

var actualizado130 = seguroActualizacion();
D = leerEmbebido();
T = leerTrab();
var abonosNuevos = generarAbonos();
if(respaldoPrevio() && diasDelRespaldo() > 30){ try{ localStorage.removeItem(LSPRE130); }catch(e){} }
aplicarModo();
if(abonosNuevos) setTimeout(function(){ toast((abonosNuevos === 1 ? 'Se generó 1 abono' : 'Se generaron ' + abonosNuevos + ' abonos') + ' en Trabajo'); }, 900);
if(actualizado130) setTimeout(avisoActualizado, 500);
aplicarTema();
aplicarOculto();
render();
cargar();

var desl = {vivo:false, x0:0, y0:0, t0:0};
document.addEventListener('touchstart', function(e){
  desl.vivo = false;
  if(!e.touches || e.touches.length !== 1) return;
  if(velo.classList.contains('on')) return;              // hay una hoja abierta
  if(seDeslizaAlCostado(e.target)) return;
  desl.vivo = true;
  desl.x0 = e.touches[0].clientX; desl.y0 = e.touches[0].clientY; desl.t0 = Date.now();
}, {passive:true});
document.addEventListener('touchend', function(e){
  if(!desl.vivo) return;
  desl.vivo = false;
  var t = e.changedTouches && e.changedTouches[0];
  if(!t) return;
  var dx = t.clientX - desl.x0, dy = t.clientY - desl.y0;
  if(Date.now() - desl.t0 > 700) return;                  // muy lento, no es un deslizamiento
  if(Math.abs(dx) < 70) return;                           // muy corto
  if(Math.abs(dx) < Math.abs(dy) * 1.7) return;           // iba más para arriba o abajo
  if(ajVista){ ajVista = ''; renderAjustes(); window.scrollTo(0,0); return; }   // salir de una subpantalla
  var i = TABS.indexOf(tab) + (dx < 0 ? 1 : -1);
  if(i < 0 || i > TABS.length - 1) return;
  irATab(TABS[i]);
}, {passive:true});

if(location.search.indexOf('gasto=1') > -1) setTimeout(gastoRapido, 350);

if('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('./sw.js')['catch'](function(){});
}
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'hidden' && sucio) guardar();
});
})();
