}

/* cuentas */
function facPorId(id){ for(var i=0;i<T.facturas.length;i++) if(T.facturas[i].id === id) return T.facturas[i]; return null; }
function cobPorId(id){ for(var i=0;i<T.cobros.length;i++) if(T.cobros[i].id === id) return T.cobros[i]; return null; }
function aplicado(fid, sinCobro){
  var t = 0, i, j;
  for(i=0;i<T.cobros.length;i++){
    var c = T.cobros[i]; if(c.id === sinCobro) continue;
    for(j=0;j<c.aplic.length;j++) if(c.aplic[j].f === fid) t += c.aplic[j].m + c.aplic[j].r;
  }
  return t;
}
function saldoFac(f, sinCobro){ if(f.contado) return 0; return Math.max(0, Math.round(f.monto - aplicado(f.id, sinCobro))); }
function acreditaEl(f){
  // si lo que paga esta factura se acredita más adelante (un echeq diferido), devuelve esa fecha
  var hoy = hoyISO(), ult = '', i, j;
  if(f.contado) return f.fecha > hoy ? f.fecha : '';
  for(i=0;i<T.cobros.length;i++){ var c = T.cobros[i]; if(c.fecha <= hoy) continue; for(j=0;j<c.aplic.length;j++) if(c.aplic[j].f === f.id && c.fecha > ult) ult = c.fecha; }
  return ult;
}
function venceFac(f){ return sumarDias(f.fecha, f.plazo); }
function sinAsignar(c){ var t = 0; for(var j=0;j<c.aplic.length;j++) t += c.aplic[j].m; return Math.max(0, Math.round(c.monto - t)); }
function porVencimiento(a, b){ var x = venceFac(a), y = venceFac(b); return x < y ? -1 : x > y ? 1 : 0; }
function pendientes(sinCobro){
  var out = [];
  for(var i=0;i<T.facturas.length;i++) if(saldoFac(T.facturas[i], sinCobro) > 0) out.push(T.facturas[i]);
  return out.sort(porVencimiento);
}
function resumenTrab(){
  var hoy = hoyISO(), mesAct = hoy.slice(0,7), i;
  var r = {porCobrar:0, vencido:0, prox30:0, cobradoMes:0, sinAsignar:0, hoyVendido:0, hoyVentas:0, mesVendido:0,
           cobrado:0, aAcreditar:0, hayPlazo:false, mesDig:0, mesEfe:0};
  for(i=0;i<T.facturas.length;i++){
    var f = T.facturas[i];
    if(f.fecha === hoy){ r.hoyVendido += f.monto; r.hoyVentas++; }
    if(f.fecha.slice(0,7) === mesAct && f.fecha <= hoy) r.mesVendido += f.monto;
    if(f.contado){
      // cobrada en el momento: es plata que ya entró (o que entra ese día, si la fecha es futura)
      if(f.fecha <= hoy) r.cobrado += f.monto; else r.aAcreditar += f.monto;
      if(f.fecha.slice(0,7) === mesAct && f.fecha <= hoy){ r.cobradoMes += f.monto; if(f.forma === 'efectivo') r.mesEfe += f.monto; else r.mesDig += f.monto; }
      continue;
    }
    r.hayPlazo = true;
    var s = saldoFac(f); if(!s) continue;
    var d = diasEntre(hoy, venceFac(f));
    r.porCobrar += s;
    if(d < 0) r.vencido += s; else if(d <= 30) r.prox30 += s;
  }
  for(i=0;i<T.cobros.length;i++){
    var c = T.cobros[i];
    if(c.fecha.slice(0,7) === mesAct && c.fecha <= hoy){ r.cobradoMes += c.monto; if(c.forma === 'efectivo') r.mesEfe += c.monto; else r.mesDig += c.monto; }
    if(c.fecha <= hoy) r.cobrado += c.monto; else r.aAcreditar += c.monto;   // un echeq con fecha futura todavía no es plata
    r.sinAsignar += sinAsignar(c);
  }
  r.pasado = 0; r.pasadoMes = 0; r.pasadoProgramado = 0;
  var anios = Object.create(null);
  for(i=0;i<T.pases.length;i++){
    r.pasado += T.pases[i].monto; if(T.pases[i].fecha.slice(0,7) === mesAct) r.pasadoMes += T.pases[i].monto;
    if(T.pases[i].fecha > hoy && paseAlModelo(T.pases[i], anios)) r.pasadoProgramado += T.pases[i].monto;   // Q4: programado en los dos lados hasta su fecha
  }
  r.gastado = 0; r.gastadoMes = 0; r.gastoFuturo = 0; r.vendidoSimpleMes = 0; r.hoyForma = {};
  r.hoyGanancia = 0; r.hayCosto = false; r.porFuente = []; r.hayFuente = false; r.facturadoMes = 0; r.facturado12 = 0; r.vencenSemana = 0; r.vencenSemanaMonto = 0;
  for(i=0;i<T.gastos.length;i++){
    var g = T.gastos[i];
    if(g.fecha <= hoy){ r.gastado += g.monto; if(g.fecha.slice(0,7) === mesAct) r.gastadoMes += g.monto; }
    else r.gastoFuturo += g.monto;   // programado: se descuenta cuando llega el día
  }
  var mf = Object.create(null), of = [];   // N5 S-1: llaves = fuentes que escribe el usuario
  for(i=0;i<T.facturas.length;i++){
    var fh = T.facturas[i];
    if(fh.fecha === hoy && fh.contado){
      r.hoyForma[fh.forma] = (r.hoyForma[fh.forma] || 0) + fh.monto;
      if(fh.costo > 0){ r.hayCosto = true; r.hoyGanancia += ganancia(fh); }
    }
    if(!fh.fuente) continue;
    r.hayFuente = true;
    if(fh.fecha.slice(0,7) !== mesAct || fh.fecha > hoy) continue;
    var kf = clave(fh.fuente);
    if(!mf[kf]){ mf[kf] = {nombre:fh.fuente, total:0, n:0}; of.push(kf); }
    mf[kf].total += fh.monto; mf[kf].n++;
  }
  for(i=0;i<of.length;i++) r.porFuente.push(mf[of[i]]);
  r.porFuente.sort(function(a, b){ return b.total - a.total; });
  var hace12 = sumarDias(hoy, -365);
  for(i=0;i<T.facturas.length;i++){
    var fa = T.facturas[i];
    if(fa.tipo === 'simple'){ if(fa.fecha.slice(0,7) === mesAct && fa.fecha <= hoy) r.vendidoSimpleMes += fa.monto; continue; }
    if(fa.fecha.slice(0,7) === mesAct && fa.fecha <= hoy) r.facturadoMes += fa.monto;
    if(fa.fecha > hace12 && fa.fecha <= hoy) r.facturado12 += fa.monto;
    var sa = saldoFac(fa); if(!sa) continue;
    var dv = diasEntre(hoy, venceFac(fa));
    if(dv >= 0 && dv <= 7){ r.vencenSemana++; r.vencenSemanaMonto += sa; }
  }
  r.disponible = Math.round(r.cobrado - r.gastado - r.pasado + r.pasadoProgramado);
  r.paraPasar = Math.round(r.cobrado - r.gastado - r.pasado);   // lo que todavía se puede pasar: lo programado ya está comprometido
  return r;
}

// Busca qué facturas explican un pago: primero la combinación exacta; si no hay,
// la que deja una diferencia chica (lo típico de una retención). Nunca más de 14 candidatas.
function sugerir(P, cand){
  var n = Math.min(cand.length, 14), mejor = null, k;
  if(!(P > 0) || !n) return [];
  for(var mask=1; mask < (1<<n); mask++){
    var s = 0, cnt = 0;
    for(k=0;k<n;k++) if(mask & (1<<k)){ s += cand[k].s; cnt++; }
    var dif = s - P;
    if(dif < -0.5 || dif > s * RETENCION_MAX) continue;
    var p = Math.abs(dif) < 1 ? 0 : dif;
    if(!mejor || p < mejor.p || (p === mejor.p && cnt < mejor.c)) mejor = {m:mask, p:p, c:cnt};
  }
  if(!mejor) return [];
  var out = [];
  for(k=0;k<n;k++) if(mejor.m & (1<<k)) out.push(cand[k].id);
  return out;
}
// Reparte un pago entre las facturas elegidas (ordenadas por vencimiento)
function repartir(P, sel, modo){
  var S = 0, out = [], i, resto = P;
  for(i=0;i<sel.length;i++) S += sel[i].s;
  if(!sel.length) return out;
  if(P >= S - 0.5){ for(i=0;i<sel.length;i++) out.push({f:sel[i].f.id, m:sel[i].s, r:0}); return out; }
  if(modo === 'retencion'){
    var acum = 0;
    for(i=0;i<sel.length;i++){
      var m = i === sel.length - 1 ? P - acum : Math.round(sel[i].s * P / S);
      m = Math.max(0, Math.min(sel[i].s, m)); acum += m;
      out.push({f:sel[i].f.id, m:m, r:sel[i].s - m});
    }
    return out;
  }
  for(i=0;i<sel.length && resto > 0;i++){ var mm = Math.min(sel[i].s, resto); resto -= mm; out.push({f:sel[i].f.id, m:mm, r:0}); }
  return out;
}

  if(!p.forma || (p.stock !== null && p.stock <= 0)){ abrirCobroProd(id); return; }   // sin medio por defecto o agotado: se elige, no se cobra de golpe
  venderProducto(id);
}

function guardarProducto(){
  var nom = val('pxNombre').trim(), rp = leerMonto('pxPrecio'), rc = leerMonto('pxCosto');
  if(!nom){ errorEn('pxNota', 'Falta el nombre.'); document.getElementById('pxNombre').focus(); return; }
  if(rp.vacio){ errorEn('pxNota', 'Falta el precio.'); document.getElementById('pxPrecio').focus(); return; }
  if(!rp.ok){ errorEn('pxNota', 'Precio: ' + rp.msg + '.'); document.getElementById('pxPrecio').focus(); return; }
  if(!(rp.v > 0)){ errorEn('pxNota', 'El precio tiene que ser mayor que cero.'); document.getElementById('pxPrecio').focus(); return; }
  if(!rc.ok && !rc.vacio){ errorEn('pxNota', 'Lo que te cuesta: ' + rc.msg + '.'); document.getElementById('pxCosto').focus(); return; }
  if(rc.v > rp.v){ errorEn('pxNota', 'Te cuesta más de lo que lo vendés. Si es así, dejá el costo vacío.'); document.getElementById('pxCosto').focus(); return; }
  var rs = val('pxStock').trim(), stk = null;
  if(rs !== ''){
    stk = parseEntero(rs, true);   // puede quedar negativo si vendiste de más
    if(isNaN(stk)){ errorEn('pxNota', 'Stock: poné un número entero de unidades, o dejalo vacío si no querés controlarlo.'); document.getElementById('pxStock').focus(); return; }
  }
  var carp = nomCarpeta(val('pxCarp')), col = '', lc = carpetas(), ci;
  if(carp){
    for(ci=0;ci<lc.length;ci++) if(!lc[ci].general && lc[ci].k === clave(carp)){ carp = lc[ci].nombre; col = lc[ci].color; }   // misma carpeta aunque la escribas distinto
    col = colorValido(px.color) || col || colorLibre(lc);
  }
  antesDeCambiar();
  var viejo = px.id ? prodPorId(px.id) : null;
  var datos = {nombre:nom, precio:Math.round(rp.v), costo:Math.round(rc.v), forma:px.forma, stock:stk, carpeta:carp, color:col};
  if(viejo){ for(var k in datos) viejo[k] = datos[k]; }
  else { datos.id = tjId(); datos.creada = new Date().toISOString(); T.productos.push(datos); }
  if(carp) for(ci=0;ci<T.productos.length;ci++) if(T.productos[ci].carpeta && clave(T.productos[ci].carpeta) === clave(carp)) T.productos[ci].color = col;   // el color es de la carpeta
  guardarTrab(true); renderTrabajo(); abrirProductos();
  pildora(viejo ? 'Producto actualizado' : 'Producto guardado');
}
function borrarProducto(id){
  var p = prodPorId(id); if(!p) return;
  confirmar('Borrar el producto', 'Se borra el botón de <b>' + esc(p.nombre) + '</b>. Las ventas que ya cargaste con él no se tocan.', 'Borrar', function(){
    antesDeCambiar();
    T.productos = T.productos.filter(function(x){ return x.id !== id; });
    guardarTrab(true); renderTrabajo(); abrirProductos();
    pildora('Producto borrado');
  });
}

function cambiarPeriodo(v){
  fx.periodo = v === 'semana' || v === 'quincena' ? v : '';
  var per = !!fx.periodo, d = document.getElementById('fxDesde');
  document.getElementById('fxUno').style.display = per ? 'none' : 'block';
  document.getElementById('fxPer').style.display = per ? 'block' : 'none';
  // la primera vez propone el rango que termina el día que te pagaron
  if(per && !d.value){ var fe = val('fxFecha'); d.value = sumarDias(esISO(fe) ? fe : hoyISO(), -largoPeriodo(fx.periodo)); }
  // sugerencia de forma de pago: solo si todavía no la elegiste vos
  if(per && !fx.formaTocada && fx.forma === 'efectivo'){ fx.forma = 'transferencia'; marcarChips('fxForma', document.querySelector('#fxForma [data-v="transferencia"]')); }

function totalFactura(){
  var e = document.getElementById('fxTotalF'); if(!e) return;
  var r = leerMonto('fxMonto'), a = parsePct(val('fxAjuste'), true), base = r.v;
  if(isNaN(a)) a = 0;   // mientras no se entienda no se muestra la cuenta; al guardar se avisa
  var t = Math.round(base * (1 + a/100));
  if(!(base > 0) || !a){ e.innerHTML = ''; e.style.display = 'none'; return; }
  e.style.display = '';
  e.innerHTML = fARS(Math.round(base)) + (a > 0 ? ' + ' : ' − ') + String(Math.abs(a)).replace('.', ',') + ' % = <b>' + fARS(t) + '</b>';
}

function guardarFac(){
  var fe = val('fxFecha'); if(!esISO(fe)) fe = hoyISO();
  var viejo = fx.id ? facPorId(fx.id) : null, datos, m;
  if(fx.tipo === 'simple' && fx.periodo){
    var fu = val('fxFuente').trim(), rmp = leerMonto('fxMontoP'), dd = val('fxDesde');
    if(!fu){ errorEn('fxNota', 'Falta de dónde salió: Rappi, Uber, una changa…'); document.getElementById('fxFuente').focus(); return; }
    if(rmp.vacio){ errorEn('fxNota', 'Falta cuánto cobraste.'); document.getElementById('fxMontoP').focus(); return; }
    if(!rmp.ok){ errorEn('fxNota', 'Monto: ' + rmp.msg + '.'); document.getElementById('fxMontoP').focus(); return; }
    m = Math.round(rmp.v);
    if(!(m > 0)){ errorEn('fxNota', 'El monto tiene que ser mayor que cero.'); document.getElementById('fxMontoP').focus(); return; }
    if(!esISO(dd)){ errorEn('fxNota', 'Falta desde qué día es.'); document.getElementById('fxDesde').focus(); return; }
    if(dd > fe){ errorEn('fxNota', 'El período empieza después del día que te pagaron. Revisá las fechas.'); document.getElementById('fxDesde').focus(); return; }
    datos = {tipo:'simple', concepto:'', cantidad:1, precio:m, monto:m, fecha:fe, contado:true, plazo:0, numero:'', forma:fx.forma,
             fuente:fu, periodo:fx.periodo, desde:dd, costo:0};
  } else if(fx.tipo === 'simple'){
    var cq = cantidadDe('fxCant'), rp = leerMonto('fxPrecio');
    if(!cq.ok){ errorEn('fxNota', cq.msg); document.getElementById('fxCant').focus(); return; }
    if(rp.vacio){ errorEn('fxNota', 'Falta el precio.'); document.getElementById('fxPrecio').focus(); return; }

    }

    var baseF = Math.round(rm.v);
    datos = {tipo:'factura', cliente:cli, numero:val('fxNumero').trim(), concepto:val('fxConcepto').trim(), monto:m,
             cantidad: mismo ? viejo.cantidad : 1, precio: mismo ? viejo.precio : m, fecha:fe, contado:contado, plazo:fx.plazo, forma:fx.forma,
             base:baseF, ajuste:aj};

  if(viejo && fx.tipo === 'factura' && nomViejo && clave(nomViejo) !== clave(datos.cliente)) ofrecerRenombrar(nomViejo, datos.cliente, viejo.id);

function fechaEnMes(iso, ym){
  var dim = new Date(Date.UTC(+ym.slice(0,4), +ym.slice(5,7), 0)).getUTCDate();
  return ym + '-' + dos(Math.min(+iso.slice(8,10), dim));
}
function generarAbonos(){
  // cada abono se copia solo en los meses que faltan, hasta el de hoy; lo que borres no vuelve a aparecer
  if(!T || !T.activo) return 0;
  var hoyM = hoyISO().slice(0,7), nuevas = 0, i, guard;
  for(i=0;i<T.facturas.length;i++){
    var f = T.facturas[i];
    if(!f.abono || f.tipo !== 'factura') continue;
    var ym = f.abonoHasta || f.fecha.slice(0,7); guard = 0;
    var hay = {}; hay[f.fecha.slice(0,7)] = 1;
    for(var j=0;j<T.facturas.length;j++) if(T.facturas[j].abonoDe === f.id) hay[T.facturas[j].fecha.slice(0,7)] = 1;
    while(ym < hoyM && guard++ < 120){
      ym = mesSiguiente(ym + '-01').slice(0,7);
      if(hay[ym]) continue;   // ese mes ya tiene su copia: nunca dos del mismo abono
      var n = {id:tjId(), creada:new Date().toISOString(), tipo:'factura', cliente:f.cliente, concepto:f.concepto, monto:f.monto,
               cantidad:f.cantidad, precio:f.precio, contado:f.contado, plazo:f.plazo, forma:f.forma, fecha:fechaEnMes(f.fecha, ym),
               numero: f.numero ? siguienteNumero() : '', abono:false, abonoHasta:'', abonoDe:f.id};
      T.facturas.push(n); nuevas++;
    }
    f.abonoHasta = hoyM;
  }
  if(nuevas) guardarTrab(true);
  return nuevas;
}
function repetirFac(id){

  n.abono = false; n.abonoHasta = ''; n.abonoDe = '';
  n.numero = f.numero ? siguienteNumero() : '';
  T.facturas.push(n); guardarTrab(true); cerrarHoja(); renderTrabajo();
  toast('Copié la factura al ' + fDia(n.fecha) + (n.numero ? ' con el número ' + n.numero : ', sin número'), 'Deshacer', 'tjDeshacer');
}

function blobAlDia(clave, obj){   // lo guardado sigue en la revisión que esta pestaña tiene (si no, otra pestaña guardó en el medio)

/* ═══ L8 · escrituras de varios blobs juntos (diario) ═══
   localStorage no tiene transacciones y un pase escribe dos blobs (el año del renglón y Trabajo). Antes de la primera escritura se guarda
   en kibo.diario el texto COMPLETO que va a quedar en cada blob y la revisión que cada uno tiene ahora; después se escriben los blobs y se
   borra el diario. Si la app se corta en el medio, al arrancar recuperarDiario termina lo que faltaba, solo si esos blobs siguen en la
   revisión de antes; si otra pestaña los cambió, no toca nada y aparta el diario en cuarentena. Nunca se aplica dos veces: se escribe el
   texto completo, no una suma. Si el diario no entra, no se escribe nada. kibo.diario es del teléfono, como la cuarentena: claveMia no la
   incluye, así que ninguna copia, respaldo ni vuelta atrás la lleva o la borra. */
function escribirJuntos(lista, op){   // lista [{clave, obj}] en orden; 'ok' | 'conflicto' | 'roto' | 'error' (nada escrito) | 'amedias' (lo termina el próximo arranque)
  var plan = [], previos = [], ahora = new Date().toISOString(), i, j, b, st, mia, rv, ac, falla;
  for(i=0;i<lista.length;i++){
    b = lista[i]; st = revGuardada(b.clave); mia = revValida(b.obj.rev) || 0;
    if(st.roto){ if(b.clave !== LSTRAB || !ponerEnCuarentena(b.clave, st.texto)) return 'roto'; }   // como escribirConRev: un año ilegible no se pisa; Trabajo sí, ya copiado
    else if(st.hay && st.rev !== mia) return 'conflicto';
    rv = b.obj.rev; ac = b.obj.actualizado;
    b.obj.rev = mia + 1; b.obj.actualizado = ahora;
    plan.push({clave: b.clave, hay: st.hay, rev: st.rev, roto: !!st.roto, texto: JSON.stringify(b.obj)});
    if(rv === undefined) delete b.obj.rev; else b.obj.rev = rv;
    b.obj.actualizado = ac;
  }

  catch(e){ try{ localStorage.removeItem(LSDIARIO); }catch(e2){} return 'error'; }   // el diario no entró: no se escribe nada
  for(i=0;i<plan.length;i++){
    try{ previos[i] = localStorage.getItem(plan[i].clave); localStorage.setItem(plan[i].clave, plan[i].texto); }
    catch(e){
      falla = false;   // lo ya escrito vuelve a como estaba; si tampoco se puede, el diario queda y el próximo arranque lo termina
      for(j=i-1;j>=0;j--){ try{ if(previos[j] === null) localStorage.removeItem(plan[j].clave); else localStorage.setItem(plan[j].clave, previos[j]); }catch(e2){ falla = true; } }
      if(falla) return 'amedias';
      try{ localStorage.removeItem(LSDIARIO); }catch(e2){}

  try{ localStorage.removeItem(LSDIARIO); }catch(e){}   // si no se pudo borrar, el próximo arranque ve todo escrito y solo lo borra
  for(i=0;i<lista.length;i++){ lista[i].obj.rev = (revValida(lista[i].obj.rev) || 0) + 1; lista[i].obj.actualizado = ahora; }

function diarioValido(j){
  if(!j || typeof j !== 'object' || !Array.isArray(j.blobs) || !j.blobs.length) return false;
  return j.blobs.every(function(b){
    var o = null;
    if(!b || typeof b.clave !== 'string' || typeof b.texto !== 'string' || typeof b.hay !== 'boolean' || typeof b.rev !== 'number') return false;
    if(b.clave !== LSTRAB && !(b.clave.indexOf(PREF) === 0 && /^\d{4}$/.test(b.clave.slice(PREF.length)))) return false;   // solo blobs de datos: nunca otra clave
    try{ o = JSON.parse(b.texto); }catch(e){ return false; }
    return !!o && typeof o === 'object' && !Array.isArray(o);
  });
}
function apartarDiario(s){   // otra pestaña cambió algo en el medio (o el diario no se entiende): no se toca ningún blob; el diario va a cuarentena
  if(ponerEnCuarentena(LSDIARIO, s)){ try{ localStorage.removeItem(LSDIARIO); }catch(e){} }

// al arrancar, antes de leer o guardar nada: '' (no había) | 'hecho' (ya estaba todo escrito) | 'completado' | 'apartado' | 'pendiente' (no entró: queda el diario)
function recuperarDiario(){
  var s, j, i, b, st, cur, faltan = [];
  try{ s = localStorage.getItem(LSDIARIO); }catch(e){ return ''; }
  if(s === null || s === undefined) return '';
  try{ j = JSON.parse(s); }catch(e){ j = null; }
  if(!diarioValido(j)) return apartarDiario(s);
  for(i=0;i<j.blobs.length;i++){
    b = j.blobs[i];
    try{ cur = localStorage.getItem(b.clave); }catch(e){ return 'pendiente'; }
    if(cur === b.texto) continue;   // este ya quedó escrito
    st = revGuardada(b.clave);
    if(st.hay !== b.hay || st.rev !== b.rev || !!st.roto !== !!b.roto) return apartarDiario(s);   // ya no es el de antes: no se pisa
    faltan.push({b: b, st: st});
  }
  for(i=0;i<faltan.length;i++){
    if(faltan[i].st.roto && !ponerEnCuarentena(faltan[i].b.clave, faltan[i].st.texto)) return 'pendiente';
    try{ localStorage.setItem(faltan[i].b.clave, faltan[i].b.texto); }catch(e){ return 'pendiente'; }
  }
  try{ localStorage.removeItem(LSDIARIO); }catch(e){}
  return faltan.length ? 'completado' : 'hecho';
}

/* Un pase escribe dos blobs: PRIMERO el año del renglón, DESPUÉS Trabajo, los dos juntos con el diario (L8, escribirJuntos).
   cambiarT() hace en memoria el cambio de Trabajo (agrega o saca el pase) y devuelve la función que lo deshace.
   Garantías: (1) antes de escribir nada se revisan las dos revisiones (R4.6: un evento `storage` perdido no deja un blob escrito y el otro
   rechazado); (2) si algo no se puede escribir, el renglón y Trabajo vuelven a como estaban en memoria y se devuelve false; (3) L8: si la
   app se corta entre las dos escrituras, el próximo arranque termina la otra (o, si otra pestaña cambió algo, no toca nada y avisa).
   Devuelve true (escritos los dos), false (no se escribió nada) o 'sinRenglon' (no hay renglón para descontar o ese año no existe: no se
   escribió nada y Trabajo no se cambió). */
function aplicarPase(p, signo, cambiarT){
  if(obsoleta){ avisoOtraPestana(); return false; }   // pestaña vieja (R4.3): no escribe ningún año, tampoco otro que el abierto, hasta recargar
  var abierto = p.anio === D.anio;

  var d = abierto ? D : leerAnio(p.anio);

  if(!it) return 'sinRenglon';
  var antes = it.monto;

  var deshacerT = cambiarT(), r = escribirJuntos([{clave: PREF + d.anio, obj: d}, {clave: LSTRAB, obj: T}], 'pase');
  if(r === 'ok'){

    marcarVencidos(); estado(true); quitarAvisoVacia();

  if(ls.length > largo) ls.splice(largo, 1); else it.monto = antes;   // no quedó escrito: el renglón vuelve a como estaba
  if(r === 'conflicto'){ obsoleta = true; avisoOtraPestana(); }

}
function cierreAnioAnterior(d, hoy){   // cierre de diciembre del año anterior, en vivo, solo si el año arranca de ese cierre y el anterior tiene modelo; si no, manda el arrastre guardado
  var ar = d.arrastre, prev;
  if(!ar || ar.desde !== 0 || !ar.inicial || ar.inicial.origen !== 'arrastre') return null;
  prev = leerAnio(d.anio - 1);
  if(!prev || !prev.arrastre) return null;
  return cadena(prev, hoy, ctxModelo(prev, hoy)).meses[11].cierre;
}
/* ═══ R5: escrituras del modelo desde la pantalla (D2, D6) ═══
   Todas pasan por guardarModelo: pestaña vieja o revisión ajena -> no escribe nada; respaldo previo antes de la primera escritura del
   modelo en este teléfono; si el año no se puede guardar, la memoria vuelve a como estaba. Nunca se crea un movimiento (D2, D14). */
function guardarModelo(aplicar){   // aplicar() cambia D y devuelve la función que lo deshace
  if(!arrancado || !D) return false;
  if(obsoleta){ avisoOtraPestana(); return false; }
  if(!blobAlDia(PREF + D.anio, D)){ obsoleta = true; avisoOtraPestana(); return false; }   // otra pestaña guardó y esta se perdió el aviso
  if(!asegurarSnapshotR4()){ pildora('No pude guardar la copia previa. No cambié nada.', true); return false; }
  var eraSucio = sucio, deshacer = aplicar();
  sucio = true;
  if(guardar() !== false) return true;
  deshacer(); sucio = eraSucio;
  return false;
}
// cómo se edita el disponible inicial del mes de arranque: 'actual' (el mes de arranque es el de hoy: se pregunta lo disponible ahora, Q1),
// 'apertura' (mes de arranque ya pasado: se escribe la apertura misma, D2) o 'diciembre' (viene del cierre del año anterior: se corrige ese cierre)
function modoApertura(d, hoy){
  var ar = d && d.arrastre; if(!ar) return null;
  var o = ar.inicial && ar.inicial.origen;
  if(o === 'arrastre') return 'diciembre';
  return d.anio === hoy.anio && ar.desde === hoy.mes ? 'actual' : 'apertura';
}
function fijarApertura(valor, modo){
  if(!D || !D.arrastre || typeof valor !== 'number' || !isFinite(valor)) return false;
  var hoy = hoyApp(), ar = D.arrastre, ctx = ctxModelo(D, hoy), real = modoApertura(D, hoy), ini, n, f;
  if(modo !== real || real === 'diciembre') return false;
  if(modo === 'actual'){ n = iniciarArrastre(D, hoy, valor, ctx); if(!n) return false; ini = n.inicial; }   // misma derivación que el primer uso
  else {   // la apertura escrita; lo declarado guarda la misma identidad de iniciarArrastre: apertura = declarado - (resultado + pases netos) del mes
    f = flujosMes(D, ar.desde, hoy, ctx);
    ini = {apertura: valor, declarado: Math.round((valor + f.resultado + f.pasesNetos) * 100) / 100, declaradoEl: hoy.iso, origen: 'declarado'};
  }
  var viejo = ar.inicial;
  return guardarModelo(function(){ ar.inicial = ini; return function(){ ar.inicial = viejo; }; });
}
// cierre real de un mes pasado del modelo (D2): {valor, calculadoAlConfirmar, confirmadoEl}; valor null = quitar la confirmación
function fijarCierreReal(j, valor){
  var hoy = hoyApp(), vm = vistaModelo(D, hoy), e = vm && vm.cad.meses[j];
  if(!e || e.legacy || e.estado !== 'pasado') return false;
  if(valor !== null && (typeof valor !== 'number' || !isFinite(valor))) return false;
  var m = D.meses[j], viejo = m.cierreReal, nuevo = valor === null ? null : {valor: valor, calculadoAlConfirmar: e.cierreCalc, confirmadoEl: hoy.iso};
  if(nuevo === null && !viejo) return false;
  return guardarModelo(function(){
    if(nuevo) m.cierreReal = nuevo; else delete m.cierreReal;
    return function(){ if(viejo) m.cierreReal = viejo; else delete m.cierreReal; };
  });
}
// "Mantener" (D6): el valor confirmado queda igual; se anota que ya viste el cambio de lo calculado
function hayCierreParaMantener(e){ return !!e && !e.legacy && e.estado === 'pasado' && e.cierreReal !== null; }   // solo un mes pasado del modelo con un cierre confirmado
function mantenerCierreReal(j){
  var hoy = hoyApp(), vm = vistaModelo(D, hoy), e = vm && vm.cad.meses[j];
  if(!hayCierreParaMantener(e)) return false;
  return fijarCierreRealValor(j, e.cierreReal, e.cierreCalc, hoy);
}
// el botón "Mantener": un pedido que ya no corresponde (el mes dejó de ser pasado o ya no tiene cierre confirmado) se avisa como tal y se repinta;
// si la escritura falla, guardarModelo/guardar ya avisaron (otra pestaña, copia previa, año ilegible o "No se pudo guardar"): no se repite la píldora
function mantenerCierreHoja(j){
  var vm = vistaModelo(D, hoyApp());
  if(!hayCierreParaMantener(vm && vm.cad.meses[j])){ conScroll(renderMes); pildora('Ese mes ya no tiene un cierre confirmado para mantener'); return; }
  if(!mantenerCierreReal(j)) return;
  conScroll(renderMes); pildora('Se mantiene el cierre confirmado');
}
function fijarCierreRealValor(j, valor, calculado, hoy){
  var m = D.meses[j], viejo = m.cierreReal;
  return guardarModelo(function(){
    m.cierreReal = {valor: valor, calculadoAlConfirmar: calculado, confirmadoEl: hoy.iso};
    return function(){ m.cierreReal = viejo; };
  });
}
// ── pantalla: primer uso, disponible inicial, cierre real ──
function leerMontoDe(id, neg){   // {ok, v, msg}: vacío no vale (hay que escribir un monto, también 0)
  var inp = document.getElementById(id), txt = inp ? String(inp.value).trim() : '', v;
  if(txt === '') return {ok:false, msg:'Escribí un monto.'};
  var ex = inp && inp.getAttribute ? inp.getAttribute('data-exacto') : null;   // precargado y sin tocar: el valor exacto de origen
  if(ex !== null && ex !== '' && txt === String(inp.getAttribute('value') || '').trim() && isFinite(+ex)){ marcarErr(inp, false); return {ok:true, v:+ex}; }
  v = parseMonto(txt, neg);
  if(isNaN(v)){ marcarErr(inp, true); return {ok:false, msg:'No entendí «' + txt + '» como número.'}; }
  marcarErr(inp, false);
  return {ok:true, v:v};
}
function notaEn(id, txt){ var e = document.getElementById(id); if(e) e.textContent = txt; }
function primerUso(omitir){
  var v = null, r;
  if(!omitir){ r = leerMontoDe('inPrimerUso', false); if(!r.ok){ notaEn('notaPrimerUso', r.msg); return; } v = r.v; }
  if(!activarSaldos(v)){ if(!obsoleta) pildora('No se pudo guardar', true); return; }
  conScroll(renderMes);
  pildora(omitir ? 'Listo, sin saldo inicial' : 'Saldo guardado');
}
// el monto para precargar una hoja de saldos: miles con punto y, si tiene centavos, coma y dos decimales (se lee de vuelta con parseMonto)
function montoEditable(n){
  var c = Math.round(num(n) * 100), a = Math.abs(c), ent = Math.floor(a / 100), dec = a % 100;
  var t = (ent === 0 ? '0' : grupos(String(ent))) + (dec ? ',' + (dec < 10 ? '0' : '') + dec : '');
  return c < 0 ? '-' + t : t;
}
// atributos de un campo precargado: el texto que se ve y el valor exacto de origen (si no lo tocás, se guarda ese, sin redondeo)
function attrExacto(v, texto){ return ' value="' + esc(texto) + '" data-exacto="' + esc(String(num(v))) + '"'; }
function editarApertura(j){
  var hoy = hoyApp(), vm = vistaModelo(D, hoy), e = vm && vm.cad.meses[j];
  if(!e || e.legacy) return;
  if(j > vm.cad.resumen.desde){ abrirCierre(j - 1); return; }   // la apertura de este mes ES el cierre del anterior (D2)
  var modo = modoApertura(D, hoy), desde = vm.cad.resumen.desde;
  if(modo === 'diciembre'){
    if(estadoMes(D.anio - 1, 11, hoy) !== 'pasado') return;   // diciembre todavía no cerró: su cierre no se puede corregir (htmlSaldo no ofrece Editar)
    if(obsoleta){ avisoOtraPestana(); return; }   // pestaña vieja: cambiar de año tiraría lo que no se guardó
    var prev = leerAnio(D.anio - 1);
    if(!prev || !prev.arrastre){ alerta('Viene del año anterior', 'Este saldo sale del cierre de diciembre ' + (D.anio - 1) + '. Ese año no está en este teléfono, o no lleva el saldo de un mes al otro, así que no se puede corregir desde acá.'); return; }
    if(sucio && guardar() === false) return;   // lo que no quedó guardado no se pierde al cambiar de año
    cambiarAnio(D.anio - 1); mes = 11; renderMes(); abrirCierre(11); return;
  }
  var actual = modo === 'actual';
  abrirHoja('<h3>' + (actual ? '¿Cuánto dinero tenés disponible actualmente?' : '¿Con cuánto dinero empezaste ' + MESES[desde] + '?') + '</h3>'
    + '<div class="texto" style="margin-bottom:12px">' + (actual ? 'Con esto calculo con cuánto empezaste ' + MESES[desde] + '.' : 'Es el disponible inicial de ' + MESES[desde] + '.')
    + ' No se crea ningún movimiento.</div>'
    + '<input type="text" id="inApertura" class="grande" inputmode="decimal" placeholder="0" autocomplete="off" enterkeyhint="done"'
    + (actual ? (vm.cad.resumen.disponibleActual > 0 ? attrExacto(vm.cad.resumen.disponibleActual, montoEditable(vm.cad.resumen.disponibleActual)) : ' value=""')
              : attrExacto(e.apertura, montoEditable(e.apertura))) + '>'
    + '<div class="nota mal" id="notaApertura" style="padding:0 0 12px"></div>'
    + '<div class="fila"><button data-act="cerrarHoja">Cancelar</button><button class="pri" data-act="aperturaOk" data-v="' + modo + '">Guardar</button></div>');
  var inp = document.getElementById('inApertura');
  inp.addEventListener('keydown', function(ev){ if(ev.key === 'Enter'){ ev.preventDefault(); guardarAperturaHoja(modo); } });
  inp.focus();
}
function guardarAperturaHoja(modo){
  var r = leerMontoDe('inApertura', modo !== 'actual');
  if(!r.ok){ notaEn('notaApertura', r.msg); return; }
  if(!fijarApertura(r.v, modo)){ if(!obsoleta) notaEn('notaApertura', 'No se pudo guardar. Probá de nuevo.'); else cerrarHoja(); return; }
  cerrarHoja(); conScroll(renderMes); pildora('Disponible inicial guardado');
}
function abrirCierre(j){
  var vm = vistaModelo(D, hoyApp()), e = vm && vm.cad.meses[j];
  if(!e || e.legacy || e.estado !== 'pasado') return;
  var conf = e.cierreReal !== null;
  abrirHoja('<h3>Cierre de ' + MESES[j] + ' ' + D.anio + '</h3>'
    + '<div class="texto" style="margin-bottom:12px">¿Es correcto? Si al terminar el mes tenías otra plata, cargá el saldo real. La diferencia queda anotada; no se crea ningún movimiento.</div>'
    + '<div class="sdo hoja-sdo">' + filaSaldo('Según tus registros', fARS(e.cierreCalc)) + '</div>'
    + '<small class="sdo-lbl">Saldo real</small>'
    + '<input type="text" id="inCierre" class="grande" inputmode="decimal" placeholder="0" autocomplete="off" enterkeyhint="done"' + attrExacto(conf ? e.cierreReal : e.cierreCalc, montoEditable(conf ? e.cierreReal : e.cierreCalc)) + '>'
    + '<div class="sdo hoja-sdo">' + filaSaldo('Diferencia', '<span id="difCierre"></span>') + '</div>'
    + '<div class="nota mal" id="notaCierre" style="padding:0 0 12px"></div>'
    + '<div class="fila"><button data-act="cerrarHoja">Cancelar</button>'
    + (conf ? '<button data-act="cierreQuitar" data-m="' + j + '">Quitar confirmación</button>' : '')
    + '<button class="pri" data-act="cierreOk" data-m="' + j + '">Confirmar</button></div>');
  var inp = document.getElementById('inCierre');
  var pintar = function(){ var v = parseMonto(inp.value, true), d = document.getElementById('difCierre'); if(d) d.textContent = isNaN(v) ? '—' : fARS(v - e.cierreCalc); };
  inp.addEventListener('input', pintar);
  inp.addEventListener('keydown', function(ev){ if(ev.key === 'Enter'){ ev.preventDefault(); guardarCierreHoja(j); } });
  pintar(); inp.focus();
}
function guardarCierreHoja(j){
  var r = leerMontoDe('inCierre', true);
  if(!r.ok){ notaEn('notaCierre', r.msg); return; }
  if(!fijarCierreReal(j, r.v)){ if(!obsoleta) notaEn('notaCierre', 'No se pudo guardar.'); else cerrarHoja(); return; }
  cerrarHoja(); conScroll(renderMes); pildora('Cierre confirmado');
}
function quitarCierreHoja(j){
  if(!fijarCierreReal(j, null)){ if(!obsoleta) notaEn('notaCierre', 'No se pudo guardar.'); else cerrarHoja(); return; }
  cerrarHoja(); conScroll(renderMes); pildora('Volvió a lo calculado');
}
function confirmarAvisoCierre(j){
  var vm = vistaModelo(D, hoyApp()), e = vm && vm.cad.meses[j];
  if(!e || e.legacy) return;
  if(!fijarCierreReal(j, e.cierreCalc)){ if(!obsoleta) pildora('No se pudo guardar', true); return; }
  conScroll(renderMes); pildora('Cierre confirmado');
}
// Arranca el modelo de saldos del año abierto con lo que el usuario declara tener disponible ahora (null = lo saltea). La llama la pregunta del primer uso (R5).
// Idempotente: si el año ya tiene arrastre no hace nada. Devuelve true solo si escribió.
function activarSaldos(declarado){
  if(!arrancado || !D || D.arrastre) return false;
  if(obsoleta){ avisoOtraPestana(); return false; }
  if(!blobAlDia(PREF + D.anio, D)){ obsoleta = true; avisoOtraPestana(); return false; }   // R5: otra pestaña guardó y esta se perdió el aviso: ni respaldo ni marca
  var hoy = hoyApp(), ar = iniciarArrastre(D, hoy, declarado === undefined ? null : declarado, ctxModelo(D, hoy));
  if(!ar) return false;   // no es el año de hoy, o lo declarado no es un número
  if(!asegurarSnapshotR4()){ pildora('No pude guardar la copia previa. No cambié nada.', true); return false; }
  D.arrastre = ar; sucio = true; guardar();
  if(sucio){ delete D.arrastre; return false; }   // no se pudo guardar (otra pestaña guardó antes o el navegador no deja): en memoria tampoco queda
  return true;
}
function avisoActualizado(){
  var e = document.getElementById('avisos'); if(!e) return;   // reemplaza al recordatorio de copia: este ya lo incluye
  // L1 (hallazgo 15): la versión real (APPVER) y en pocas líneas, para no empujar "Tenés hoy" fuera de la pantalla
  e.innerHTML = sinTaparCuarentena(e) + '<div class="aviso aviso-corto" id="avisoVersion"><p>Actualizaste a la <b>versión ' + APPVER + '</b>. Tus datos quedaron como estaban; por las dudas, hacé una copia.</p>'
    + '<div class="fila"><button class="mini on" data-act="copia">Hacer copia</button>'
    + '<button class="mini" data-act="cerrarAviso">Después</button></div></div>';
}

/* ═══ 14 · arranque ═══════════════════════════════════ */
try{ localStorage.setItem(PREF + 'test', '1'); localStorage.removeItem(PREF + 'test'); }
catch(e){ hayLS = false; }

var diario = hayLS ? recuperarDiario() : '';   // L8: antes de leer o guardar nada, se termina (o se aparta) un pase que quedó a medias
if(diario === 'pendiente') obsoleta = true;   // no entró: nada se guarda hasta recargar, así el diario lo puede terminar
var actualizado130 = seguroActualizacion();
D = leerEmbebido();
T = leerTrab();
var abonosNuevos = generarAbonos();
if(respaldoPrevio() && diasDelRespaldo() > 30){ try{ localStorage.removeItem(LSPRE130); }catch(e){} }
vencerRespaldoR4();
aplicarModo();
if(abonosNuevos) setTimeout(function(){ toast((abonosNuevos === 1 ? 'Se generó 1 abono' : 'Se generaron ' + abonosNuevos + ' abonos') + ' en Trabajo'); }, 900);
if(actualizado130) setTimeout(avisoActualizado, 500);
aplicarTema();
aplicarOculto();
render();
cargar();
if(diario === 'apartado' || diario === 'pendiente') avisoDiario(diario);

var desl = {vivo:false, x0:0, y0:0, t0:0};
document.addEventListener('touchstart', function(e){
  desl.vivo = false;
  if(!e.touches || e.touches.length !== 1) return;
  if(velo.classList.contains('on')) return;              // hay una hoja abierta
  if(seDeslizaAlCostado(e.target)) return;
  desl.vivo = true;
  desl.x0 = e.touches[0].clientX; desl.y0 = e.touches[0].clientY; desl.t0 = Date.now();
}, {passive:true});
document.addEventListener('touchend', function(e){
  if(!desl.vivo) return;
  desl.vivo = false;
  var t = e.changedTouches && e.changedTouches[0];
  if(!t) return;
  var dx = t.clientX - desl.x0, dy = t.clientY - desl.y0;
  if(Date.now() - desl.t0 > 700) return;                  // muy lento, no es un deslizamiento
  if(Math.abs(dx) < 70) return;                           // muy corto
  if(Math.abs(dx) < Math.abs(dy) * 1.7) return;           // iba más para arriba o abajo
  if(ajVista){ ajVista = ''; renderAjustes(); window.scrollTo(0,0); return; }   // salir de una subpantalla
  var i = TABS.indexOf(tab) + (dx < 0 ? 1 : -1);
  if(i < 0 || i > TABS.length - 1) return;
  irATab(TABS[i]);
}, {passive:true});

if(location.search.indexOf('gasto=1') > -1) setTimeout(gastoRapido, 350);

if('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('./sw.js')['catch'](function(){});
}
window.addEventListener('storage', alCambiarOtraPestana);   // otra pestaña guardó: se recarga sola si esta no tiene cambios sin guardar; si no, avisa
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'hidden' && sucio) guardar();
});
})();
