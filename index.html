<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --card2:#ffffff; --txt:#111114; --txt2:#6c6c70;
  --sep:rgba(60,60,67,.13); --acc:#177a45; --acc-soft:rgba(23,122,69,.12); --on-acc:#ffffff;
  --neg:#c23a30; --fill:#e9e9ee; --on-fill:#636366; --on-neg:#ffffff; --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);
  --nav:rgba(248,248,250,.88); --r:14px; --halo:rgba(23,122,69,.10);
  --dig:#1a6bc4; --dig-soft:rgba(26,107,196,.10);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --card:#161618; --card2:#1e1e21; --txt:#f4f4f6; --txt2:#8e8e93;
    --sep:rgba(255,255,255,.10); --acc:#34c17b; --acc-soft:rgba(52,193,123,.16); --on-acc:#06210f;
    --neg:#f0655b; --fill:#2a2a2e; --on-fill:#a1a1a6; --on-neg:#2a0805; --shadow:none; --nav:rgba(20,20,22,.86); --halo:rgba(52,193,123,.16);
    --dig:#6cb2ff; --dig-soft:rgba(108,178,255,.15);
  }
}
html[data-tema="claro"]{
  --bg:#f2f2f7; --card:#ffffff; --card2:#ffffff; --txt:#111114; --txt2:#6c6c70;
  --sep:rgba(60,60,67,.13); --acc:#177a45; --acc-soft:rgba(23,122,69,.12); --on-acc:#ffffff;
  --neg:#c23a30; --fill:#e9e9ee; --on-fill:#636366; --on-neg:#ffffff; --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);
  --nav:rgba(248,248,250,.88); --halo:rgba(23,122,69,.10);
  --dig:#1a6bc4; --dig-soft:rgba(26,107,196,.10);
}
html[data-tema="oscuro"]{
  --bg:#000000; --card:#161618; --card2:#1e1e21; --txt:#f4f4f6; --txt2:#8e8e93;
  --sep:rgba(255,255,255,.10); --acc:#34c17b; --acc-soft:rgba(52,193,123,.16); --on-acc:#06210f;
  --neg:#f0655b; --fill:#2a2a2e; --on-fill:#a1a1a6; --on-neg:#2a0805; --shadow:none; --nav:rgba(20,20,22,.86); --halo:rgba(52,193,123,.16);
  --dig:#6cb2ff; --dig-soft:rgba(108,178,255,.15);
}
/* ═══ P3a · tokens de diseño (TuGasto 1.3) ═══
   Tipografía: héroe 40/700, número de tarjeta 28/700, sección 17/600, renglón 16, leyenda 13, mínimo 11; la plata con cifras tabulares.
   Espacios en grilla de 4: margen 16, relleno de tarjeta 16, separación 12, renglones de 48 o más, toques de 44 o más, 72 libres sobre el botón Gasto.
   Colores por papel, siempre con una palabra o un chip al lado: realizado (verde), pendiente y atrasado (ámbar), programado y proyectado
   (gris), deuda (neutro), trabajo (índigo); el rojo queda solo para problemas de verdad (saldo negativo, no se pudo guardar, datos en riesgo). */
:root{
  --fs-hero:40px; --fs-num:28px; --fs-sec:17px; --fs-row:16px; --fs-cap:13px; --fs-min:11px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  --gutter:16px; --pad-card:16px; --gap:12px; --row:48px; --tap:44px; --fab-libre:72px;
  --c-real:var(--acc); --c-real-bg:var(--acc-soft);
  --c-pend:#a35a00; --c-pend-bg:rgba(232,140,20,.14);
  --c-atras:#a8470a; --c-atras-bg:rgba(220,110,20,.15);
  --c-prog:#636366; --c-prog-bg:rgba(120,120,128,.12);
  --c-proy:#48484a;
  --c-deuda:var(--txt);
  --c-trab:#5856d6; --c-trab-bg:rgba(88,86,214,.12);
  --c-prob:var(--neg);
}
@media (prefers-color-scheme: dark){
  :root{
    --c-pend:#f5a524; --c-pend-bg:rgba(245,165,36,.16);
    --c-atras:#ff9f43; --c-atras-bg:rgba(255,159,67,.17);
    --c-prog:#a1a1a6; --c-prog-bg:rgba(142,142,147,.18);
    --c-proy:#d1d1d6; --c-trab:#8e8cff; --c-trab-bg:rgba(142,140,255,.16);
  }
}
html[data-tema="claro"]{
  --c-pend:#a35a00; --c-pend-bg:rgba(232,140,20,.14);
  --c-atras:#a8470a; --c-atras-bg:rgba(220,110,20,.15);
  --c-prog:#636366; --c-prog-bg:rgba(120,120,128,.12);
  --c-proy:#48484a; --c-trab:#5856d6; --c-trab-bg:rgba(88,86,214,.12);
}
html[data-tema="oscuro"]{
  --c-pend:#f5a524; --c-pend-bg:rgba(245,165,36,.16);
  --c-atras:#ff9f43; --c-atras-bg:rgba(255,159,67,.17);
  --c-prog:#a1a1a6; --c-prog-bg:rgba(142,142,147,.18);
  --c-proy:#d1d1d6; --c-trab:#8e8cff; --c-trab-bg:rgba(142,140,255,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  font-size:17px; line-height:1.35; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(84px + var(--fab-libre) + env(safe-area-inset-bottom));   /* P3a: lo último de la página sube por encima del botón Gasto */
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* ── header ── */
header{
  position:sticky;top:0;z-index:40;background:var(--nav);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--sep);padding-top:env(safe-area-inset-top);
}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;min-height:46px;padding:5px 0}
.hd h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.02em;grid-column:2;grid-row:1;text-align:center;white-space:nowrap}
.ojo{width:40px;height:40px;padding:0;border:0;border-radius:50%;background:none;color:var(--txt2);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ojo:active{background:var(--sep)}
.ojo .ojo-no{display:none}
html[data-oculto] .ojo{color:var(--acc)}
html[data-oculto] .ojo .ojo-ver{display:none}
html[data-oculto] .ojo .ojo-no{display:block}
.hd h1 .kf{font-weight:800;letter-spacing:.01em}
.hd h1 .anio{font-weight:500;color:var(--txt2);font-size:16px;margin-left:6px}
.estado{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--txt2);grid-column:1;grid-row:1;min-width:0;line-height:1.15}
.estado span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:0 0 auto}
.dot.sucio{background:#e0a300}
.btn-guardar{grid-column:3;grid-row:1;justify-self:end;
  flex:0 0 auto;background:var(--acc);color:var(--on-acc);font-size:15px;font-weight:600;
  padding:9px 16px;border-radius:22px;min-height:40px;
}
.btn-guardar[disabled]{opacity:.45}

/* ── avisos ── */
.aviso{
  background:var(--card);border:1px solid var(--sep);border-radius:var(--r);
  padding:14px 16px;margin:12px 0;font-size:15px;box-shadow:var(--shadow);
}
.aviso p{margin:0 0 10px}
.aviso .fila{display:flex;gap:8px}
.mini{
  background:var(--fill);border-radius:12px;padding:9px 14px;font-size:15px;
  font-weight:600;min-height:40px;
}
.mini.on{background:var(--acc);color:var(--on-acc)}

/* ── vistas ── */
.vista{display:none;padding-top:2px}
.vista.on>*:first-child{margin-top:8px}
.vista.on{display:block}
h2.tit{font-size:13px;font-weight:600;color:var(--txt2);margin:22px 4px 8px;letter-spacing:0}

/* ── selector de mes ── */
.meses{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;scroll-snap-type:x proximity}
.meses::-webkit-scrollbar{display:none}
.meses button{
  flex:0 0 auto;min-width:60px;min-height:44px;padding:0 14px;border-radius:14px;
  background:var(--card);border:1px solid var(--sep);font-size:14px;font-weight:600;
  color:var(--txt2);scroll-snap-align:center;
}
.meses button.on{background:var(--acc);color:var(--on-acc);border-color:transparent}

/* ── resumen ── */
.saldo{
  background:var(--card);border-radius:var(--r);padding:var(--pad-card);box-shadow:var(--shadow);
  border:1px solid var(--sep);position:relative;overflow:hidden;
}
.tri{display:flex;gap:10px;margin-bottom:14px}
.tri div{flex:1;min-width:0}
.tri small{display:block;font-size:var(--fs-cap);color:var(--txt2);margin-bottom:2px}
.tri b{font-size:var(--fs-row);font-weight:600;letter-spacing:-.01em;display:block;overflow:hidden;text-overflow:ellipsis}
.final{border-top:1px solid var(--sep);padding-top:12px}
.final small{font-size:var(--fs-cap);color:var(--txt2)}
.final-fila{display:flex;align-items:center;justify-content:space-between;gap:10px}
/* R5: saldo del mes */
.sdo{margin-top:12px}
.sdo-tit{font-size:13px;font-weight:600;color:var(--txt2);margin-bottom:8px}
.sdo-f{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:15px}
.sdo-f span{color:var(--txt2);min-width:0}
.sdo-f b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.sdo-ap b,.sdo-tot b{font-size:17px}
.sdo-tot{border-top:1px solid var(--sep);margin-top:6px;padding-top:10px}
.sdo-orig{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:var(--fs-cap);color:var(--txt2);margin:-4px 0 4px}
.sdo-lnk{color:var(--acc);font-weight:600;font-size:15px;padding:0 10px;min-height:var(--tap);min-width:var(--tap)}
.sdo-reconf{margin-top:12px;padding:12px;border-radius:12px;background:var(--c-pend-bg)}
.sdo-reconf p{margin:0 0 4px;font-size:15px;color:var(--txt)}
.sdo-reconf .sdo-acc{align-items:center}
.sdo-acc{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.sdo-nota{padding:6px 0 0}
.sdo-in{width:100%;font-size:20px;font-weight:600;padding:10px 12px;margin:0 0 4px;border-radius:12px;background:var(--fill);border:0}
.hoja-sdo{margin:0 0 10px}
.sdo-lbl{display:block;font-size:12px;color:var(--txt2);margin:0 4px 4px}
.final-fila .big{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.final .big{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:2px}
.big.ok{color:var(--acc)} .big.mal{color:var(--neg)}
.barras{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.barra small{display:flex;justify-content:space-between;font-size:var(--fs-cap);color:var(--txt2);margin-bottom:4px}
.pista{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.pista i{display:block;height:100%;border-radius:3px;background:var(--txt2)}
.pista i.verde{background:var(--acc)}

/* ── secciones ── */
.sec{background:var(--card);border-radius:var(--r);margin-top:var(--gap);box-shadow:var(--shadow);border:1px solid var(--sep);overflow:hidden}
.sec>header{position:static;background:none;border:0;padding:0;backdrop-filter:none}
.sechd{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;min-height:52px;text-align:left}
.sechd .nom{flex:1;font-size:var(--fs-sec);font-weight:600}
.sechd .sub{font-size:16px;font-weight:600;color:var(--txt2);display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;text-align:right}
.sechd .sub .falta{font-size:var(--fs-cap);font-weight:600;color:var(--c-pend)}
.sechd .sub .falta:empty{display:none}
/* P3a: estado del renglón: tilde lleno = realizado; anillo ámbar + "Falta" = pendiente; anillo punteado + "Programado" = mes futuro */
.mt-w{position:relative;flex:0 0 auto;display:flex}
.mt-w .est{position:absolute;right:2px;top:1px;font-size:var(--fs-min);font-weight:700;line-height:1.2;padding:1px 6px;border-radius:6px;pointer-events:none;white-space:nowrap}
.est.pend{background:var(--c-pend-bg);color:var(--c-pend)}
.est.atras{background:var(--c-atras-bg);color:var(--c-atras)}
.est.prog{background:var(--c-prog-bg);color:var(--c-prog)}
.item.pend input.monto,.item.progr input.monto{padding-top:17px;padding-bottom:1px}
.item.pend .chk{border-color:var(--c-pend)}
.tj-vienede{color:var(--c-trab)}
.chev{width:12px;height:12px;border-right:2px solid var(--txt2);border-bottom:2px solid var(--txt2);transform:rotate(45deg);margin-left:2px;transition:transform .18s}
.sec.cerrada .chev{transform:rotate(-45deg)}
.sec.cerrada .cuerpo{display:none}
.cuerpo{border-top:1px solid var(--sep)}
.item{display:flex;align-items:center;gap:6px;padding:6px 4px 6px 12px;border-bottom:1px solid var(--sep);min-height:48px}
.item:last-child{border-bottom:0}
.item input.nombre{
  flex:1;min-width:60px;border:0;background:none;padding:8px 0;font-size:16px;outline:none;
  text-overflow:ellipsis;
}
.item input.monto{
  width:112px;flex:0 0 auto;text-align:right;border:0;background:none;padding:8px 2px;
  font-size:16px;font-weight:600;outline:none;font-variant-numeric:tabular-nums;
}
.item input.monto:focus,.item input.nombre:focus{background:var(--fill);border-radius:8px}
.item .x{width:36px;height:44px;flex:0 0 auto;color:var(--txt2);font-size:20px;line-height:1}
.mas{display:block;width:100%;padding:14px 16px;text-align:left;color:var(--acc);font-weight:600;font-size:15px;min-height:48px}
.nota{padding:10px 16px 14px;font-size:var(--fs-cap);color:var(--txt2)}
.nota.mal{color:var(--neg)}
input.err{box-shadow:inset 0 0 0 1.5px var(--neg);border-radius:8px;color:var(--neg)}
.manual .cuerpo{padding:12px 16px 4px}
.manual p{margin:0 0 10px;font-size:15px;line-height:1.5}
.manual ul{margin:0 0 10px;padding-left:18px;font-size:15px;line-height:1.5}
.manual li{margin-bottom:4px}
.acciones .btnlink{display:block;background:var(--card);padding:15px 16px;text-align:left;font-size:16px;min-height:52px;line-height:22px;text-decoration:none;color:var(--txt)}
.faj .mini{flex:0 0 auto;padding:7px 10px;border-radius:9px;background:var(--fill);color:var(--acc);font-size:13px;font-weight:600;min-height:36px}
.chk{width:23px;height:23px;flex:0 0 auto;border-radius:50%;border:2px solid var(--sep);
  display:flex;align-items:center;justify-content:center;color:transparent;transition:background .18s,border-color .18s,color .18s,transform .12s}
.chk svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chk.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.chk:active{transform:scale(.88)}
.chk.prog{border-style:dashed;opacity:.75}   /* R5: mes futuro del modelo, programado */
.item.pago input.nombre{color:var(--txt2)}
.item.pago input.monto{color:var(--txt2)}
.orden{border:1px solid var(--sep);border-radius:12px;overflow:hidden}
.ofila{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 14px;min-height:50px;border-bottom:1px solid var(--sep);background:var(--card)}
.ofila:last-child{border-bottom:0}
.ofila span{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ofila button{width:42px;height:42px;flex:0 0 auto;border-radius:11px;background:var(--fill);color:var(--txt);font-size:13px}
.ofila button[disabled]{opacity:.3}
.topein{width:130px;flex:0 0 auto;text-align:right;border:0;background:none;padding:8px 4px;font-size:16px;font-variant-numeric:tabular-nums;color:var(--txt);outline:none}
.tinfo{padding:0 16px 10px;margin-top:-4px;border-bottom:1px solid var(--sep)}
.tinfo small{display:block;font-size:12px;color:var(--txt2);margin-bottom:4px}
.tinfo small.mal{color:var(--neg)}
.tinfo .pista i{background:var(--acc)}
.tinfo .pista i.mal{background:var(--neg)}
.dinfo{display:block;width:100%;text-align:left;padding:0 16px 10px;margin-top:-2px;font-size:13px;color:var(--txt2);border-bottom:1px solid var(--sep);min-height:0}
.dinfo.vacia{color:var(--acc);font-weight:600}
.item.mov{gap:10px}
.item.mov .fecha{color:var(--txt2);font-size:13px;font-variant-numeric:tabular-nums;flex:0 0 auto}
.item.mov .nom{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.item.mov .monto{font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 auto}
.campo{margin-bottom:10px}
.campo label{display:block;font-size:13px;color:var(--txt2);margin:0 0 4px 4px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(150px + env(safe-area-inset-bottom));z-index:55;display:none;align-items:center;gap:12px;
  background:var(--txt);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:480px;margin:0 auto}
.toast.on{display:flex}
.toast span{flex:1}
.toast button{color:var(--acc);font-weight:700;font-size:15px;min-height:32px;padding:0 6px}
.sec .subtit{padding:14px 16px 4px;margin:0;font-size:var(--fs-cap);font-weight:600;letter-spacing:0;color:var(--txt2);border-top:1px solid var(--sep)}   /* P3a: más chico que el título de la sección (la regla .subtit de Ajustes, más abajo, ya no lo pisa) */
.ah-mas{border-top:1px solid var(--sep)}
.ah-mas summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:var(--row);padding:10px 16px;color:var(--acc);font-weight:600;font-size:15px;cursor:pointer;list-style:none}
.ah-mas summary::-webkit-details-marker{display:none}
.ah-mas summary small{color:var(--txt2);font-weight:400;font-size:var(--fs-cap)}
.ah-mas[open] summary{color:var(--txt2)}

/* ── tablas ── */
.tabla{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);border-radius:var(--r);border:1px solid var(--sep);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--sep)}
th{font-size:12px;font-weight:600;color:var(--txt2);position:sticky;top:0;background:var(--card)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);font-weight:600}
tr.tot td{border-bottom:0;font-weight:700;background:var(--card2)}
tr.tot td:first-child{background:var(--card2)}

/* ── charts ── */
.chart{background:var(--card);border-radius:var(--r);padding:14px;border:1px solid var(--sep);box-shadow:var(--shadow)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.leyenda{display:flex;gap:16px;font-size:12px;color:var(--txt2);margin-top:8px}
.leyenda i{display:inline-block;width:10px;height:2px;vertical-align:middle;margin-right:5px}

/* ── ranking ── */
.rank{background:var(--card);border-radius:var(--r);padding:6px 16px 14px;border:1px solid var(--sep);box-shadow:var(--shadow)}
.rk{padding:9px 0}
.rk small{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:10px}
.rk small span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk small span:last-child{color:var(--txt2);flex:0 0 auto}

/* ── filas de ajuste ── */
.fila-in{display:flex;align-items:center;gap:10px;padding:6px 16px;border-bottom:1px solid var(--sep);min-height:52px}
.fila-in label{flex:1;font-size:16px}
.fila-in input{width:150px;text-align:right;border:0;background:none;padding:10px 4px;font-size:16px;font-weight:600;outline:none;font-variant-numeric:tabular-nums}
.fila-in input:focus{background:var(--fill);border-radius:8px}
.fila-in:last-child{border-bottom:0}
.seg{display:flex;gap:4px;background:var(--fill);border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px 10px;border-radius:9px;font-size:14px;font-weight:600;color:var(--txt2);min-height:38px}
.seg button.on{background:var(--card);color:var(--txt);box-shadow:var(--shadow)}
.lista{background:var(--card);border-radius:var(--r);border:1px solid var(--sep);box-shadow:var(--shadow);overflow:hidden}
.faj{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px 11px 12px;min-height:56px;text-align:left;border-bottom:1px solid var(--sep);background:var(--card);color:var(--txt);text-decoration:none}
.faj:last-child{border-bottom:0}
.faj:active{background:var(--fill)}
.faj .ico{flex:0 0 32px;width:32px;height:32px;border-radius:9px;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center}
.faj .ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.faj .tx{flex:1;min-width:0}
.faj .tx b{display:block;font-size:16px;font-weight:500;color:var(--txt)}
.faj .tx small{display:block;font-size:13px;color:var(--txt2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.faj .tx small.mal{color:var(--neg)}
.faj .tx small.ok{color:var(--acc)}
.faj .chev{flex:0 0 auto;transform:rotate(-45deg);margin-right:4px}
.faj.acento .tx b{color:var(--acc);font-weight:600}
.faj .seg{flex:0 0 auto;width:52%;max-width:230px}
.faj .seg button{min-height:32px;padding:5px 6px;font-size:13px}
.volver{display:flex;align-items:center;gap:6px;color:var(--acc);font-size:16px;font-weight:500;padding:6px 0 2px;margin-top:4px}
.volver i{width:10px;height:10px;border-left:2px solid var(--acc);border-bottom:2px solid var(--acc);transform:rotate(45deg);margin-left:4px}
.subtit{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:6px 4px 14px}
.pie{font-size:13px;color:var(--txt2);text-align:center;padding:26px 0 8px}
.lista .anios{padding:12px 14px}
.acciones{display:flex;flex-direction:column;gap:1px;background:var(--sep);border-radius:var(--r);overflow:hidden;border:1px solid var(--sep)}
.acciones button{background:var(--card);padding:15px 16px;text-align:left;font-size:16px;min-height:52px}
.acciones button.acento{color:var(--acc);font-weight:600}
.texto{font-size:14px;color:var(--txt2);line-height:1.5;padding:2px 4px}
.texto b{color:var(--txt)}

/* ── fab + nav ── */
.fab{
  position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:45;
  height:56px;padding:0 22px;border-radius:28px;background:var(--acc);color:var(--on-acc);
  font-size:16px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.22);display:flex;align-items:center;gap:8px;
}
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--nav);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--sep);display:flex;padding-bottom:env(safe-area-inset-bottom);
}
nav button{flex:1;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--txt2);font-size:10px;font-weight:600;min-height:52px}
nav button.on{color:var(--acc)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ── modal ── */
.velo{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center}
.velo.on{display:flex}
.hoja{
  width:100%;max-width:520px;background:var(--card);border-radius:20px 20px 0 0;
  padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;
}
@media(min-width:560px){ .velo{align-items:center} .hoja{border-radius:20px;margin:0 16px} }
.hoja h3{margin:0 0 14px;font-size:19px;font-weight:700}
.hoja input[type=text]{
  width:100%;padding:14px;border-radius:12px;border:1px solid var(--sep);background:var(--bg);
  font-size:17px;outline:none;margin-bottom:12px
}
.hoja input.grande{font-size:30px;font-weight:700;text-align:center;padding:16px;letter-spacing:-.02em}
.hoja input:focus{border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chips button{
  padding:0 14px;min-height:44px;border-radius:22px;background:var(--fill);
  font-size:15px;font-weight:600;border:1px solid transparent
}
.chips button.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.hoja .fila{display:flex;gap:8px}
.hoja .fila button{flex:1;min-height:50px;border-radius:14px;font-size:16px;font-weight:600;background:var(--fill)}
.hoja .fila button.pri{background:var(--acc);color:var(--on-acc)}
.hoja .fila button.mal{color:var(--neg)}
.hoja .fila button.pri.mal{background:var(--neg);color:var(--on-neg)}   /* L7 review: blanco sobre el rojo oscuro daba 3,1:1 */

.neg{color:var(--neg)}
/* P3a: chips de estado (una palabra que acompaña al color) */
.chip{display:inline-flex;align-items:center;gap:4px;min-height:22px;padding:2px 9px;border-radius:11px;font-size:12px;font-weight:600;
  line-height:1.2;white-space:nowrap;background:var(--fill);color:var(--on-fill);vertical-align:middle}
.chip.real{background:var(--c-real-bg);color:var(--c-real)}
.chip.pend{background:var(--c-pend-bg);color:var(--c-pend)}
.chip.atras{background:var(--c-atras-bg);color:var(--c-atras)}
.chip.prog{background:var(--c-prog-bg);color:var(--c-prog)}
.chip.trab{background:var(--c-trab-bg);color:var(--c-trab)}
.nota.ambar{color:var(--c-pend)}
.big.proy{color:var(--c-proy)}
.big.ambar{color:var(--c-pend)}
/* ── modo trabajo ── */
.hoja input[type=date]{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--sep);background:var(--bg);font-size:17px;outline:none;margin-bottom:12px;min-height:50px;-webkit-appearance:none;appearance:none}
.tj-lb{display:block;font-size:13px;color:var(--txt2);margin:4px 0 8px 4px}
.hoja .chips{margin-bottom:12px}
.tj-acc{display:flex;gap:8px;margin-top:12px}
.tj-acc button{flex:1;min-height:48px;border-radius:14px;font-size:15px;font-weight:600;background:var(--card);border:1px solid var(--sep);box-shadow:var(--shadow)}
.tj-acc button.pri{background:var(--acc);color:var(--on-acc);border-color:transparent}
.tj-f{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;min-height:58px;text-align:left;border-bottom:1px solid var(--sep);background:var(--card);color:var(--txt)}
.tj-f:last-child{border-bottom:0}
button.tj-f:active{background:var(--fill)}
.tj-f .tx{flex:1;min-width:0}
.tj-f .tx b{display:block;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tj-f .tx small{display:block;font-size:13px;color:var(--txt2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tj-f .tx small.mal{color:var(--neg)}
.tj-f .mt{flex:0 0 auto;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.tj-f .mt small{display:block;font-size:12px;font-weight:400;color:var(--txt2)}
.tj-f .ck{flex:0 0 24px;width:24px;height:24px;border-radius:7px;border:2px solid var(--sep);display:flex;align-items:center;justify-content:center}
.tj-f.on .ck{background:var(--acc);border-color:var(--acc)}
.tj-f.on .ck:after{content:'';width:10px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-1px) rotate(-45deg)}
.tj-caja{border:1px solid var(--sep);border-radius:14px;overflow:hidden;margin-bottom:10px}
.tj-res{padding:11px 13px;border-radius:12px;background:var(--fill);font-size:14px;margin:0 0 14px;line-height:1.4}
.tj-res.ok{background:var(--acc-soft);color:var(--acc)}
.tj-res.mal{color:var(--neg)}
.tj-res small{display:block;margin-top:8px;color:var(--txt2);font-size:13px}
.tj-sug{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.02em;padding:2px 7px;border-radius:6px;background:var(--acc-soft);color:var(--acc);margin-right:4px}
.tj-vacio{padding:16px;font-size:14px;color:var(--txt2);line-height:1.45}
.tj-det{margin-bottom:10px}
.tj-dos{display:flex;gap:8px}
.carr{overflow:hidden;touch-action:pan-y}
.carr-pista{display:flex;align-items:flex-start;transition:transform .32s var(--curva),height .28s var(--curva);will-change:transform}
.carr-slide{flex:0 0 100%;min-width:100%;display:flex;align-items:flex-start}
.carr-slide>.saldo{flex:1;margin:0}
.carr-dots{display:flex;justify-content:center;gap:7px;margin:10px 0 2px}
.carr-dots .dot{width:7px;height:7px;min-height:0;padding:0;border-radius:50%;background:var(--sep);transition:background .2s var(--curva),transform .2s var(--curva)}
.carr-dots .dot.on{background:var(--acc);transform:scale(1.35)}
.tg-caja{position:relative;width:170px;margin:4px auto 2px}
.torta{width:170px;height:170px;display:block;animation:kfTorta .45s var(--curva)}
@keyframes kfTorta{from{opacity:0;transform:scale(.92)}}
.tg-centro{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;pointer-events:none}
.tg-centro small{display:block;font-size:12px;color:var(--txt2)}
.tg-centro b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tg-ley{margin-top:10px}
.tg-fila{display:flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px solid var(--sep);font-size:14px}
.tg-fila:last-child{border-bottom:0}
.tg-fila i{flex:0 0 10px;width:10px;height:10px;border-radius:3px}
.tg-n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg-p{flex:0 0 auto;font-size:13px;color:var(--txt2);font-variant-numeric:tabular-nums}
.tg-m{flex:0 0 auto;font-weight:600;font-variant-numeric:tabular-nums}
.seg.seg4 button{font-size:13px;padding:0 4px}
.grilla-dias{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.grilla-dias button{min-height:38px;border-radius:10px;background:var(--fill);color:var(--txt);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.grilla-dias button.on{background:var(--acc);color:var(--on-acc);font-weight:700}
.grilla-sem{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.grilla-sem button{min-height:44px;border-radius:12px;background:var(--fill);color:var(--txt);font-size:15px;font-weight:600}
.grilla-sem button.on{background:var(--acc);color:var(--on-acc)}
.grilla-dias button:active,.grilla-sem button:active{transform:scale(.9);transition-duration:var(--toque)}
.tj-modo{margin-bottom:6px}
.tj-prods{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tj-phd{display:flex;gap:8px;align-items:center;margin-top:14px}
.tj-busca{flex:1;min-width:0;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--sep);background:var(--card);color:var(--txt);font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
.tj-busca::placeholder{color:var(--txt2)}
.tj-busca:focus{outline:none;border-color:var(--acc)}
.tj-vista{flex:0 0 auto;width:40px;height:40px;min-height:0;padding:0;border-radius:12px;background:var(--fill);color:var(--txt);display:flex;align-items:center;justify-content:center}
.tj-vista svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tj-vista:active{background:var(--acc-soft)}
#tjProdsCont>.tj-prods{margin-top:8px}
.tj-carps{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-top:10px;padding:1px 0 3px}
.tj-carps::-webkit-scrollbar{display:none}
.tj-carps button{flex:0 0 auto;display:flex;align-items:center;gap:6px;height:34px;min-height:0;padding:0 12px;border-radius:17px;background:var(--fill);color:var(--txt);font-size:14px;font-weight:600;white-space:nowrap}
.tj-carps button.on{background:var(--acc);color:var(--on-acc)}
.tj-carps i,.tj-carp-hd i{font-style:normal;font-weight:500;font-size:12px;opacity:.65;font-variant-numeric:tabular-nums}
.pt{display:inline-block;width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.pt.gen{background:transparent;border:2px solid var(--txt2)}
.tj-carps button.on .pt{box-shadow:0 0 0 2px #fff}
.tj-carp{margin-top:10px}
.tj-carp-hd{display:flex;align-items:center;gap:8px;width:100%;min-height:36px;padding:4px 2px;background:none;color:var(--txt);text-align:left}
.tj-carp-hd b{font-size:15px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tj-carp-hd i{flex:1}
.tj-carp.cerrada .chev{transform:rotate(-45deg)}
.tj-carp.cerrada .cuerpo{display:none}
.buscando .tj-carp.cerrada .cuerpo{display:block}
.tj-carp .tj-prods{margin-top:4px}
.tj-prod.cc{border-left:3px solid var(--cc)}
.tj-cols{display:flex;gap:10px;flex-wrap:wrap;margin:2px 0 8px}
.tj-cols button{width:32px;height:32px;min-height:0;padding:0;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--sep)}
.tj-cols button.on{border-color:var(--card);box-shadow:0 0 0 2px var(--txt)}
.tj-cols.apagado{opacity:.35;pointer-events:none}
.tj-sinres{font-size:13px;color:var(--txt2);text-align:center;padding:14px 0 4px}
.tj-prods.compacta{gap:6px}
@media (min-width:380px){.tj-prods.compacta{grid-template-columns:1fr 1fr 1fr}.tj-prods.compacta .tj-prod .vp{font-size:17px!important}.tj-prods.compacta .tj-prod .vp.l{font-size:14px!important;letter-spacing:-.01em}}
.tj-prods.compacta .tj-prod{min-height:0;padding:7px 9px;border-radius:12px}
.tj-prods.compacta .tj-pw .nom{font-size:13px;line-height:1.2;padding-right:0}
.tj-prods.compacta{row-gap:12px;padding-top:4px}
.tj-prods.compacta .tj-prod .vp{font-size:17px;line-height:1.15;margin-top:1px}
.tj-prods.compacta .tj-prod .vp.l{font-size:15px}
.tj-prods.compacta .sb{position:absolute;top:-9px;right:-3px;z-index:1;font-size:9.5px;font-weight:700;line-height:1;padding:2px 5px;border-radius:7px;background:var(--fill);color:var(--txt2);border:1.5px solid var(--bg);font-variant-numeric:tabular-nums;pointer-events:none}
.tj-prods.compacta .agot .sb{color:var(--neg)}
.tj-prod{min-height:58px;padding:9px 12px;border-radius:14px;text-align:left;background:var(--card);border:1px solid var(--sep);box-shadow:var(--shadow);color:var(--txt)}
.tj-prod b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tj-prod small{display:block;font-size:13px;color:var(--txt2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tj-prod .nom,.tj-prod .vp,.tj-prod .vg,.tj-prod .vc{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tj-prod .nom{font-size:14px;font-weight:600;line-height:1.25}
.tj-prod .vp{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:1px;font-variant-numeric:tabular-nums}
.tj-prod .vg{font-size:12.5px;font-weight:600;color:var(--acc);margin-top:2px;font-variant-numeric:tabular-nums}
.tj-prod .vc{font-size:11.5px;color:var(--txt2);opacity:.85;margin-top:1px}
.tj-pw{position:relative;display:flex;min-width:0}
.tj-pw>.tj-prod{flex:1;min-width:0;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.tj-pw .nom{padding-right:28px}
.tj-medio{position:absolute;top:5px;right:5px;width:32px;height:32px;min-height:0;padding:0;border-radius:10px;background:var(--fill);font-size:16px;line-height:32px;text-align:center}
.tj-medio:active{background:var(--acc-soft)}
.tj-pw.agot>.tj-prod{opacity:.5;box-shadow:none}
.tj-prod .vc .ag{color:var(--neg);font-weight:600}
.tj-cobra{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.tj-medios{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:12px 0 14px;position:relative}
.tj-md{min-width:0;padding:10px 12px;border-radius:14px;display:flex;flex-direction:column;justify-content:space-between}
.tj-md.dig{background:var(--dig-soft)} .tj-md.efe{background:var(--acc-soft)}
.tj-md small{display:block;font-size:12px;font-weight:600;line-height:1.25;margin-bottom:3px}
.tj-md.dig small{color:var(--dig)} .tj-md.efe small{color:var(--acc)}
.tj-md b,.tj-mt b{display:block;color:var(--txt);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tj-md b{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.tj-md b.largo{font-size:15px}
.tj-mt{grid-column:1 / -1;min-width:0;padding:12px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--sep)}
.tj-mt small{display:block;font-size:12px;color:var(--txt2)}
.tj-mt b{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-top:1px}
.tj-mt b.largo{font-size:23px}
@media (max-width:370px){.tj-md b{font-size:16px}.tj-md b.largo{font-size:14px}}
.tj-cobra button{min-height:56px;border-radius:14px;font-size:17px;font-weight:600;background:var(--acc);color:var(--on-acc)}
.tj-cobra button.sec{background:var(--fill);color:var(--txt)}
.tj-cobra button:active{transform:scale(.975);transition-duration:var(--toque)}
.tj-f .mt small.vg{display:block;font-size:12px;font-weight:600;color:var(--acc);margin-top:1px}
.tj-det .muted{opacity:.6}
.tj-det .muted div{border-bottom:0}
.tj-prod:active{background:var(--acc-soft);border-color:var(--acc)}
.tj-hoy{font-size:13px;color:var(--txt2);text-align:center;margin:10px 0 0}
.tj-cz{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:5px;align-items:center}
.tj-cz .czn{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tj-cz .czd{font-size:13px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tj-cz .czd.mal{color:var(--neg)}
.tj-rec{justify-self:end;font-size:14px;font-weight:600;padding:6px 14px;min-height:32px;border-radius:10px;background:var(--acc-soft);color:var(--acc)}
.tj-rec:active{opacity:.7}
.tj-msg{display:block;width:100%;min-height:160px;padding:12px 14px;border-radius:12px;border:1px solid var(--sep);background:var(--bg);color:var(--txt);font:inherit;font-size:15px;line-height:1.45;margin-bottom:6px;resize:vertical;outline:none}
#v-trabajo .tri b.largo{font-size:13px}
#v-trabajo .final .big.largo{font-size:28px}

/* ═══ 16 · terminaciones: curvas, relieve y respuesta al toque ══════
   Solo CSS. No toca el DOM, ni los datos, ni el almacenamiento.
   Las curvas viven en variables para que todo frene igual. */
:root{
  --curva:cubic-bezier(.22,1,.36,1);        /* frena suave: aperturas y entradas */
  --curva-sale:cubic-bezier(.4,0,1,1);      /* arranca rápido: salidas */
  --curva-viva:cubic-bezier(.2,.9,.3,1);    /* con algo de vida: barras y números */
  --toque:.08s;                              /* apretar es inmediato */
  --suelta:.24s;                             /* soltar vuelve despacio */
  --shadow:0 1px 1.5px rgba(16,18,27,.04),0 5px 14px -4px rgba(16,18,27,.07);
  --shadow-alto:0 2px 8px rgba(16,18,27,.07),0 18px 40px -12px rgba(16,18,27,.22);
  --g1:var(--acc); --g2:#4a90a4; --g3:#d9534f; --g4:#8a7fa8; --g5:#e8a33d; --g6:#6bb8dd; --g7:#8e949c;
}
@media (prefers-color-scheme: dark){
  :root{ --shadow:none; --shadow-alto:0 -1px 0 rgba(255,255,255,.07);
  --g1:var(--acc); --g2:#5fb3c9; --g3:#ef6b66; --g4:#a99cd0; --g5:#f2b75a; --g6:#7fd0f0; --g7:#aab0b8; }
}
html[data-tema="claro"]{
  --shadow:0 1px 1.5px rgba(16,18,27,.04),0 5px 14px -4px rgba(16,18,27,.07);
  --shadow-alto:0 2px 8px rgba(16,18,27,.07),0 18px 40px -12px rgba(16,18,27,.22);
  --g1:var(--acc); --g2:#4a90a4; --g3:#d9534f; --g4:#8a7fa8; --g5:#e8a33d; --g6:#6bb8dd; --g7:#8e949c;
}
html[data-tema="oscuro"]{ --shadow:none; --shadow-alto:0 -1px 0 rgba(255,255,255,.07);
  --g1:var(--acc); --g2:#5fb3c9; --g3:#ef6b66; --g4:#a99cd0; --g5:#f2b75a; --g6:#7fd0f0; --g7:#aab0b8; }

/* apretar: nunca resalta el recuadro gris de Android, nunca selecciona texto,
   nunca espera los 300 ms del doble toque */
button{touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input,textarea{touch-action:manipulation}

/* respuesta al toque: baja rápido, vuelve despacio */
.tj-acc button,.tj-prod,.tj-linea,.tj-pasar,.tj-rec,.hoja .fila button,.chips button,.seg button,
.mini,.acciones .btnlink,.toast button,.mas,#nav button,.item .x,.fab,.meses button{
  transition:transform var(--suelta) var(--curva),background .2s var(--curva),
             border-color .2s var(--curva),color .2s var(--curva),opacity .2s var(--curva);
}
.tj-acc button:active,.hoja .fila button:active,.tj-pasar:active,.tj-linea:active{transform:scale(.975);transition-duration:var(--toque)}
.tj-prod:active{transform:scale(.955);transition-duration:var(--toque)}
.chips button:active,.seg button:active,.mini:active,.tj-rec:active,.toast button:active{transform:scale(.93);transition-duration:var(--toque)}
.item .x:active{transform:scale(.82);transition-duration:var(--toque)}
#nav button:active .np{transform:scale(.88);transition-duration:var(--toque)}
.acciones .btnlink:active,.mas:active{background:var(--fill)}
.np{transition:background .22s var(--curva),transform var(--suelta) var(--curva)}
.fab:active{transform:scale(.93);transition-duration:var(--toque)}
.meses button:active{transform:scale(.93);transition-duration:var(--toque)}
button.tj-f{transition:background .2s var(--curva)}
button.tj-f:active{background:var(--fill);transition-duration:var(--toque)}

/* relieve: lo que flota se despega más que lo que está apoyado.
   La hoja mantiene su propia máquina de estados (arrastrando · vuelve · yendo): no se toca. */
.hoja{box-shadow:var(--shadow-alto);overscroll-behavior:contain}
.toast{box-shadow:var(--shadow-alto)}
.fab{box-shadow:0 4px 10px -2px rgba(16,18,27,.16),0 12px 28px -8px rgba(16,18,27,.28)}
.fab:active{box-shadow:0 2px 6px -2px rgba(16,18,27,.2)}

/* aperturas y cierres con la misma curva */
.velo{transition:background .24s var(--curva)}
.chev{transition:transform .22s var(--curva)}
.vista.on{animation:kfEntra .22s var(--curva)}
.vista.der{animation:kfDer .3s var(--curva)}
.vista.izq{animation:kfIzq .3s var(--curva)}
.vista.on>.sec,.vista.on>.lista,.vista.on>.tabla,.vista.on>.manual>.sec,.vista.on .mes-der>.sec{
  animation-duration:.28s;animation-timing-function:var(--curva);   /* en largo, para no pisar el retardo escalonado */
}
.pista i{transition:width .34s var(--curva-viva),background .25s var(--curva)}
#v-trabajo .pista i,.rank .pista i{animation:kfBarra .6s var(--curva-viva)}

/* el precio es lo que se mira antes de tocar: tiene que leerse de una */
.tj-prod small{color:var(--txt);opacity:.72}

/* los números que cuentan no tienen que bailar de ancho */
.big,.tri b,.sechd .sub,.tj-prod small,.tj-cz .mt,.saldo .final small{font-variant-numeric:tabular-nums}

/* la pista de altura solo mientras se pliega de verdad, no todo el tiempo */
.cuerpo{will-change:auto}
.cuerpo[data-anim="1"]{will-change:height}

/* teclado: un aro visible sin ensuciar el toque en el celular */
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* quien pidió menos movimiento no ve nada de esto: gana por !important aunque esté más arriba */
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.item{gap:4px;padding:2px 2px 2px 4px}

.tinfo small.mal{color:var(--c-pend)}
.tinfo .pista i.mal{background:var(--c-pend)}
/* ═══ L1 (P3b) · El año, Patrimonio, Trabajo, Gasto en la barra, escritorio ═══ */
.sechd .sub .sub-cap{font-size:var(--fs-cap);font-weight:600;color:var(--c-prog)}
.sechd .nom{min-width:40%}   /* el título no queda de una palabra por renglón cuando el resumen es largo */
.hero-anio .an-filas{margin-top:12px;padding-top:8px;border-top:1px solid var(--sep)}
.an-tit{font-size:var(--fs-cap);font-weight:600;color:var(--txt2);margin:10px 0 2px}
.an-filas .sdo-f b{font-size:var(--fs-row)}
/* L6: este mes contra los anteriores y las categorías */
.an-comp{padding:8px 16px 12px}
.an-c-f{display:grid;grid-template-columns:minmax(0,1fr) auto 64px 64px;gap:8px;align-items:baseline;padding:8px 0;font-size:15px;border-top:1px solid var(--sep)}
.an-c-f>span:first-child{color:var(--txt2)}
.an-c-f>span:nth-child(n+3),.an-c-f>b{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.an-c-f>b{font-weight:600}
.an-c-hd{font-size:var(--fs-min);color:var(--txt2);border-top:0;padding:0 0 2px}
.an-c-hd>span:nth-child(2){text-align:right}
.an-frases{margin-top:10px}
.an-frases p{font-size:15px}
.an-pie{padding:8px 0 0}
.an-pie .chip{margin-left:4px}
.an-tend{padding:8px 16px 14px}
.an-cat{padding:9px 0}
.an-cat small{display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:10px}
.an-cat small>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.an-cat small>span:last-child{color:var(--txt2);flex:0 0 auto}
.an-normal{padding:4px 0 8px}
.an-cat small .chip{font-size:var(--fs-min);min-height:18px;padding:1px 7px;margin-left:4px;vertical-align:1px}
.an-cat .an-prom{margin:0;color:var(--txt2)}
.an-cat .an-prom span:last-child{font-variant-numeric:tabular-nums}
.barritas{display:block;width:100%;height:28px;margin:2px 0 4px}
.hero-anio.hero-proyectado{border-style:dashed}
tr.prog td{color:var(--c-prog)}
td .chip{min-height:0;padding:1px 7px;font-size:var(--fs-min);margin-left:4px}
.tj-pp{margin:0;padding:8px 16px;border-bottom:1px solid var(--sep)}
/* Gasto es una acción de la barra de abajo: nunca flota encima de un monto (hallazgo 11) */
.nav-gasto{color:var(--acc)!important}
.nav-gasto .np{background:var(--acc);color:var(--on-acc)}
.nav-gasto svg{stroke-width:2.6}
nav button{min-width:var(--tap)}
body{padding-bottom:calc(84px + var(--s4) + env(safe-area-inset-bottom))}
/* la hoja del gasto: el monto lleva su "$" */
.gr-monto{position:relative;margin-bottom:12px}
.gr-monto span{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:30px;font-weight:700;color:var(--txt2);pointer-events:none}
.gr-monto input.grande{margin-bottom:0;padding-left:44px;padding-right:44px}
/* toques de 44 y textos de 11 como mínimo en Trabajo */
.seg button{min-height:var(--tap)}
.tj-rec{min-height:var(--tap)}
.tj-vista{width:var(--tap);height:var(--tap)}
.tj-carps button{height:var(--tap)}
.tj-prods.compacta .sb{font-size:var(--fs-min)}
/* el aviso de versión, corto; y uno a la vez: espera mientras está la pregunta del cierre del mes */
.aviso-corto{padding:10px 14px;font-size:14px}
.aviso-corto p{margin-bottom:8px}
body:has(#avisoCierre) #avisoVersion{display:none}
/* los gráficos del año no crecen sin fin en la pantalla grande (sus textos quedan entre 11 y 17 px) */
.chart svg{max-width:440px;margin:0 auto}
@media (min-width:720px){
  .meses{overflow:visible}
  .meses button{flex:1 1 0;min-width:var(--tap);padding:0}
  nav{padding-left:calc((100% - 688px) / 2);padding-right:calc((100% - 688px) / 2)}
}
/* ═══ L7 · teclado, lector de pantalla y computadora ═══ */
/* la barra de abajo: las pestañas son una lista de pestañas (aria-owns) y Gasto es una acción aparte; el orden del documento es el que se ve */
.tabs{display:contents}
.hoja:focus{outline:none}
/* el mes en dos columnas solo desde 1024 px; en el celular los envoltorios no existen para el diseño */
.mes-cols,.mes-izq,.mes-der{display:contents}
@media screen and (min-width:1024px){   /* screen: la impresión sigue como siempre */
  .wrap{max-width:1200px;padding:0 24px}
  nav{padding-left:max(24px, calc((100% - 1152px) / 2));padding-right:max(24px, calc((100% - 1152px) / 2))}
  #v-mes .mes-cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:0 24px;align-items:start}
  #v-mes .mes-izq,#v-mes .mes-der{display:block;min-width:0}
  #v-mes .mes-izq.fija{position:sticky;top:68px}
  #v-mes .mes-der>.sec:first-child{margin-top:0}
  /* El año, Patrimonio y Trabajo: el resumen arriba a lo ancho y las secciones en dos columnas */
  #v-anio.on,#v-usd.on,#v-trabajo.on{columns:2;column-gap:24px}
  #v-anio.on>*,#v-usd.on>*,#v-trabajo.on>*{break-inside:avoid}
  #v-anio.on>.hero-anio,#v-anio.on>.resumen,#v-anio.on>[data-sec=anTabla],#v-usd.on>#heroPatri,#v-trabajo.on>:not(.sec){column-span:all}
  #v-ajustes.on{max-width:720px;margin:0 auto}
  .hoja{max-height:80vh}
}
.soloPrint{display:none}
@media print{
  .soloPrint{display:block;font-weight:700;font-size:16px;margin:0 0 8px}
  header,nav,.fab,.toast,.velo,#avisos,.meses{display:none!important}
  body{background:#fff;color:#000;padding:0;font-size:12px}
  .vista{display:none!important} .vista#v-anio{display:block!important}
  .tabla,.chart,.rank,.sec{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  th,td{padding:5px 8px} h2.tit{margin-top:14px}
  .tabla{overflow:visible} table{font-size:11px}
  .pista i{background:#333!important} .pista i.verde{background:#1f9d55!important}
}
</style>
</head>

<header>

    <h1 id="titulo" title="TuGasto"><span class="kf">TG</span><span class="anio"></span></h1>

    <button class="btn-guardar" data-act="guardar">Guardar</button>
  </div>
</header>

<div class="wrap" id="avisos"></div>

<main class="wrap">
  <section class="vista on" id="v-mes" role="tabpanel" aria-labelledby="tab-mes"></section>
  <div id="printTit" class="soloPrint"></div>
  <section class="vista" id="v-anio" role="tabpanel" aria-labelledby="tab-anio"></section>
  <section class="vista" id="v-usd" role="tabpanel" aria-labelledby="tab-usd"></section>
  <section class="vista" id="v-trabajo" role="tabpanel" aria-labelledby="tab-trabajo"></section>
  <section class="vista" id="v-ajustes" role="tabpanel" aria-labelledby="tab-ajustes"></section>
</main>

<nav id="nav" aria-label="Secciones">
  <!-- L7 review: las pestañas y Gasto van en el orden en que se ven (también con Tab); la lista de pestañas las reúne con aria-owns, Gasto queda afuera -->
  <div class="tabs" role="tablist" aria-label="Secciones" aria-owns="tab-mes tab-anio tab-usd tab-trabajo tab-ajustes"></div>
  <button id="tab-mes" role="tab" aria-selected="true" aria-controls="v-mes" data-act="tab" data-t="mes" class="on">
    <span class="np"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>Mes</button>
  <button id="tab-anio" role="tab" aria-selected="false" aria-controls="v-anio" data-act="tab" data-t="anio">
    <span class="np"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>Año</button>
  <button class="nav-gasto" id="fab" data-act="gastoRapido" aria-label="Sumar un gasto">
    <span class="np"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>Gasto</button>
  <button id="tab-usd" role="tab" aria-selected="false" aria-controls="v-usd" data-act="tab" data-t="usd">
    <span class="np"><svg viewBox="0 0 24 24"><path d="M12 2v20M17 6.5C17 4.6 14.8 3.5 12 3.5S7 4.6 7 6.9s2.4 3.1 5 3.6 5 1.3 5 3.6-2.2 3.4-5 3.4-5-1.1-5-3"/></svg></span>Patrimonio</button>
  <button id="tab-trabajo" role="tab" aria-selected="false" aria-controls="v-trabajo" data-act="tab" data-t="trabajo" style="display:none">
    <span class="np"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg></span>Trabajo</button>
  <button id="tab-ajustes" role="tab" aria-selected="false" aria-controls="v-ajustes" data-act="tab" data-t="ajustes">
    <span class="np"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7.5 19.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 15.9H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9.5l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 10 6V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1.3z"/></svg></span>Ajustes</button>
</nav>

function vencimientos(d, j, hoy, facturas){

// Lo cobrado por Trabajo es lo que pasaste con fecha hasta hoy, repartido en orden entre los renglones como en flujosMes; lo que el
// renglón tiene por encima de lo que pasaste se tilda como un ingreso común (R5). Solo presenta: no cambia ningún número.
function textoDelTrabajo(d, j, it, hoy){

  for(i=0;i<lp.length;i++){ mo = num(lp[i] && lp[i].monto); if(mo > 0 && String(lp[i].fecha) <= hoy.iso) real += mo; }

function irSlide(n, sinAnim){

  if(sinAnim){ void p.offsetHeight; p.style.transition = ''; }
  var d = c.querySelectorAll('.carr-dots .dot'), i;
  for(i=0;i<d.length;i++) d[i].classList.toggle('on', i === carrIdx);

function armarCarrusel(){
  var c = document.getElementById('carrMes'), p = document.getElementById('carrPista');
  if(!c || !p || c.getAttribute('data-listo') === '1') return;
  c.setAttribute('data-listo', '1');
  var x0 = 0, y0 = 0, dx = 0, vivo = false;
  c.addEventListener('touchstart', function(e){
    e.stopPropagation();                                  // el gesto se queda en la tarjeta
    if(!e.touches || e.touches.length !== 1) return;
    vivo = true; dx = 0; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    p.style.transition = 'none';
  }, {passive:true});
  c.addEventListener('touchmove', function(e){
    e.stopPropagation();
    if(!vivo || !e.touches || !e.touches.length) return;
    var mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
    if(Math.abs(my) > Math.abs(mx) + 6){ vivo = false; p.style.transition = ''; irSlide(carrIdx); return; }
    dx = mx;
    if((carrIdx === 0 && dx > 0) || (carrIdx === 1 && dx < 0)) dx = dx * 0.25;   // resistencia en los bordes
    p.style.transform = 'translateX(calc(-' + (carrIdx * 100) + '% + ' + Math.round(dx) + 'px))';
  }, {passive:true});
  c.addEventListener('touchend', function(e){
    e.stopPropagation();
    if(!vivo) return;
    vivo = false; p.style.transition = '';
    var n = carrIdx;
    if(dx < -45) n = carrIdx + 1;
    if(dx > 45) n = carrIdx - 1;
    irSlide(n);

         + (e.fin ? ' · ' + CORTOS[e.fin.mes].toLowerCase() + (e.fin.anio !== D.anio ? ' ' + e.fin.anio : '') : ' · lista') + '</span></small>'
         + '<div class="pista"><i class="'+(e.restantes?'':'verde')+'" style="width:'+(e.pct*100)+'%"></i></div></div>';

         : 'No te queda ninguna cuota pendiente.') + '</div></div>';

       + '<th>Año</th><th>Ingresos</th><th>Gastos</th><th>Deudas</th><th>Ahorrado</th><th>Cierre en pesos</th><th>Dólares al cierre</th></tr></thead><tbody>';
    for(i=0;i<anios.length;i++){

      for(j=0;j<12;j++){ tI += sA[j].totalIngresos; tG += sA[j].totalGastos; tD += sA[j].totalDeudas; tA += sA[j].ahorroMesARS; }

         + '<td>' + hARS(tA) + '</td><td>' + hARS(sA[11].ahorroAcumulado) + '</td><td>' + hUSD(sA[11].usdAcumulado) + '</td></tr>';
    }

    h += plegable('anAnios', 'Año por año', anios.length + ' años', hA, false);

  h += plegable('anArranque', 'Ahorro con el que arrancaste el año', fARS(D.ahorroAnioAnterior),
        '<div class="fila-in"><label>Ahorro que traías del año anterior</label>'
      + '<input class="monto" inputmode="decimal" data-campo="ahorroAnioAnterior" value="'+fARS(D.ahorroAnioAnterior)+'"></div>', false)
     + '<div style="height:20px"></div>';
  document.getElementById('v-anio').innerHTML = h;
}

function lineas(a, b){
  var W=340, H=176, pl=42, pr=8, pt=10, pb=24, i;
  var max = Math.max.apply(null, a.concat(b).concat([1]));
  max = Math.ceil(max/4)*4 || 1;
  var x = function(i){ return pl + i*(W-pl-pr)/11; };
  var y = function(v){ return pt + (H-pt-pb) * (1 - v/max); };
  var g = '';
  for(i=0;i<=3;i++){
    var v = max*i/3, yy = y(v);
    g += '<line x1="'+pl+'" y1="'+yy+'" x2="'+(W-pr)+'" y2="'+yy+'" stroke="currentColor" stroke-opacity=".12"/>'
       + '<text x="'+(pl-5)+'" y="'+(yy+4.5)+'" font-size="13" text-anchor="end" fill="currentColor" opacity=".5">'+corto(v)+'</text>';
  }
  function path(arr){ var d=''; for(var i=0;i<12;i++) d += (i?'L':'M') + x(i).toFixed(1) + ' ' + y(arr[i]).toFixed(1) + ' '; return d; }
  for(i=0;i<12;i+=2) g += '<text x="'+x(i)+'" y="'+(H-6)+'" font-size="13" text-anchor="middle" fill="currentColor" opacity=".5">'+CORTOS[i]+'</text>';
  g += '<path class="trazo" d="'+path(b)+'" fill="none" stroke="var(--txt2)" stroke-width="2" stroke-linejoin="round"/>';
  g += '<path class="trazo" d="'+path(a)+'" fill="none" stroke="var(--acc)" stroke-width="2.4" stroke-linejoin="round"/>';
  for(i=0;i<12;i++) if(a[i]) g += '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(a[i]).toFixed(1)+'" r="2.4" fill="var(--acc)"/>';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ingresos contra gastos por mes">'+g+'</svg>';
}
function barras(arr){
  var W=340, H=156, pl=42, pr=8, pt=10, pb=24, i;
  var max = Math.max.apply(null, arr.concat([1]));
  var min = Math.min.apply(null, arr.concat([0]));
  max = max <= 0 ? 1 : max;
  var base = pt + (H-pt-pb) * (max/(max-min));
  var g = '<line x1="'+pl+'" y1="'+base.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+base.toFixed(1)+'" stroke="currentColor" stroke-opacity=".2"/>'
        + '<text x="'+(pl-5)+'" y="'+(pt+10)+'" font-size="13" text-anchor="end" fill="currentColor" opacity=".5">'+corto(max)+'</text>';
  var an = (W-pl-pr)/12;
  for(i=0;i<12;i++){
    var v = arr[i], alto = Math.abs(v)/(max-min)*(H-pt-pb);
    var xx = pl + i*an + an*0.16, ancho = an*0.68;
    var yy = v >= 0 ? base - alto : base;
    g += '<rect x="'+xx.toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+ancho.toFixed(1)+'" height="'+Math.max(alto,0.6).toFixed(1)+'" rx="2" fill="'+(v<0?'var(--neg)':'var(--acc)')+'" opacity="'+(v?1:.25)+'"/>';
    if(i%2===0) g += '<text x="'+(xx+ancho/2).toFixed(1)+'" y="'+(H-6)+'" font-size="13" text-anchor="middle" fill="currentColor" opacity=".5">'+CORTOS[i]+'</text>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ahorro acumulado por mes">'+g+'</svg>';
}

// "Patrimonio total" de la pestaña Dólares. Año sin arrastre: patrimonio() de siempre (cierre del año, D4). Año con modelo: el neto de D7
// a hoy (disponible + ahorro + dólares + cripto + Trabajo, Q2, − deudas), en pesos y en dólares a la cotización guardada.
function patrimonioPantalla(d, hoy){
  var vm = vistaModelo(d, hoy); if(!vm) return patrimonio(d);
  vm.ctx.trabajoDisponible = trabajoDisponible();
  var pn = patrimonioNeto(d, hoy, vm.ctx), cot = num(d.cotizacionUSD);
  return {ahorroARS: pn.ahorroARS, usd: pn.usd, criptoUSD: pn.criptoUSD, patrimonioUSD: cot > 0 ? pn.neto / cot : 0, patrimonioARS: pn.neto, modelo: pn};
}
// R5 (D7, Q2, Q6, Q14, §6): la composición auditable del patrimonio de un año con modelo. Cada número es un campo de patrimonioNeto
// (una sola fuente, D13): disponible + ahorro + dólares + cripto + Trabajo = bruto; bruto - deudas = neto. Sin cotización, dólares y cripto
// no se valúan (patrimonioNeto los cuenta en 0) y la fila lo dice en lugar de mostrar un número inventado. Con la cotización que trae la app
// (normalizar pone 1499 y nunca se editó: sin fecha) el número se muestra, porque está en el total, pero dice que no la cargaste.
function filasPatrimonio(pn){
  var sinCot = !(pn.cotizacion > 0);
  return {
    filas: [
      {k:'disponible', valor:pn.disponible},
      {k:'ahorro', valor:pn.ahorroARS},
      {k:'usd', valor:pn.usdARS, usd:pn.usd, estimado:true, falta:sinCot && pn.usd !== 0},
      {k:'cripto', valor:pn.criptoARS, usd:pn.criptoUSD, estimado:true, falta:sinCot && pn.criptoUSD !== 0},
      {k:'trabajo', valor:pn.trabajo}
    ],
    bruto: pn.bruto, deudas: pn.pasivos, detalleDeudas: pn.pasivosDetalle, neto: pn.neto,
    cotizacion: pn.cotizacion, cotizacionFecha: pn.cotizacionFecha, sinCotizacion: sinCot, cotizacionPorDefecto: !sinCot && !pn.cotizacionFecha
  };
}
function htmlPatrimonio(p){

    h += '<div class="fila-in" data-pat="' + x.k + '"><label>' + etq[x.k] + det + '</label><span class="mudo">' + (x.falta ? 'sin cotización' : hARS(x.valor)) + '</span></div>';

  for(i=0;i<f.detalleDeudas.length;i++){
    h += '<div class="fila-in" data-pat="deuda"><label class="mudo" style="font-size:14px;padding-left:12px">' + esc(f.detalleDeudas[i].nombre) + '</label>'

      : (f.cotizacionPorDefecto
        ? 'Todavía no cargaste la cotización del dólar: dólares y cripto están calculados a ' + fARS(f.cotizacion) + ', la que trae la app. Cargá la tuya arriba, en Cotización.'
        : 'Dólares y cripto son una estimación: a ' + fARS(f.cotizacion) + ' por dólar, la cotización que cargaste el ' + fechaCorta(f.cotizacionFecha) + '.'))
     + ' Las deudas son las cuotas que te faltan de cada plan y lo que no tildaste de deudas sin plan hasta hoy.</div>';

function htmlDolaresMes(d, s, p, hoy){
  var cd = costoDolares(d), i, prog, h = '<div class="tabla"><table><thead><tr>'

       + '<td>' + hUSD(p.usd) + '</td><td>' + hARS(p.modelo.usdARS) + '</td></tr>';
    if(s[11].usdAcumulado !== p.usd) h += '<tr class="tot prog" data-usd="prog"><td>Con lo programado</td><td>' + hUSD(s[11].usdAcumulado - p.usd) + '</td><td>—</td>'
       + '<td>' + hUSD(s[11].usdAcumulado) + '</td><td>' + hARS(s[11].equivalenteARS) + '</td></tr>';

       + '</div></div>';

}

  var a = D && D.actualizado ? D.actualizado : '', b = (T && tieneTrab() && T.actualizado) ? T.actualizado : '';

function guardar(){

  if(r === 'roto'){ D.actualizado = ant; avisoCuarentena(D.anio); return false; }   // N4 I-3: no se pisa un año que no se puede leer
  if(r === 'ok'){ sucio = false; hayLS = true; }   // si ahora guarda, el navegador volvió a funcionar
  else hayLS = false;

  estado(eraSucio && hayLS);

  if(eraSucio && hayLS && Date.now() - ultPild > 7000) pildora('Cambios guardados');
  if(eraSucio && !hayLS) pildora('No se pudo guardar', true);

function leerAnio(a){   // null si no hay año guardado o si lo guardado no se puede leer (N4 I-3: ese texto no se pisa, ver escribirConRev)
  try{ var s = localStorage.getItem(PREF + a), o = s ? JSON.parse(s) : null; return o && typeof o === 'object' && !Array.isArray(o) ? normalizar(o, hoyApp()) : null; }
  catch(e){ return null; }
}
/* ═══ revisión por blob: varias pestañas (R4.3, Q12) ═══
   Cada blob guardado (un año, o Trabajo) lleva `rev`, un entero que sube en cada guardado. Antes de escribir se relee el rev guardado:
   si no es el que esta pestaña cargó, otra pestaña guardó en el medio y NO se escribe (la última pestaña no pisa a la primera). */
function revGuardada(clave){   // {hay, rev} del blob que está guardado ahora; roto + texto si está pero no se puede leer (N4 I-3)
  var s, o;
  try{ s = localStorage.getItem(clave); }catch(e){ return {hay:false, rev:0}; }
  if(s === null || s === undefined) return {hay:false, rev:0};
  try{ o = JSON.parse(s); }catch(e){ return {hay:true, rev:0, roto:true, texto:s}; }
  if(!o || typeof o !== 'object' || Array.isArray(o)) return {hay:true, rev:0, roto:true, texto:s};
  return {hay:true, rev: revValida(o.rev) || 0};
}
/* N4 I-3: un blob guardado que no se puede leer nunca se pisa en silencio. Antes, su texto se copia tal cual a kibo.cuarentena.AAAA
   (o kibo.cuarentena.trabajo). Esa clave es del teléfono a propósito (claveMia no la incluye): así ninguna vuelta atrás ni restauración
   que borra claves propias la borra nunca; la copia de seguridad la lleva aparte (armarCopia: campo `cuarentena`). La app no la borra.
   N7: cada texto distinto se guarda: si la clave ya tiene otro texto, va a kibo.cuarentena.AAAA.2, .3… (el mismo texto no se repite). */
function claveCuarentena(clave){ return LSCUAR + (clave === LSTRAB ? 'trabajo' : clave === LSDIARIO ? 'diario' : String(clave).slice(PREF.length)); }
function ponerEnCuarentena(clave, texto){   // true si este texto quedó guardado (o ya estaba en alguna copia); nunca reemplaza ni borra una copia anterior
  var base = claveCuarentena(clave), k, v, n;
  try{
    for(n = 1; ; n++){
      k = n === 1 ? base : base + '.' + n;
      v = localStorage.getItem(k);
      if(v === texto) return true;
      if(v === null){ localStorage.setItem(k, texto); return localStorage.getItem(k) === texto; }
    }
  }catch(e){ return false; }
}
function avisoCuarentena(anio){
  var e = document.getElementById('avisos'); if(!e) return;
  e.innerHTML = '<div class="aviso" data-av="cuarentena"><p>No pude leer los datos de ' + esc(anio) + '. Los aparté tal cual para que no se pierdan, y ese año no se modifica.'
    + ' Si tenés una copia de seguridad, restaurala.</p><div class="fila"><button class="mini on" data-act="restaurar">Restaurar una copia</button></div></div>';
}
function escribirConRev(clave, obj){   // 'ok' | 'conflicto' (otra pestaña guardó antes: no se escribe) | 'error' (el navegador no deja guardar) | 'roto' (N4 I-3)
  var st = revGuardada(clave), mia = revValida(obj.rev) || 0, tenia = obj.rev;
  if(st.roto){   // lo guardado no se puede leer: el año no se escribe hasta restaurar una copia; Trabajo sí, una vez copiado a cuarentena
    if(!ponerEnCuarentena(clave, st.texto) || clave !== LSTRAB) return 'roto';
    st = {hay:false, rev:0};
  }
  if(st.hay && st.rev !== mia) return 'conflicto';   // si el blob ya no existe no hay nada que pisar: se escribe
  obj.rev = mia + 1;
  try{ localStorage.setItem(clave, JSON.stringify(obj)); return 'ok'; }
  catch(e){ if(tenia === undefined) delete obj.rev; else obj.rev = tenia; return 'error'; }
}

  }

  if(!obsoleta && !revGuardada(PREF + D.anio).roto && blobAlDia(PREF + D.anio, D)) anios[D.anio] = D;
  var copia = {app:'TuGasto', version:1, creada:new Date().toISOString(), anios:anios};
  var tr = T && !obsoleta && blobAlDia(LSTRAB, T) ? T : leerTrab();
  if(tr && (tr.activo || tr.facturas.length || tr.cobros.length || tr.pases.length || tr.gastos.length || tr.productos.length || tr.tope)) copia.trabajo = tr;   // campo nuevo: las versiones viejas lo ignoran
  try{
    for(i=0;i<localStorage.length;i++){
      k = localStorage.key(i);

    }
  }catch(e){}

  return copia;
}
function fechaArchivo(){ var d = new Date(); function p(x){ return (x<10?'0':'')+x; } return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function diagCompartir(){

  var intentos = [['.json','application/json','json'],['.json','text/plain','json como texto'],['.txt','text/plain','txt']], i, f;
  for(i=0;i<intentos.length;i++){
    var ok = false;
    try{ f = new File(['{}'], 'x'+intentos[i][0], {type:intentos[i][1]}); ok = navigator.canShare({files:[f]}); }catch(e){ ok = false; }
    if(ok) out.push(intentos[i][2]);

function archivoCompartible(texto, base){

    [base + '.json', 'text/plain'],
    [base + '.txt',  'text/plain']

  for(i=0;i<intentos.length;i++){

function hacerCopia(){

var MAX_COPIA = 10 * 1024 * 1024;   // N5 S-3: una copia real pesa unos pocos cientos de KB; más de 10 MB no se lee

function restaurarCopia(f){

// N5 S-2: una clave de año de una copia vale solo si es un año de verdad (1900 a 2200, cuatro cifras sin cero adelante)
function anioValido(k){ var t = String(k); return /^[1-9]\d{3}$/.test(t) && +t >= 1900 && +t <= 2200; }

function escribirAnios(anios, claves){

  for(i=0;i<claves.length;i++){
    if(!anioValido(claves[i]) || !claveMia(PREF + (+claves[i]))){ saltados.push(String(claves[i])); continue; }   // nunca se escribe una clave que no es de esta app
    if(anios[claves[i]] && typeof anios[claves[i]] === 'object') anios[claves[i]].anio = +claves[i];   // la migración usa el año de la clave
    d = normalizar(anios[claves[i]], hoyApp()); d.anio = +claves[i];
    if(d.arrastre || d.meses.some(function(m){ return !!m.cierreReal; })) modelo = true;
    lista.push(d);
  }
  if(modelo) asegurarSnapshotR4();   // la copia trae el modelo de saldos: antes de escribir queda guardado lo que había (si no entra, la restauración sigue: la pidió el usuario)
  for(i=0;i<lista.length;i++){
    d = lista[i]; st = revGuardada(PREF + d.anio);

    d.rev = Math.max(st.rev, d.rev || 0) + 1;   // la restauración solo avanza la revisión (N4 I-5: siempre, exista o no la clave): ninguna pestaña con una revisión anterior puede pisarla
    try{ localStorage.setItem(PREF + d.anio, JSON.stringify(d)); if(d.anio > ultimo) ultimo = d.anio; }

function avisarRestauro(total, fallaron, trabajoFallo, saltados){

  if(!fallaron.length && !trabajoFallo && !nota){ toast('Restauré ' + total + (total === 1 ? ' año' : ' años')); return; }
  if(!fallaron.length && !trabajoFallo){ alerta('Restauré ' + total + (total === 1 ? ' año' : ' años'), nota + ' Lo demás de la copia quedó guardado.'); return; }
  var ok = total - fallaron.length, falta = fallaron.slice();
  if(trabajoFallo) falta.push('datos de trabajo');
  alerta('No pude restaurar todo',
    (ok > 0 ? 'Se guardó ' + ok + (ok === 1 ? ' año' : ' años') + ' de la copia, pero no entró: ' : (fallaron.length ? 'No se guardó ningún año de la copia. ' : '') + 'No entró: ')
    + '<b>' + falta.join(', ') + '</b>.<br><br>Puede ser que el navegador no tenga más lugar o que tenga el almacenamiento bloqueado. Lo que ya había de eso en este teléfono sigue como estaba. Liberá espacio y probá de nuevo, o abrí la copia en otro navegador.'
    + (nota ? '<br><br>' + nota : ''));

function restaurarTexto(txt){
  (function(){
    var j;
    if(typeof txt === 'string' && txt.length > MAX_COPIA){ avisoCopiaGrande(); return; }
    try{ j = JSON.parse(txt); }catch(e){ alerta('Ese archivo no se pudo leer', 'No parece una copia de TuGasto.'); return; }
    var anios = j && j.anios && typeof j.anios === 'object' ? j.anios
              : (j && Array.isArray(j.meses) ? (function(o){ var t = {}; t[num(j.anio)||new Date().getFullYear()] = j; return t; })() : null);
    if(!anios){ alerta('Ese archivo no se pudo leer', 'No parece una copia de TuGasto.'); return; }
    var numericas = Object.keys(anios).filter(function(k){ return /^\d+$/.test(k); });
    var claves = numericas.filter(anioValido), saltados = numericas.filter(function(k){ return !anioValido(k); });   // N5 S-2
    if(!claves.length){ alerta('Copia vacía', 'El archivo no tiene ningún año adentro.'); return; }
    var teniaDatos = hayDatos(D, tieneTrab());
    pendiente = function(){
      obsoleta = false;   // restaurar reemplaza todo: no hay nada que "recargar" de otra pestaña
      var r = escribirAnios(anios, claves), trabajoFallo = false, stT;
      if(j.cuarentena && typeof j.cuarentena === 'object') Object.keys(j.cuarentena).forEach(function(k){   // N4 I-3 / N7: cada texto vuelve una vez, sin pisar los de acá
        var m = /^(\d{4}|trabajo)(?:\.[1-9]\d*)?$/.exec(k);
        if(m && (m[1] === 'trabajo' || anioValido(m[1])) && typeof j.cuarentena[k] === 'string') ponerEnCuarentena(m[1] === 'trabajo' ? LSTRAB : PREF + m[1], j.cuarentena[k]);
      });
      if(j.trabajo && typeof j.trabajo === 'object'){
        T = normTrab(j.trabajo); stT = revGuardada(LSTRAB);
        if(stT.hay) T.rev = stT.rev;   // escribirConRev exige la revisión guardada y suma 1: queda por encima de lo que cualquier pestaña tenga cargado
        trabajoFallo = !guardarTrab(true); aplicarModo();
      }
      // si la app tenía datos y ese año viene en la copia, me quedo ahí; si estaba vacía, abro el último año que se pudo guardar
      var abrir = teniaDatos && claves.indexOf(String(D.anio)) > -1 ? D.anio : r.ultimo;
      if(abrir) recordarAnio(abrir);
      cargar();
      avisarRestauro(claves.length, r.fallaron, trabajoFallo, saltados.concat(r.saltados));
    };
    abrirHoja('<h3>Restaurar copia</h3><div class="texto" style="margin-bottom:16px">La copia trae ' + claves.length + (claves.length === 1 ? ' año: ' : ' años: ')
      + '<b>' + claves.join(', ') + '</b>. Va a <b>reemplazar</b> lo que tengas guardado de esos años en este teléfono.'
      + (j.trabajo && typeof j.trabajo === 'object' ? ' También trae tus datos de trabajo (' + descTrabajo(j.trabajo) + '), que reemplazan a los de este teléfono.' : '')
      + '</div>'
      + '<div class="fila"><button data-act="cerrarHoja">Cancelar</button><button class="pri mal" data-act="confirmar">Reemplazar</button></div>');
  })();
}

function recordatorioCopia(ahora, ultima, desde, pospuesta, conDatos){
  if(!conDatos) return null;   // un teléfono vacío no tiene nada que copiar
  var dia = 86400000, t = pospuesta ? new Date(pospuesta).getTime() : NaN;

  if(!isNaN(t)) return ahora - t > DIAS_COPIA * dia ? {dias: Math.floor((ahora - t) / dia), nunca: false} : null;
  t = desde ? new Date(desde).getTime() : NaN;   // nunca hubo copia (o la fecha no se lee): cuenta desde el primer día con datos
  return !isNaN(t) && ahora - t >= DIAS_SIN_COPIA * dia ? {dias: Math.floor((ahora - t) / dia), nunca: true} : null;
}

function cerrarHoja(){
  var estaba = velo.classList.contains('on'), b = hojaAntes;
  hoja.className = 'hoja'; hoja.style.transform = '';
  velo.className = 'velo'; hoja.innerHTML = '';
  if(!estaba) return;
  hojaAntes = null;
  var sel = selectorDe(b);
  volverFoco(b, sel);
  // quien cerró la hoja suele volver a dibujar la pantalla enseguida (Guardar, Confirmar) y el botón que la abrió se reemplaza: después de

  setTimeout(function(){
    if(velo.classList.contains('on')) return;   // se abrió otra hoja (un aviso, otra pregunta): ella maneja el foco
    var ae = document.activeElement;

  }, 0);
}
function selectorDe(b){   // cómo volver a encontrar un botón después de que la pantalla se dibuja de nuevo: su id o sus atributos data-*
  if(!b || !b.getAttribute || !b.tagName) return '';
  if(b.id) return '#' + b.id.replace(/[^\w-]/g, '\\$&');
  var tag = b.tagName.toLowerCase(), s = tag, at = b.attributes, i;
  for(i=0;i<at.length;i++) if(at[i].name.indexOf('data-') === 0) s += '[' + at[i].name + '="' + String(at[i].value).replace(/["\\]/g, '\\$&') + '"]';
  return s === tag ? '' : s;
}
function volverFoco(b, sel){

  if(!n && sel) try{ n = document.querySelector(sel); }catch(e){ n = null; }

function quitarMov(id){

function valorDe(t){
  var ci = t.getAttribute('data-cripto');
  if(ci !== null) return D.cripto[+ci][t.getAttribute('data-campo')];
  var campo = t.getAttribute('data-campo');
  if(campo){
    if(campo === 'ahorroAnioAnterior' || campo === 'usdAnioAnterior' || campo === 'cotizacionUSD') return D[campo];
    return D.meses[mes][campo];
  }
  return D.meses[mes][t.getAttribute('data-k')][+t.getAttribute('data-i')].monto;
}
function aplicarInput(t, final){
  var v;
  if(t.classList.contains('nombre')) v = t.value;
  else {
    // tipo de campo: cantidad (cripto), porcentaje (meta de ahorro) o plata (todo lo demás)
    var lector = t.classList.contains('cant') ? parseCantidad : t.classList.contains('pct') ? parsePct : parseMonto;
    v = lector(t.value);
    if(isNaN(v)){   // no se entiende: no se toca el modelo; mientras se escribe solo se marca, al soltar se avisa
      marcarErr(t, !final && !parcial(t.value, lector));
      if(final) toast('No entendí «' + String(t.value).trim() + '» como número');
      return;
    }
    marcarErr(t, false);
  }
  var ci = t.getAttribute('data-cripto');
  if(ci !== null){
    var cc = D.cripto[+ci], cf = t.getAttribute('data-campo');
    if(cc[cf] !== v){ cc[cf] = v; tocar(); }
    if(final) renderUSD(); return;
  }
  var campo = t.getAttribute('data-campo');
  if(campo){
    if(campo === 'metaAhorroPct') v = num(v)/100;
    v = num(v);
    var cambio = false;
    if(campo === 'cotizacionUSD'){ if(v > 0 && D.cotizacionUSD !== v){ D.cotizacionUSD = v; D.cotizacionFecha = new Date().toISOString(); cambio = true; } }
    else if(campo === 'ahorroAnioAnterior' || campo === 'usdAnioAnterior'){ if(D[campo] !== v){ D[campo] = v; cambio = true; } }
    else if(D.meses[mes][campo] !== v){ D.meses[mes][campo] = v; cambio = true; }
    if(cambio) tocar();
    refrescar();
    if(final && (tab === 'anio' || tab === 'usd')) conScroll(render);
    return;
  }
  var it = D.meses[mes][t.getAttribute('data-k')][+t.getAttribute('data-i')];
  if(t.classList.contains('nombre')){
    if(t.getAttribute('data-k') === 'deudas'){
      var viejo = String(it.nombre||'').trim(), nuevo = String(v).trim();
      if(viejo !== nuevo && planDe(D, viejo) && !planDe(D, nuevo)){
        D.planDeudas[nuevo] = D.planDeudas[viejo]; delete D.planDeudas[viejo];
        // una deuda con plan es la misma en todos los meses: el nombre viaja con ella
        for(var mj=0;mj<12;mj++){ var ld = D.meses[mj].deudas; for(var mq=0;mq<ld.length;mq++) if(ld[mq] !== it && String(ld[mq].nombre||'').trim() === viejo) ld[mq].nombre = v; }
      }
    }
    if(it.nombre === v) return;
    it.nombre = v;
  } else {
    if(it.monto === num(v)) return;
    it.monto = num(v);
  }
  tocar(); refrescar();
}

function propagar(si){
  if(si && alta){
    for(var i=mes+1;i<12;i++){
      var ls = D.meses[i][alta.k], existe = false;

    tocar();

function tjId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function dos(x){ return (x<10?'0':'')+x; }
function hoyISO(){ var d = new Date(); return d.getFullYear()+'-'+dos(d.getMonth()+1)+'-'+dos(d.getDate()); }
function esISO(s){ return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
function utcDe(iso){ var p = iso.split('-'); return Date.UTC(+p[0], +p[1]-1, +p[2]); }
function sumarDias(iso, n){ var d = new Date(utcDe(iso) + n*864e5); return d.getUTCFullYear()+'-'+dos(d.getUTCMonth()+1)+'-'+dos(d.getUTCDate()); }
function diasEntre(a, b){ return Math.round((utcDe(b) - utcDe(a)) / 864e5); }

function siguienteNumero(){

  for(i=0;i<T.facturas.length;i++){ f = T.facturas[i]; if(f.tipo === 'factura' && /\d+$/.test(f.numero) && (!ult || f.creada > ult.creada)) ult = f; }
  if(!ult) return '';
  var base = ult.numero.match(/^(.*?)(\d+)$/), pre = base[1], ancho = base[2].length, max = +base[2];
  for(i=0;i<T.facturas.length;i++){ m = String(T.facturas[i].numero).match(/^(.*?)(\d+)$/); if(m && m[1] === pre && +m[2] > max) max = +m[2]; }
  var n = String(max + 1); while(n.length < ancho) n = '0' + n;
  return pre + n;
}

function normTrab(t){
  t = t && typeof t === 'object' ? t : {};
  var o = {version:1, activo: t.activo === true, actualizado: String(t.actualizado || ''), facturas:[], cobros:[], pases:[], gastos:[], productos:[], tope:0, ui:{col:{}}};
  var fs = Array.isArray(t.facturas) ? t.facturas : [], cs = Array.isArray(t.cobros) ? t.cobros : [], i, j;
  for(i=0;i<fs.length;i++){
    var f = fs[i]; if(!f || typeof f !== 'object') continue;
    var mo = Math.max(0, num(f.monto)), ca = num(f.cantidad) > 0 ? num(f.cantidad) : 1;
    o.facturas.push({id:String(f.id || tjId()), cliente:String(f.cliente || '').trim(), numero:String(f.numero || '').trim(),
      concepto:String(f.concepto || '').trim(), monto:mo, cantidad:ca, precio: num(f.precio) > 0 ? num(f.precio) : mo / ca,
      contado: f.contado === true, tipo: f.tipo === 'simple' || f.tipo === 'factura' ? f.tipo : (f.contado === true ? 'simple' : 'factura'),
      ajuste: num(f.ajuste), base: num(f.base) > 0 ? num(f.base) : Math.max(0, num(f.monto)),
      abono: f.abono === true, abonoHasta: /^\d{4}-\d{2}$/.test(f.abonoHasta) ? f.abonoHasta : '', abonoDe: String(f.abonoDe || ''),
      fuente: String(f.fuente || '').trim(), periodo: f.periodo === 'semana' || f.periodo === 'quincena' ? f.periodo : '',
      desde: esISO(f.desde) ? f.desde : '', costo: Math.max(0, num(f.costo)),
      fecha: esISO(f.fecha) ? f.fecha : hoyISO(),
      plazo: f.contado === true ? 0 : Math.max(0, Math.round(num(f.plazo))), forma:formaValida(f.forma), creada:String(f.creada || '')});
  }
  for(i=0;i<cs.length;i++){
    var c = cs[i]; if(!c || typeof c !== 'object') continue;
    var ap = [], la = Array.isArray(c.aplic) ? c.aplic : [];
    for(j=0;j<la.length;j++) if(la[j] && la[j].f) ap.push({f:String(la[j].f), m:Math.max(0, num(la[j].m)), r:Math.max(0, num(la[j].r))});
    o.cobros.push({id:String(c.id || tjId()), cliente:String(c.cliente || '').trim(), monto:Math.max(0, num(c.monto)),
      fecha: esISO(c.fecha) ? c.fecha : hoyISO(), forma:formaValida(c.forma), aplic:ap, creada:String(c.creada || '')});
  }
  var pr = Array.isArray(t.productos) ? t.productos : [];
  for(i=0;i<pr.length;i++){
    var p0 = pr[i]; if(!p0 || typeof p0 !== 'object') continue;
    var nom = String(p0.nombre || '').trim(); if(!nom) continue;
    o.productos.push({id:String(p0.id || tjId()), nombre:nom, precio:Math.max(0, Math.round(num(p0.precio))),
      costo:Math.max(0, Math.round(num(p0.costo))), forma: p0.forma === '' ? '' : formaValida(p0.forma), stock:stockValido(p0.stock), carpeta:nomCarpeta(p0.carpeta), creada:String(p0.creada || '')});
    var ul = o.productos[o.productos.length - 1]; ul.color = ul.carpeta ? (colorValido(p0.color) || 'gris') : '';
  }
  var ps = Array.isArray(t.pases) ? t.pases : [];
  for(i=0;i<ps.length;i++){
    var p = ps[i]; if(!p || typeof p !== 'object') continue;
    var pf = esISO(p.fecha) ? p.fecha : hoyISO();
    o.pases.push({id:String(p.id || tjId()), fecha:pf, monto:Math.max(0, Math.round(num(p.monto))),
      anio: Math.round(num(p.anio)) || +pf.slice(0,4), mes: p.mes == null ? +pf.slice(5,7) - 1 : Math.min(11, Math.max(0, Math.round(num(p.mes)))),
      creada:String(p.creada || '')});
  }
  var gs = Array.isArray(t.gastos) ? t.gastos : [];
  for(i=0;i<gs.length;i++){
    var g = gs[i]; if(!g || typeof g !== 'object') continue;
    var mon = g.moneda === 'USD' ? 'USD' : 'ARS';
    o.gastos.push({id:String(g.id || tjId()), concepto:String(g.concepto || '').trim(), cat:catValida(g.cat),
      monto:Math.max(0, Math.round(num(g.monto))), moneda:mon, usd: mon === 'USD' ? Math.max(0, num(g.usd)) : 0,
      cotiz: mon === 'USD' ? Math.max(0, num(g.cotiz)) : 0, fecha: esISO(g.fecha) ? g.fecha : hoyISO(), creada:String(g.creada || '')});
  }
  o.tope = Math.max(0, Math.round(num(t.tope)));
  if(t.ui && t.ui.col && typeof t.ui.col === 'object') for(var k in t.ui.col) if(t.ui.col.hasOwnProperty(k)) o.ui.col[k] = !!t.ui.col[k];
  var aPlazo = false; for(i=0;i<o.facturas.length;i++){ if(!o.facturas[i].contado) aPlazo = true; if(o.facturas[i].abono && !o.facturas[i].abonoHasta) o.facturas[i].abonoHasta = o.facturas[i].fecha.slice(0,7); }
  o.modo = t.modo === 'simple' || t.modo === 'pro' ? t.modo : (aPlazo ? 'pro' : 'simple');   // si ya tenía facturas a plazo, arranca en Profesional
  var rv = revValida(t.rev); if(rv !== null) o.rev = rv;   // revisión del blob (varias pestañas): se conserva, nunca se inventa
  return o;
}
