<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>kibFinanzas</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1f9d55" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="kibFinanzas">
<link rel="apple-touch-icon" href="./apple-180.png">
<link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png">
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --card2:#ffffff; --txt:#111114; --txt2:#8a8a8e;
  --sep:rgba(60,60,67,.13); --acc:#1f9d55; --acc-soft:rgba(31,157,85,.12);
  --neg:#d0453a; --fill:#e9e9ee; --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);
  --nav:rgba(248,248,250,.88); --r:20px; --halo:rgba(31,157,85,.10);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --card:#161618; --card2:#1e1e21; --txt:#f4f4f6; --txt2:#8e8e93;
    --sep:rgba(255,255,255,.10); --acc:#34c17b; --acc-soft:rgba(52,193,123,.16);
    --neg:#f0655b; --fill:#2a2a2e; --shadow:none; --nav:rgba(20,20,22,.86); --halo:rgba(52,193,123,.16);
  }
}
html[data-tema="claro"]{
  --bg:#f2f2f7; --card:#ffffff; --card2:#ffffff; --txt:#111114; --txt2:#8a8a8e;
  --sep:rgba(60,60,67,.13); --acc:#1f9d55; --acc-soft:rgba(31,157,85,.12);
  --neg:#d0453a; --fill:#e9e9ee; --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);
  --nav:rgba(248,248,250,.88); --halo:rgba(31,157,85,.10);
}
html[data-tema="oscuro"]{
  --bg:#000000; --card:#161618; --card2:#1e1e21; --txt:#f4f4f6; --txt2:#8e8e93;
  --sep:rgba(255,255,255,.10); --acc:#34c17b; --acc-soft:rgba(52,193,123,.16);
  --neg:#f0655b; --fill:#2a2a2e; --shadow:none; --nav:rgba(20,20,22,.86); --halo:rgba(52,193,123,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  font-size:17px; line-height:1.35; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(150px + env(safe-area-inset-bottom));
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* ── header ── */
header{
  position:sticky;top:0;z-index:40;background:var(--nav);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--sep);padding-top:env(safe-area-inset-top);
}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;min-height:46px;padding:5px 0}
.hd h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.02em;grid-column:2;grid-row:1;text-align:center;white-space:nowrap}
.ojo{width:40px;height:40px;padding:0;border:0;border-radius:50%;background:none;color:var(--txt2);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ojo:active{background:var(--sep)}
.ojo .ojo-no{display:none}
html[data-oculto] .ojo{color:var(--acc)}
html[data-oculto] .ojo .ojo-ver{display:none}
html[data-oculto] .ojo .ojo-no{display:block}
.hd h1 .kf{font-weight:800;letter-spacing:.01em}
.hd h1 .anio{font-weight:500;color:var(--txt2);font-size:16px;margin-left:6px}
.estado{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--txt2);grid-column:1;grid-row:1;min-width:0;line-height:1.15}
.estado span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:0 0 auto}
.dot.sucio{background:#e0a300}
.btn-guardar{grid-column:3;grid-row:1;justify-self:end;
  flex:0 0 auto;background:var(--acc);color:#fff;font-size:15px;font-weight:600;
  padding:9px 16px;border-radius:22px;min-height:40px;
}
.btn-guardar[disabled]{opacity:.45}

/* ── avisos ── */
.aviso{
  background:var(--card);border:1px solid var(--sep);border-radius:var(--r);
  padding:14px 16px;margin:12px 0;font-size:15px;box-shadow:var(--shadow);
}
.aviso p{margin:0 0 10px}
.aviso .fila{display:flex;gap:8px}
.mini{
  background:var(--fill);border-radius:12px;padding:9px 14px;font-size:15px;
  font-weight:600;min-height:40px;
}
.mini.on{background:var(--acc);color:#fff}

/* ── vistas ── */
.vista{display:none;padding-top:2px}
.vista.on>*:first-child{margin-top:8px}
.vista.on{display:block}
h2.tit{font-size:13px;font-weight:600;color:var(--txt2);margin:22px 4px 8px;letter-spacing:0}

/* ── selector de mes ── */
.meses{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;scroll-snap-type:x proximity}
.meses::-webkit-scrollbar{display:none}
.meses button{
  flex:0 0 auto;min-width:60px;min-height:44px;padding:0 14px;border-radius:14px;
  background:var(--card);border:1px solid var(--sep);font-size:14px;font-weight:600;
  color:var(--txt2);scroll-snap-align:center;
}
.meses button.on{background:var(--acc);color:#fff;border-color:transparent}

/* ── resumen ── */
.saldo{
  background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);
  border:1px solid var(--sep);position:relative;overflow:hidden;
}
.saldo:before{content:'';position:absolute;right:-80px;top:-110px;width:220px;height:220px;border-radius:50%;
  background:var(--halo);pointer-events:none}
.tri{display:flex;gap:10px;margin-bottom:14px}
.tri div{flex:1;min-width:0}
.tri small{display:block;font-size:12px;color:var(--txt2);margin-bottom:2px}
.tri b{font-size:16px;font-weight:600;letter-spacing:-.01em;display:block;overflow:hidden;text-overflow:ellipsis}
.final{border-top:1px solid var(--sep);padding-top:12px}
.final small{font-size:12px;color:var(--txt2)}
.final-fila{display:flex;align-items:center;justify-content:space-between;gap:10px}
.final-fila .big{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.final .big{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:2px}
.big.ok{color:var(--acc)} .big.mal{color:var(--neg)}
.barras{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.barra small{display:flex;justify-content:space-between;font-size:12px;color:var(--txt2);margin-bottom:4px}
.pista{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.pista i{display:block;height:100%;border-radius:3px;background:var(--txt2)}
.pista i.verde{background:var(--acc)}

/* ── secciones ── */
.sec{background:var(--card);border-radius:var(--r);margin-top:12px;box-shadow:var(--shadow);border:1px solid var(--sep);overflow:hidden}
.sec>header{position:static;background:none;border:0;padding:0;backdrop-filter:none}
.sechd{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;min-height:52px;text-align:left}
.sechd .nom{flex:1;font-size:16px;font-weight:600}
.sechd .sub{font-size:16px;font-weight:600;color:var(--txt2)}
.chev{width:12px;height:12px;border-right:2px solid var(--txt2);border-bottom:2px solid var(--txt2);transform:rotate(45deg);margin-left:2px;transition:transform .18s}
.sec.cerrada .chev{transform:rotate(-45deg)}
.sec.cerrada .cuerpo{display:none}
.cuerpo{border-top:1px solid var(--sep)}
.item{display:flex;align-items:center;gap:6px;padding:6px 4px 6px 12px;border-bottom:1px solid var(--sep);min-height:48px}
.item:last-child{border-bottom:0}
.item input.nombre{
  flex:1;min-width:60px;border:0;background:none;padding:8px 0;font-size:16px;outline:none;
  text-overflow:ellipsis;
}
.item input.monto{
  width:112px;flex:0 0 auto;text-align:right;border:0;background:none;padding:8px 2px;
  font-size:16px;font-weight:600;outline:none;font-variant-numeric:tabular-nums;
}
.item input.monto:focus,.item input.nombre:focus{background:var(--fill);border-radius:8px}
.item .x{width:36px;height:44px;flex:0 0 auto;color:var(--txt2);font-size:20px;line-height:1}
.mas{display:block;width:100%;padding:14px 16px;text-align:left;color:var(--acc);font-weight:600;font-size:15px;min-height:48px}
.nota{padding:10px 16px 14px;font-size:13px;color:var(--txt2)}
.nota.mal{color:var(--neg)}
.manual .cuerpo{padding:12px 16px 4px}
.manual p{margin:0 0 10px;font-size:15px;line-height:1.5}
.manual ul{margin:0 0 10px;padding-left:18px;font-size:15px;line-height:1.5}
.manual li{margin-bottom:4px}
.acciones .btnlink{display:block;background:var(--card);padding:15px 16px;text-align:left;font-size:16px;min-height:52px;line-height:22px;text-decoration:none;color:var(--txt)}
.chk{width:23px;height:23px;flex:0 0 auto;border-radius:50%;border:2px solid var(--sep);
  display:flex;align-items:center;justify-content:center;color:transparent;transition:background .18s,border-color .18s,color .18s,transform .12s}
.chk svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chk.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chk:active{transform:scale(.88)}
.item.pago input.nombre{color:var(--txt2)}
.item.pago input.monto{color:var(--txt2)}
.orden{border:1px solid var(--sep);border-radius:12px;overflow:hidden}
.ofila{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 14px;min-height:50px;border-bottom:1px solid var(--sep);background:var(--card)}
.ofila:last-child{border-bottom:0}
.ofila span{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ofila button{width:42px;height:42px;flex:0 0 auto;border-radius:11px;background:var(--fill);color:var(--txt);font-size:13px}
.ofila button[disabled]{opacity:.3}
.topein{width:130px;flex:0 0 auto;text-align:right;border:0;background:none;padding:8px 4px;font-size:16px;font-variant-numeric:tabular-nums;color:var(--txt);outline:none}
.tinfo{padding:0 16px 10px;margin-top:-4px;border-bottom:1px solid var(--sep)}
.tinfo small{display:block;font-size:12px;color:var(--txt2);margin-bottom:4px}
.tinfo small.mal{color:var(--neg)}
.tinfo .pista i{background:var(--acc)}
.tinfo .pista i.mal{background:var(--neg)}
.dinfo{display:block;width:100%;text-align:left;padding:0 16px 10px;margin-top:-2px;font-size:13px;color:var(--txt2);border-bottom:1px solid var(--sep);min-height:0}
.dinfo.vacia{color:var(--acc);font-weight:600}
.item.mov{gap:10px}
.item.mov .fecha{color:var(--txt2);font-size:13px;font-variant-numeric:tabular-nums;flex:0 0 auto}
.item.mov .nom{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.item.mov .monto{font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 auto}
.campo{margin-bottom:10px}
.campo label{display:block;font-size:13px;color:var(--txt2);margin:0 0 4px 4px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(150px + env(safe-area-inset-bottom));z-index:55;display:none;align-items:center;gap:12px;
  background:var(--txt);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:480px;margin:0 auto}
.toast.on{display:flex}
.toast span{flex:1}
.toast button{color:var(--acc);font-weight:700;font-size:15px;min-height:32px;padding:0 6px}
.subtit{padding:14px 16px 4px;font-size:13px;font-weight:600;color:var(--txt2);border-top:1px solid var(--sep)}

/* ── tablas ── */
.tabla{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);border-radius:var(--r);border:1px solid var(--sep);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--sep)}
th{font-size:12px;font-weight:600;color:var(--txt2);position:sticky;top:0;background:var(--card)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);font-weight:600}
tr.tot td{border-bottom:0;font-weight:700;background:var(--card2)}
tr.tot td:first-child{background:var(--card2)}

/* ── charts ── */
.chart{background:var(--card);border-radius:var(--r);padding:14px;border:1px solid var(--sep);box-shadow:var(--shadow)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.leyenda{display:flex;gap:16px;font-size:12px;color:var(--txt2);margin-top:8px}
.leyenda i{display:inline-block;width:10px;height:2px;vertical-align:middle;margin-right:5px}

/* ── ranking ── */
.rank{background:var(--card);border-radius:var(--r);padding:6px 16px 14px;border:1px solid var(--sep);box-shadow:var(--shadow)}
.rk{padding:9px 0}
.rk small{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:10px}
.rk small span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk small span:last-child{color:var(--txt2);flex:0 0 auto}

/* ── filas de ajuste ── */
.fila-in{display:flex;align-items:center;gap:10px;padding:6px 16px;border-bottom:1px solid var(--sep);min-height:52px}
.fila-in label{flex:1;font-size:16px}
.fila-in input{width:150px;text-align:right;border:0;background:none;padding:10px 4px;font-size:16px;font-weight:600;outline:none;font-variant-numeric:tabular-nums}
.fila-in input:focus{background:var(--fill);border-radius:8px}
.fila-in:last-child{border-bottom:0}
.seg{display:flex;gap:4px;background:var(--fill);border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px 10px;border-radius:9px;font-size:14px;font-weight:600;color:var(--txt2);min-height:38px}
.seg button.on{background:var(--card);color:var(--txt);box-shadow:var(--shadow)}
.lista{background:var(--card);border-radius:var(--r);border:1px solid var(--sep);box-shadow:var(--shadow);overflow:hidden}
.faj{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px 11px 12px;min-height:56px;text-align:left;border-bottom:1px solid var(--sep);background:var(--card);color:var(--txt);text-decoration:none}
.faj:last-child{border-bottom:0}
.faj:active{background:var(--fill)}
.faj .ico{flex:0 0 32px;width:32px;height:32px;border-radius:9px;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center}
.faj .ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.faj .tx{flex:1;min-width:0}
.faj .tx b{display:block;font-size:16px;font-weight:500;color:var(--txt)}
.faj .tx small{display:block;font-size:13px;color:var(--txt2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.faj .tx small.mal{color:var(--neg)}
.faj .tx small.ok{color:var(--acc)}
.faj .chev{flex:0 0 auto;transform:rotate(-45deg);margin-right:4px}
.faj.acento .tx b{color:var(--acc);font-weight:600}
.faj .seg{flex:0 0 auto;width:52%;max-width:230px}
.faj .seg button{min-height:32px;padding:5px 6px;font-size:13px}
.volver{display:flex;align-items:center;gap:6px;color:var(--acc);font-size:16px;font-weight:500;padding:6px 0 2px;margin-top:4px}
.volver i{width:10px;height:10px;border-left:2px solid var(--acc);border-bottom:2px solid var(--acc);transform:rotate(45deg);margin-left:4px}
.subtit{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:6px 4px 14px}
.pie{font-size:13px;color:var(--txt2);text-align:center;padding:26px 0 8px}
.lista .anios{padding:12px 14px}
.acciones{display:flex;flex-direction:column;gap:1px;background:var(--sep);border-radius:var(--r);overflow:hidden;border:1px solid var(--sep)}
.acciones button{background:var(--card);padding:15px 16px;text-align:left;font-size:16px;min-height:52px}
.acciones button.acento{color:var(--acc);font-weight:600}
.texto{font-size:14px;color:var(--txt2);line-height:1.5;padding:2px 4px}
.texto b{color:var(--txt)}

/* ── fab + nav ── */
.fab{
  position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:45;
  height:56px;padding:0 22px;border-radius:28px;background:var(--acc);color:#fff;
  font-size:16px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.22);display:flex;align-items:center;gap:8px;
}
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--nav);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--sep);display:flex;padding-bottom:env(safe-area-inset-bottom);
}
nav button{flex:1;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--txt2);font-size:10px;font-weight:600;min-height:52px}
nav button.on{color:var(--acc)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ── modal ── */
.velo{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center}
.velo.on{display:flex}
.hoja{
  width:100%;max-width:520px;background:var(--card);border-radius:20px 20px 0 0;
  padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;
}
@media(min-width:560px){ .velo{align-items:center} .hoja{border-radius:20px;margin:0 16px} }
.hoja h3{margin:0 0 14px;font-size:19px;font-weight:700}
.hoja input[type=text]{
  width:100%;padding:14px;border-radius:12px;border:1px solid var(--sep);background:var(--bg);
  font-size:17px;outline:none;margin-bottom:12px
}
.hoja input.grande{font-size:30px;font-weight:700;text-align:center;padding:16px;letter-spacing:-.02em}
.hoja input:focus{border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chips button{
  padding:0 14px;min-height:44px;border-radius:22px;background:var(--fill);
  font-size:15px;font-weight:600;border:1px solid transparent
}
.chips button.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.hoja .fila{display:flex;gap:8px}
.hoja .fila button{flex:1;min-height:50px;border-radius:14px;font-size:16px;font-weight:600;background:var(--fill)}
.hoja .fila button.pri{background:var(--acc);color:#fff}
.hoja .fila button.mal{color:var(--neg)}
.hoja .fila button.pri.mal{background:var(--neg);color:#fff}

.neg{color:var(--neg)}
.ok{color:var(--acc)}
.mudo{color:var(--txt2)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@keyframes kfPop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
@keyframes kfEntra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes kfSube{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes kfLatido{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
.dot{transition:background .25s}
.dot.ok{animation:kfPop .34s ease-out}
.estado span{transition:color .25s}
.estado.recien span{color:var(--acc)}
@keyframes kfDer{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes kfIzq{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.vista.on{animation:kfEntra .2s ease-out}
.vista.der{animation:kfDer .3s cubic-bezier(.22,.9,.26,1)}
.vista.izq{animation:kfIzq .3s cubic-bezier(.22,.9,.26,1)}
.velo{transition:background .22s ease}
.velo.on{background:rgba(0,0,0,.4)}
.velo.yendo{background:rgba(0,0,0,0)}
.tirador{width:38px;height:4px;border-radius:3px;background:var(--sep);margin:-8px auto 14px;flex:0 0 auto}
.hoja{touch-action:pan-y}
.hoja.arrastrando{transition:none}
.hoja.vuelve{transition:transform .26s cubic-bezier(.2,.9,.3,1)}
.hoja.yendo{transition:transform .24s cubic-bezier(.4,0,.8,.3)}
.big.contando{font-variant-numeric:tabular-nums}
@keyframes kfAnillo{from{stroke-dashoffset:163.4}}
body:before{content:'';position:fixed;left:0;right:0;top:0;height:240px;z-index:-1;pointer-events:none;
  background:radial-gradient(115% 80% at 50% 0%, var(--halo) 0%, rgba(0,0,0,0) 72%)}
nav button.on .np{background:var(--acc-soft)}
.np{display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:15px;transition:background .22s ease}
.accesos{display:flex;justify-content:space-around;gap:8px;padding:16px 4px 4px;margin-top:12px;border-top:1px solid var(--sep)}
.acc1{display:flex;flex-direction:column;align-items:center;gap:7px;flex:1;min-width:0;color:var(--txt2);font-size:12px;font-weight:500}
.acc1 i{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;
  background:var(--acc-soft);color:var(--acc);transition:transform .14s ease}
.acc1:active i{transform:scale(.9)}
.acc1 svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.acc1 span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sechd .ic{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:9px;
  background:var(--acc-soft);color:var(--acc);flex:0 0 auto;margin-right:10px}
.sechd .ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.final{text-align:center}
.final>small{display:block;margin-bottom:2px}
.final-fila{justify-content:center}
.final .big{font-size:38px;letter-spacing:-.035em}
.resumen{background:var(--card);border:1px solid var(--sep);border-radius:var(--r);box-shadow:var(--shadow);
  margin-top:8px;padding:18px 18px 14px;position:relative;overflow:hidden}
.resumen:before{content:'';position:absolute;right:-70px;top:-90px;width:210px;height:210px;border-radius:50%;
  background:var(--acc-soft);pointer-events:none}
.res-hd{display:flex;align-items:center;gap:14px;margin-bottom:14px;position:relative}
.anillo{width:64px;height:64px;flex:0 0 auto}
.anillo .prog{animation:kfAnillo 1.1s cubic-bezier(.25,.9,.3,1)}
.res-pct b{display:block;font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.res-pct small{display:block;font-size:13px;color:var(--txt2);margin-top:2px;max-width:190px;line-height:1.35}
.res-txt{position:relative}
.res-txt p{margin:0 0 9px;font-size:16px;line-height:1.5;color:var(--txt2)}
.res-txt p:last-child{margin-bottom:0}
.res-txt b{color:var(--txt);font-weight:600}
.res-txt p.mal,.res-txt p.mal b{color:var(--neg)}
.resumen.vacio:before{display:none}
.res-pie{margin-top:12px;padding-top:10px;border-top:1px solid var(--sep);font-size:12px;color:var(--txt2)}
.resumen.vacio .res-pie{display:none}
@keyframes kfTick{from{stroke-dashoffset:26}to{stroke-dashoffset:0}}
.pild{
  position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 66px);z-index:58;
  display:flex;align-items:center;gap:8px;max-width:calc(100% - 40px);
  padding:9px 15px 9px 12px;border-radius:22px;
  background:var(--card);border:1px solid var(--sep);box-shadow:0 4px 20px rgba(0,0,0,.16);
  font-size:14px;font-weight:500;color:var(--txt);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;pointer-events:none;
  opacity:0;transform:translate(-50%,-14px) scale(.94);
  transition:opacity .24s ease,transform .3s cubic-bezier(.2,.9,.3,1);
}
.pild.on{opacity:1;transform:translate(-50%,0) scale(1)}
.pild svg{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:var(--acc);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pild.on svg path{stroke-dasharray:26;animation:kfTick .4s cubic-bezier(.4,0,.2,1) .06s both}
.pild.aviso svg{stroke:var(--neg)}
@media print{ .pild{display:none!important} }
.velo.on .hoja{animation:kfSube .24s cubic-bezier(.2,.8,.3,1)}
.toast.on{animation:kfSube .24s ease-out}
@keyframes kfBarra{from{width:0}}
@keyframes kfTrazo{from{stroke-dashoffset:1300}to{stroke-dashoffset:0}}
.vista.on>.sec,.vista.on>.lista,.vista.on>.tabla,.vista.on>.manual>.sec{animation:kfEntra .26s ease-out both}
.vista.on>.sec:nth-of-type(2){animation-delay:.035s}
.vista.on>.sec:nth-of-type(3){animation-delay:.07s}
.vista.on>.sec:nth-of-type(4){animation-delay:.105s}
.vista.on>.sec:nth-of-type(5){animation-delay:.14s}
.vista.on>.sec:nth-of-type(n+6){animation-delay:.175s}
.rank .pista i{animation:kfBarra .55s cubic-bezier(.2,.8,.3,1)}
.chart svg{animation:kfEntra .4s ease-out}
.chart path.trazo{stroke-dasharray:1300;animation:kfTrazo 1.1s cubic-bezier(.3,.9,.3,1) forwards}
.chart circle{animation:kfPop .3s ease-out both;animation-delay:.5s}
.chart rect{animation:kfBrota .5s cubic-bezier(.2,.8,.3,1) both}
@keyframes kfBrota{from{opacity:0;transform:translateY(6px)}to{opacity:inherit;transform:none}}
.meses button{transition:background .18s,color .18s,transform .12s}
.meses button:active{transform:scale(.94)}
#nav button{transition:color .18s}
#nav button.on{animation:kfPop .26s ease-out}
.sechd{transition:background .15s}
.sechd:active{background:var(--fill)}
.cuerpo{will-change:height}
.pista i{transition:width .3s ease-out,background .25s}
.big{transition:color .25s}
.big.latido{animation:kfLatido .3s ease-out}
.faj .ico{transition:transform .15s}
.faj:active .ico{transform:scale(.9)}
.fab{transition:transform .12s}
.fab:active{transform:scale(.92)}
.mas:active,.acciones button:active{opacity:.55}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.dot.off{background:var(--neg)}
.puerta{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}
.puerta.on{display:flex}
.puerta .caja{width:100%;max-width:340px;text-align:center}
.puerta h2{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0 0 8px}
.puerta p{font-size:15px;color:var(--txt2);margin:0 0 20px}
.puerta p.err{color:var(--neg)}
.puerta input{width:100%;padding:15px;border-radius:14px;border:1px solid var(--sep);background:var(--card);
  font-size:17px;outline:none;margin-bottom:12px;text-align:center}
.puerta input:focus{border-color:var(--acc)}
.puerta button{width:100%;min-height:52px;border-radius:14px;background:var(--acc);color:#fff;font-size:17px;font-weight:600}
.anios{display:flex;flex-wrap:wrap;gap:8px}
.anios button{min-height:44px;padding:0 18px;border-radius:14px;background:var(--card);border:1px solid var(--sep);
  font-size:15px;font-weight:600;color:var(--txt2)}
.anios button.on{background:var(--acc);color:#fff;border-color:transparent}
.soloPrint{display:none}
@media print{
  .soloPrint{display:block;font-weight:700;font-size:16px;margin:0 0 8px}
  header,nav,.fab,.toast,.velo,#avisos,.meses{display:none!important}
  body{background:#fff;color:#000;padding:0;font-size:12px}
  .vista{display:none!important} .vista#v-anio{display:block!important}
  .tabla,.chart,.rank,.sec{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  th,td{padding:5px 8px} h2.tit{margin-top:14px}
  .tabla{overflow:visible} table{font-size:11px}
  .pista i{background:#333!important} .pista i.verde{background:#1f9d55!important}
}
</style>
</head>

<script>

/* ═══ 1 · datos por defecto ══════════════════════════════════════ */
function mesVacio(){

    deudas:[{nombre:'Préstamo',monto:0},{nombre:'Tarjeta de crédito',monto:0}],
    ahorroMesARS:0, metaAhorroPct:0.10, ahorroMesUSD:0, compraARS:0, compraUSD:0,
    retiroARS:0, ventaUSD:0, ventaARS:0, reposicionARS:0, movimientos:[]
  };
}
function normalizar(d){
  d = d && typeof d === 'object' ? d : {};
  d.version = 1;
  d.anio = num(d.anio) || 2026;
  d.actualizado = d.actualizado || '';
  d.ahorroAnioAnterior = num(d.ahorroAnioAnterior);
  d.usdAnioAnterior = num(d.usdAnioAnterior);
  d.aReponerAnterior = num(d.aReponerAnterior);   // lo que quedó por reponer al ahorro al cerrar el año anterior
  d.cotizacionUSD = num(d.cotizacionUSD) || 1499;
  d.cotizacionFecha = d.cotizacionFecha || '';
  if(!Array.isArray(d.cripto)) d.cripto = [{activo:'BTC',cantidad:0,precioUSD:0}];
  d.cripto = d.cripto.map(function(c){ return {activo:String(c&&c.activo||''),cantidad:num(c&&c.cantidad),precioUSD:num(c&&c.precioUSD)}; });
  if(!Array.isArray(d.meses)) d.meses = [];
  for(var i=0;i<12;i++){
    var m = d.meses[i] && typeof d.meses[i]==='object' ? d.meses[i] : mesVacio();
    for(var s=0;s<SECS.length;s++){
      var k = SECS[s].k;
      if(!Array.isArray(m[k])) m[k] = [];
      m[k] = m[k].map(function(it){
        var o = {nombre:String(it&&it.nombre||''),monto:num(it&&it.monto),tope:Math.max(0,num(it&&it.tope))};
        if(it && it.pagado === true) o.pagado = true;
        if(it && it.pagado === false) o.pagado = false;
        return o;
      });
    }
    m.ahorroMesARS = num(m.ahorroMesARS);
    m.ahorroMesUSD = num(m.ahorroMesUSD);
    m.compraARS = num(m.compraARS);
    m.compraUSD = num(m.compraUSD);
    m.retiroARS = num(m.retiroARS);       // pesos que saqué del ahorro
    m.ventaUSD = num(m.ventaUSD);         // dólares que vendí
    m.ventaARS = num(m.ventaARS);         // pesos que me dieron por esos dólares
    m.reposicionARS = num(m.reposicionARS); // pesos que devolví al ahorro
    if(!Array.isArray(m.movimientos)) m.movimientos = [];
    m.movimientos = m.movimientos.filter(function(x){ return x && typeof x==='object'; }).map(function(x){
      return {id:String(x.id||''), fecha:String(x.fecha||''), sec:String(x.sec||'gastosVariables'), nombre:String(x.nombre||''), monto:num(x.monto)};
    });
    m.metaAhorroPct = m.metaAhorroPct==null ? 0.10 : num(m.metaAhorroPct);
    d.meses[i] = m;
  }
  d.meses.length = 12;
  if(!d.planDeudas || typeof d.planDeudas!=='object') d.planDeudas = {};
  Object.keys(d.planDeudas).forEach(function(k){
    var p = d.planDeudas[k] || {};
    d.planDeudas[k] = {total:num(p.total), cuotas:Math.max(0, Math.round(num(p.cuotas))), pagadasAntes:Math.max(0, Math.round(num(p.pagadasAntes)))};
  });
  if(!d.ui || typeof d.ui!=='object') d.ui = {};
  if(['auto','claro','oscuro'].indexOf(d.ui.tema)<0) d.ui.tema = 'auto';
  if(!d.ui.col || typeof d.ui.col!=='object') d.ui.col = {};
  return d;
}
function num(v){ var n = typeof v==='number' ? v : parseFloat(v); return isFinite(n) ? n : 0; }

/* ═══ 2 · formato es-AR ═════════════════════════════════════════ */
function grupos(s){ return s.replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
function fARS(n){
  if(oculto) return PUNTOS;
  n = Math.round(num(n));
  if(n === 0) return '—';
  var s = '$' + grupos(String(Math.abs(n)));
  return n < 0 ? '(' + s + ')' : s;
}
function fUSD(n){
  if(oculto) return PUNTOS;
  n = num(n);
  if(Math.abs(n) < 0.005) return '—';
  var p = Math.abs(n).toFixed(2).split('.');
  var s = 'US$ ' + grupos(p[0]) + ',' + p[1];
  return n < 0 ? '(' + s + ')' : s;
}
function hARS(n){ var t = fARS(n); return !oculto && num(n) < 0 ? '<span class="neg">'+t+'</span>' : t; }
function hUSD(n){ var t = fUSD(n); return !oculto && num(n) < 0 ? '<span class="neg">'+t+'</span>' : t; }
function fPct(p){ return (num(p)*100).toFixed(0).replace('.',',') + '%'; }
function corto(n){
  if(oculto) return '\u2022\u2022';
  n = Math.abs(Math.round(num(n)));
  if(n >= 1000000) return (n/1000000).toFixed(1).replace('.',',')+'M';
  if(n >= 1000) return Math.round(n/1000)+'k';
  return String(n);
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function parseNum(s){
  s = String(s).replace(/[^0-9,.\-]/g,'');
  if(s.indexOf(',') > -1) s = s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  var n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
function crudo(n){ n = num(n); return n === 0 ? '' : String(n).replace('.',','); }
function fechaCorta(iso){
  if(!iso) return '';
  var d = new Date(iso);
  if(isNaN(d)) return '';
  function p(x){ return (x<10?'0':'')+x; }
  return p(d.getDate())+'/'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes());
}

/* ═══ 3 · cálculos (funciones puras) ════════════════════════════ */
function suma(a){ var t=0; for(var i=0;i<(a||[]).length;i++) t += num(a[i].monto); return t; }
function calc(m){
  var ti = suma(m.ingresos), sf = suma(m.gastosFijos), sv = suma(m.gastosVariables);
  var tg = sf + sv, td = suma(m.deudas), ah = num(m.ahorroMesARS);
  var sacado = num(m.retiroARS) + num(m.ventaARS), repuesto = num(m.reposicionARS);
  var libre = ti - tg - ah + sacado - repuesto;
  return {
    totalIngresos: ti, subtotalFijos: sf, subtotalVariables: sv,
    totalGastos: tg, totalDeudas: td, ahorroMesARS: ah,
    retiroARS: num(m.retiroARS), ventaUSD: num(m.ventaUSD), ventaARS: num(m.ventaARS),
    reposicionARS: repuesto, sacadoARS: sacado,
    disponibleLibre: libre, disponibleFinal: libre - td,
    ahorroSugerido: ti * num(m.metaAhorroPct),
    pctGastos: ti > 0 ? tg/ti : 0,
    pctAhorro: ti > 0 ? ah/ti : 0
  };
}
function serie(d){
  var out = [], accA = num(d.ahorroAnioAnterior), accU = num(d.usdAnioAnterior), accR = num(d.aReponerAnterior);
  for(var i=0;i<12;i++){
    var c = calc(d.meses[i]);
    var m = d.meses[i];
    c.compraARS = num(m.compraARS);
    c.compraUSD = num(m.compraUSD);
    c.cotizacionPagada = c.compraUSD > 0 ? c.compraARS / c.compraUSD : 0;
    accA += c.ahorroMesARS - c.compraARS - c.retiroARS + c.reposicionARS;
    accU += num(m.ahorroMesUSD) + c.compraUSD - c.ventaUSD;
    accR = Math.max(0, accR + c.sacadoARS - c.reposicionARS);
    c.ahorroAcumulado = accA;
    c.aReponer = accR;
    c.usdMes = num(m.ahorroMesUSD) + c.compraUSD - c.ventaUSD;
    c.usdAcumulado = accU;
    c.equivalenteARS = accU * num(d.cotizacionUSD);
    out.push(c);
  }
  return out;
}
function costoDolares(d){
  var ars = 0, usd = 0;
  for(var i=0;i<12;i++){ ars += num(d.meses[i].compraARS); usd += num(d.meses[i].compraUSD); }
  return {ars: ars, usd: usd, promedio: usd > 0 ? ars/usd : 0};
}
function notaCompra(m, acum){
  var a = num(m.compraARS), u = num(m.compraUSD);
  if(a > 0 && u > 0){
    var t = 'Pagaste ' + fARS(a/u) + ' por d\u00f3lar. ';
    t += acum < 0 ? 'Ojo: est\u00e1s pasando m\u00e1s pesos de los que ten\u00e9s ahorrados.'
       : Math.round(acum) === 0 ? 'Pasaste todo el ahorro a d\u00f3lares; no te quedan pesos ahorrados.'
       : 'Te quedan ' + fARS(acum) + ' ahorrados en pesos.';
    return t;
  }
  if(a > 0 || u > 0) return 'Complet\u00e1 los dos campos para calcular a cu\u00e1nto lo pagaste.';
  return 'Si pas\u00e1s parte del ahorro a d\u00f3lares, cargalo ac\u00e1: se descuenta de los pesos y se suma a los d\u00f3lares.';
}
var MARCABLE = {gastosFijos:true, deudas:true};
function mesTope(){
  var hoy = new Date();
  if(D.anio < hoy.getFullYear()) return 11;
  if(D.anio > hoy.getFullYear()) return -1;
  return hoy.getMonth();
}
function estaPagado(j, it){
  if(!it) return false;
  if(it.pagado === true) return true;
  if(it.pagado === false) return false;
  return num(it.monto) > 0 && j <= mesTope();   // los meses que ya pasaron se dan por pagados
}
function planDe(nombre){ return D.planDeudas[String(nombre||'').trim()] || null; }
function estadoDeuda(nombre, i){
  var p = planDe(nombre); if(!p || !p.cuotas) return null;
  var n = String(nombre||'').trim(), pag = p.pagadasAntes, antes = p.pagadasAntes;
  for(var j=0;j<=i;j++){
    var ls = D.meses[j].deudas, pagoMes = false;
    for(var q=0;q<ls.length;q++) if(String(ls[q].nombre||'').trim() === n && estaPagado(j, ls[q])) pagoMes = true;
    if(pagoMes){ pag++; if(j < i) antes++; }
  }
  var esteMes = pag > antes, restantes = Math.max(0, p.cuotas - pag);
  // la proyección arranca en el primer mes sin pagar, no en el mes que estés mirando
  var primero = 0, jj;
  for(jj=0;jj<12;jj++){
    var lz = D.meses[jj].deudas, hay = false;
    for(var qz=0;qz<lz.length;qz++) if(String(lz[qz].nombre||'').trim() === n && estaPagado(jj, lz[qz])) hay = true;
    if(hay) primero = jj + 1;
  }
  if(primero < mesTope() + 1) primero = mesTope() + 1;
  if(primero < 0) primero = 0;
  var k = primero + restantes - 1;
  var fin = restantes > 0 ? {mes:((k % 12) + 12) % 12, anio:D.anio + Math.floor(k/12)} : null;
  var valor = p.cuotas ? p.total/p.cuotas : 0;
  return {plan:p, pagadas:pag, restantes:restantes, esteMes:esteMes, cuotaN:esteMes ? pag : antes + 1,
          fin:fin, saldo:restantes*valor, pct:Math.min(1, pag/p.cuotas)};
}
function valorCuota(p){ return p && p.cuotas ? Math.round(num(p.total)/p.cuotas) : 0; }
function pagadasHasta(nombre, hasta){
  var n = String(nombre||'').trim(), c = 0, j, q;
  for(j=0;j<hasta && j<12;j++){
    var ls = D.meses[j].deudas;
    for(q=0;q<ls.length;q++) if(String(ls[q].nombre||'').trim() === n && estaPagado(j, ls[q])){ c++; break; }
  }
  return c;
}
function pendientesDesde(nombre, desde){
  var p = planDe(nombre); if(!p || !p.cuotas) return 0;
  return Math.max(0, p.cuotas - p.pagadasAntes - pagadasHasta(nombre, desde));
}
function planDeCarga(nombre, desde){
  var p = planDe(nombre), r = pendientesDesde(nombre, desde);
  var caben = Math.min(r, 12 - desde);
  return {valor:valorCuota(p), poner:caben, hasta:desde + caben - 1, sobran:r - caben, desde:desde};
}
function cargarCuotas(nombre, desde){
  var n = String(nombre||'').trim(), pc = planDeCarga(n, desde), j, q, ls, hallado;
  for(j=desde;j<desde+pc.poner;j++){
    ls = D.meses[j].deudas; hallado = false;
    for(q=0;q<ls.length;q++) if(String(ls[q].nombre||'').trim() === n){ ls[q].monto = pc.valor; hallado = true; break; }
    if(!hallado) ls.push({nombre:n, monto:pc.valor});
  }
  return pc;
}
function textoDeuda(nombre, i){
  var e = estadoDeuda(nombre, i);
  if(!e) return 'Cargar cuotas';
  if(e.restantes === 0 && e.esteMes) return 'Última cuota: la ' + e.pagadas + ' de ' + e.plan.cuotas + '. Terminada.';
  if(e.restantes === 0) return 'Terminada: ' + e.plan.cuotas + ' cuotas pagas.';
  var t = (e.esteMes ? 'Cuota ' + e.cuotaN : 'Sin pago este mes; va la ' + e.cuotaN) + ' de ' + e.plan.cuotas
        + ' · quedan ' + e.restantes + (e.saldo ? ' (' + fARS(e.saldo) + ')' : '');
  if(e.fin) t += ' · terminás en ' + MESES[e.fin.mes].toLowerCase() + (e.fin.anio !== D.anio ? ' ' + e.fin.anio : '');
  return t;
}
function proyeccionDeudas(){
  var out = [], vistos = {};
  for(var i=0;i<12;i++){
    var ls = D.meses[i].deudas;
    for(var q=0;q<ls.length;q++){
      var n = String(ls[q].nombre||'').trim();
      if(!n || vistos[n] || !planDe(n)) continue;
      vistos[n] = true;
      var ultimo = -1;
      for(var j=11;j>=0;j--){
        var l2 = D.meses[j].deudas, hay = false;
        for(var r=0;r<l2.length;r++) if(String(l2[r].nombre||'').trim()===n && num(l2[r].monto)>0) hay = true;
        if(hay){ ultimo = j; break; }
      }
      var e = estadoDeuda(n, ultimo >= 0 ? ultimo : new Date().getMonth());
      if(e) out.push({nombre:n, e:e});
    }
  }
  return out;
}
function criptoUSD(d){ var t=0; for(var i=0;i<d.cripto.length;i++) t += num(d.cripto[i].cantidad)*num(d.cripto[i].precioUSD); return t; }
function patrimonio(d){
  var s = serie(d), cot = num(d.cotizacionUSD);
  var liqUSD = cot > 0 ? s[11].ahorroAcumulado / cot : 0;
  var cUSD = criptoUSD(d);
  var pUSD = liqUSD + s[11].usdAcumulado + cUSD;
  return {
    ahorroARS: s[11].ahorroAcumulado, liqUSD: liqUSD,
    usd: s[11].usdAcumulado, criptoUSD: cUSD,
    patrimonioUSD: pUSD, patrimonioARS: pUSD * cot
  };
}
function ranking(d){
  var map = {}, i, j;
  for(i=0;i<12;i++){
    var m = d.meses[i], ls = m.gastosFijos.concat(m.gastosVariables);
    for(j=0;j<ls.length;j++){
      var n = (ls[j].nombre||'(sin nombre)').trim();
      map[n] = (map[n]||0) + num(ls[j].monto);
    }
  }
  var arr = Object.keys(map).map(function(k){ return {nombre:k, monto:map[k]}; })
              .filter(function(x){ return x.monto > 0; });
  arr.sort(function(a,b){ return b.monto - a.monto; });
  return arr.slice(0, 12);
}

var ultimos = {};
function contar(id, hasta, fmt){
  var el = document.getElementById(id);
  if(!el) return;
  var desde = ultimos[id];
  ultimos[id] = hasta;
  if(oculto || menosMovimiento() || desde === undefined || desde === hasta){ return; }
  var t0 = 0, dur = 520;
  var paso = function(t){
    if(!t0) t0 = t;
    var p = Math.min(1, (t - t0) / dur);
    var e = 1 - Math.pow(1 - p, 3);           // desacelera al final
    var vivo = document.getElementById(id);
    if(!vivo) return;
    vivo.textContent = fmt(desde + (hasta - desde) * e);
    if(p < 1) requestAnimationFrame(paso);
  };
  if(window.requestAnimationFrame) requestAnimationFrame(paso);
}
function menosMovimiento(){
  try{ return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
  catch(e){ return false; }
}
function limpiarAlto(cu){ cu.style.height = ''; cu.style.transition = ''; cu.style.opacity = ''; cu.style.overflow = ''; }
function plegarAnim(sec, cerrar){
  var cu = sec.querySelector('.cuerpo');
  if(!cu || menosMovimiento()){ sec.classList.toggle('cerrada', cerrar); return; }
  if(cu.getAttribute('data-anim') === '1') return;   // ya está en movimiento, no encimar
  cu.setAttribute('data-anim', '1');
  cu.style.overflow = 'hidden';
  var fin = function(){ limpiarAlto(cu); cu.removeAttribute('data-anim'); };
  if(cerrar){
    cu.style.height = cu.scrollHeight + 'px';
    void cu.offsetHeight;
    cu.style.transition = 'height .22s ease, opacity .16s ease';
    cu.style.height = '0px'; cu.style.opacity = '0';
    setTimeout(function(){ sec.classList.add('cerrada'); fin(); }, 230);
  } else {
    sec.classList.remove('cerrada');
    cu.style.height = '0px'; cu.style.opacity = '0';
    void cu.offsetHeight;
    cu.style.transition = 'height .26s cubic-bezier(.2,.8,.3,1), opacity .22s ease';
    cu.style.height = cu.scrollHeight + 'px'; cu.style.opacity = '1';
    setTimeout(fin, 280);
  }
}

function seccion(S, m){
  var lista = m[S.k], sub = suma(lista), h = '';
  h += '<div class="sec '+(abierta(S.k)?'':'cerrada')+'" data-sec="'+S.k+'">';
  h += '<button class="sechd" data-act="col" data-k="'+S.k+'">'
     + (ICOSEC[S.k] ? '<span class="ic">'+ICOSEC[S.k]+'</span>' : '')
     + '<span class="nom">'+S.t+'</span>'
     + '<span class="sub" id="sub-'+S.k+'">'+fARS(sub)+'</span><i class="chev"></i></button>';
  h += '<div class="cuerpo">';
  for(var i=0;i<lista.length;i++){
    var pg = MARCABLE[S.k] && estaPagado(mes, lista[i]);
    h += '<div class="item'+(pg?' pago':'')+'">'
       +   (MARCABLE[S.k] ? '<button class="chk'+(pg?' on':'')+'" data-act="pagar" data-k="'+S.k+'" data-i="'+i+'" aria-label="'+(pg?'Marcar como no pagado':'Marcar como pagado')+'"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>' : '')
       +   '<input class="nombre" data-k="'+S.k+'" data-i="'+i+'" value="'+esc(lista[i].nombre)+'" aria-label="Nombre">'
       +   '<input class="monto" inputmode="decimal" enterkeyhint="done" data-k="'+S.k+'" data-i="'+i+'" value="'+fARS(lista[i].monto)+'" aria-label="Monto">'
       +   '<button class="x" data-act="del" data-k="'+S.k+'" data-i="'+i+'" aria-label="Borrar">×</button>'
       + '</div>';
    if(TOPEABLE[S.k] && num(lista[i].tope) > 0){
      h += filaTope(S.k, i, lista[i]);
    }
    if(S.k === 'deudas'){
      h += '<button class="dinfo'+(planDe(lista[i].nombre)?'':' vacia')+'" data-act="plan" data-i="'+i+'">'+textoDeuda(lista[i].nombre, mes)+'</button>';
    }
  }
  if(!lista.length) h += '<div class="nota">Todavía no hay ítems acá. Agregá el primero.</div>';
  if(S.k !== 'gastosVariables' && mes > 0 && sub === 0 && suma(D.meses[mes-1][S.k]) > 0){
    h += '<button class="mas" data-act="copiar" data-k="'+S.k+'">Copiar los montos de '+MESES[mes-1].toLowerCase()+'</button>';
  }
  h += '<button class="mas" data-act="add" data-k="'+S.k+'">+ Agregar en '+S.t.toLowerCase()+'</button>';
  if(TOPEABLE[S.k] && lista.length) h += '<button class="mas" data-act="topes" data-k="'+S.k+'">Poner topes</button>';
  if(lista.length > 1) h += '<button class="mas" data-act="ordenar" data-k="'+S.k+'">Cambiar el orden</button>';
  h += '</div></div>';
  return h;
}
function secMovimientos(m){
  var mv = m.movimientos.slice().reverse(), tot = 0, i;
  for(i=0;i<mv.length;i++) tot += mv[i].monto;
  var h = '<div class="sec '+(abierta('movs')?'':'cerrada')+'">';
  h += '<button class="sechd" data-act="col" data-k="movs"><span class="nom">Gastos rápidos</span>'
     + '<span class="sub">'+fARS(tot)+'</span><i class="chev"></i></button><div class="cuerpo">';
  for(i=0;i<mv.length;i++){
    var d = new Date(mv[i].fecha), f = isNaN(d) ? '' : (d.getDate()<10?'0':'')+d.getDate()+'/'+((d.getMonth()+1)<10?'0':'')+(d.getMonth()+1);
    h += '<div class="item mov"><span class="fecha">'+f+'</span><span class="nom">'+esc(mv[i].nombre)+'</span>'
       + '<span class="monto">'+fARS(mv[i].monto)+'</span>'

  h += '</div></div>';

}

function notaRetiro(m){
  var r = serie(D)[mes].aReponer, v = num(m.ventaUSD), a = num(m.ventaARS), t = '';
  if(v > 0 && a > 0) t = 'Vendiste a ' + fARS(a/v) + ' por d\u00f3lar. ';
  if(r > 0) t += 'Te falta reponer ' + fARS(r) + ' al ahorro.';
  else t += 'No le deb\u00e9s nada al ahorro.';
  return t;
}

function mesesCargados(s){
  var out = [], i;
  for(i=0;i<12;i++) if(s[i].totalIngresos || s[i].totalGastos) out.push(i);
  return out;
}
function anillo(pct){
  var r = 26, c = 2*Math.PI*r, off = c * (1 - Math.max(0, Math.min(1, pct)));
  return '<svg viewBox="0 0 64 64" class="anillo" aria-hidden="true">'
       +   '<circle cx="32" cy="32" r="'+r+'" fill="none" stroke="var(--fill)" stroke-width="7"/>'
       +   '<circle cx="32" cy="32" r="'+r+'" fill="none" stroke="var(--acc)" stroke-width="7" stroke-linecap="round"'
       +     ' class="prog" transform="rotate(-90 32 32)" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/>'
       + '</svg>';
}
function resumenAnio(s){
  var act = mesesCargados(s), i, n = act.length;
  if(n < 2) return '<div class="resumen vacio">'
    + '<div class="res-txt"><p>Cargá ' + (n === 0 ? 'un par de meses' : 'un mes más') + ' y acá te resumo el año: cuánto entra, cuánto se va y con cuánto cerrás.</p></div></div>';
  var sumG = 0, sumI = 0, sumA = 0, peor = act[0], mejor = act[0], rojos = [];
  for(i=0;i<n;i++){
    var c = s[act[i]];
    sumG += c.totalGastos; sumI += c.totalIngresos; sumA += c.ahorroMesARS;
    if(c.totalGastos > s[peor].totalGastos) peor = act[i];
    if(c.totalGastos < s[mejor].totalGastos) mejor = act[i];
    if(c.disponibleFinal < 0) rojos.push(MESES[act[i]]);
  }
  var promG = Math.round(sumG/n), promI = Math.round(sumI/n), promA = Math.round(sumA/n);
  var pct = sumI > 0 ? sumA/sumI : 0, ultimo = act[n-1], faltan = 11 - ultimo;
  var h = '<div class="resumen">';
  h += '<div class="res-hd">' + anillo(pct)
     + '<div class="res-pct"><b>' + Math.round(pct*100) + '%</b>'
     + '<small>de lo que entra lo estás ahorrando</small></div></div>';
  h += '<div class="res-txt">';
  h += '<p>Por mes entran <b>'+fARS(promI)+'</b> y se van <b>'+fARS(promG)+'</b>. Te quedan <b>'+fARS(promI-promG)+'</b>.</p>';
  h += '<p>Gastaste más en <b>'+MESES[peor]+'</b> y menos en <b>'+MESES[mejor]+'</b>.</p>';
  if(faltan > 0 && promA !== 0) h += '<p>A este ritmo cerrás diciembre con <b>'+fARS(s[ultimo].ahorroAcumulado + promA*faltan)+'</b>.</p>';
  if(rojos.length) h += '<p class="mal">' + (rojos.length === 1 ? 'En <b>'+rojos[0]+'</b> gastaste' : 'En <b>'+rojos.length+' meses</b> gastaste')
     + ' más de lo que entró.</p>';
  h += '</div><div class="res-pie">' + n + ' ' + (n === 1 ? 'mes cargado' : 'meses cargados') + ' de ' + D.anio + '</div></div>';
  return h;
}

     + '<td>'+hARS(T.s)+'</td><td>'+hARS(T.r)+'</td><td>'+hARS(T.d)+'</td><td>'+hARS(T.f)+'</td><td>'+hARS(s[11].ahorroAcumulado)+'</td></tr>';

        '<div class="chart">'
      + lineas(s.map(function(c){return c.totalIngresos;}), s.map(function(c){return c.totalGastos;}))
      + '<div class="leyenda"><span><i style="background:var(--acc)"></i>Ingresos</span>'
      + '<span><i style="background:var(--txt2)"></i>Gastos</span></div></div>');

  var rk = ranking(D), hR = '<div class="rank" style="padding:12px 16px">';
  if(!rk.length) hR += '<div class="nota" style="padding:2px 0">Cuando cargues gastos, acá vas a ver el ranking del año por categoría.</div>';

  for(i=0;i<rk.length;i++){
    hR += '<div class="rk"><small><span>'+esc(rk[i].nombre)+'</span><span>'+fARS(rk[i].monto)+'</span></small>'
       + '<div class="pista"><i style="width:'+(rk[i].monto/max*100)+'%"></i></div></div>';
  }
  hR += '</div>';
  h += plegable('anRank', 'En qué se te fue la plata', rk.length ? esc(rk[0].nombre) : '', hR);

  var pd = proyeccionDeudas();
  if(pd.length){

      hD += '<div class="rk"><small><span>'+esc(pd[i].nombre)+'</span><span>'+e.pagadas+' de '+e.plan.cuotas

    for(i=0;i<anios.length;i++){

function lineas(a, b){
  var W=340, H=170, pl=34, pr=6, pt=8, pb=20, i;
  var max = Math.max.apply(null, a.concat(b).concat([1]));
  max = Math.ceil(max/4)*4 || 1;
  var x = function(i){ return pl + i*(W-pl-pr)/11; };
  var y = function(v){ return pt + (H-pt-pb) * (1 - v/max); };
  var g = '';
  for(i=0;i<=3;i++){
    var v = max*i/3, yy = y(v);
    g += '<line x1="'+pl+'" y1="'+yy+'" x2="'+(W-pr)+'" y2="'+yy+'" stroke="currentColor" stroke-opacity=".12"/>'
       + '<text x="'+(pl-5)+'" y="'+(yy+3.5)+'" font-size="8.5" text-anchor="end" fill="currentColor" opacity=".5">'+corto(v)+'</text>';
  }
  function path(arr){ var d=''; for(var i=0;i<12;i++) d += (i?'L':'M') + x(i).toFixed(1) + ' ' + y(arr[i]).toFixed(1) + ' '; return d; }
  for(i=0;i<12;i+=2) g += '<text x="'+x(i)+'" y="'+(H-6)+'" font-size="8.5" text-anchor="middle" fill="currentColor" opacity=".5">'+CORTOS[i]+'</text>';
  g += '<path class="trazo" d="'+path(b)+'" fill="none" stroke="var(--txt2)" stroke-width="2" stroke-linejoin="round"/>';
  g += '<path class="trazo" d="'+path(a)+'" fill="none" stroke="var(--acc)" stroke-width="2.4" stroke-linejoin="round"/>';
  for(i=0;i<12;i++) if(a[i]) g += '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(a[i]).toFixed(1)+'" r="2.4" fill="var(--acc)"/>';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ingresos contra gastos por mes">'+g+'</svg>';
}
function barras(arr){
  var W=340, H=150, pl=34, pr=6, pt=8, pb=20, i;
  var max = Math.max.apply(null, arr.concat([1]));
  var min = Math.min.apply(null, arr.concat([0]));
  max = max <= 0 ? 1 : max;
  var base = pt + (H-pt-pb) * (max/(max-min));
  var g = '<line x1="'+pl+'" y1="'+base.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+base.toFixed(1)+'" stroke="currentColor" stroke-opacity=".2"/>'
        + '<text x="'+(pl-5)+'" y="'+(pt+8)+'" font-size="8.5" text-anchor="end" fill="currentColor" opacity=".5">'+corto(max)+'</text>';
  var an = (W-pl-pr)/12;
  for(i=0;i<12;i++){
    var v = arr[i], alto = Math.abs(v)/(max-min)*(H-pt-pb);
    var xx = pl + i*an + an*0.16, ancho = an*0.68;
    var yy = v >= 0 ? base - alto : base;
    g += '<rect x="'+xx.toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+ancho.toFixed(1)+'" height="'+Math.max(alto,0.6).toFixed(1)+'" rx="2" fill="'+(v<0?'var(--neg)':'var(--acc)')+'" opacity="'+(v?1:.25)+'"/>';
    if(i%2===0) g += '<text x="'+(xx+ancho/2).toFixed(1)+'" y="'+(H-6)+'" font-size="8.5" text-anchor="middle" fill="currentColor" opacity=".5">'+CORTOS[i]+'</text>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ahorro acumulado por mes">'+g+'</svg>';
}

    var hoy = cd.usd * num(D.cotizacionUSD), dif = hoy - cd.ars;

        '<div class="fila-in"><label>Ahorro líquido en pesos</label><span class="mudo">'+hARS(p.ahorroARS)+'</span></div>'
      + '<div class="fila-in"><label>Dólares guardados</label><span class="mudo">'+hUSD(p.usd)+'</span></div>'
      + '<div class="fila-in"><label>Cripto</label><span class="mudo">'+hUSD(p.criptoUSD)+'</span></div>'
      + '<div class="fila-in"><label>Dólares del año anterior</label>'
      +   '<input class="monto usd" inputmode="decimal" data-campo="usdAnioAnterior" value="'+fUSD(D.usdAnioAnterior)+'"></div>'
      + '<div style="padding:16px;border-top:1px solid var(--sep)">'
      +   '<small class="mudo" style="font-size:12px">Todo junto</small>'
      +   '<div class="big ok" id="bigPatri" style="font-size:30px;font-weight:700;letter-spacing:-.03em">'+fUSD(p.patrimonioUSD)+'</div>'
      +   '<div class="mudo" style="font-size:15px">'+fARS(p.patrimonioARS)+'</div>'
      + '</div>')
     + '<div style="height:20px"></div>';
  document.getElementById('v-usd').innerHTML = h;
  contar('bigPatri', p.patrimonioUSD, function(v){ return fUSD(v); });
}

function textoUltimaCopia(){
  var dsc = diasSinCopia();
  return dsc === -1 ? {t:'Todavía no hiciste ninguna', clase:'mal'}
       : dsc === 0 ? {t:'Última copia: hoy', clase:'ok'}

}

var tRecien = null;

function armarCopia(){
  if(sucio) guardar();

function fechaArchivo(){ var d = new Date(); function p(x){ return (x<10?'0':'')+x; } return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function diagCompartir(){
  var out = [];
  if(!navigator.share) return 'este navegador no tiene menú de compartir';
  if(!navigator.canShare) return 'comparte, pero no deja consultar si acepta archivos';
  var intentos = [['.json','application/json','json'],['.json','text/plain','json como texto'],['.txt','text/plain','txt']], i, f;
  for(i=0;i<intentos.length;i++){
    var ok = false;
    try{ f = new File(['{}'], 'x'+intentos[i][0], {type:intentos[i][1]}); ok = navigator.canShare({files:[f]}); }catch(e){ ok = false; }
    out.push(intentos[i][2] + ': ' + (ok ? 'sí' : 'no'));
  }
  return out.join(' · ');
}
function archivoCompartible(texto, base){
  // Chrome en Android no deja compartir cualquier tipo de archivo: se prueban varias combinaciones
  var intentos = [
    [base + '.json', 'application/json'],
    [base + '.json', 'text/plain'],
    [base + '.txt',  'text/plain']
  ], i, f;
  if(!(navigator.share && navigator.canShare)) return null;
  for(i=0;i<intentos.length;i++){
    try{
      f = new File([texto], intentos[i][0], {type:intentos[i][1]});
      if(navigator.canShare({files:[f]})) return f;
    }catch(e){}
  }
  return null;
}
function hacerCopia(){
  var texto = JSON.stringify(armarCopia(), null, 1), base = 'kibfinanzas-copia-' + fechaArchivo();
  var nombre = base + '.json';
  var f = archivoCompartible(texto, base);
  var puedeCompartir = !!f;
  var listo = function(){
    try{ localStorage.setItem(LSCOPIA, new Date().toISOString()); }catch(e){}
    document.getElementById('avisos').innerHTML = '';
    if(tab === 'ajustes') renderAjustes();
    pildora('Copia de seguridad hecha');
  };
  if(puedeCompartir){
    navigator.share({files:[f], title:'Copia de kibFinanzas'}).then(listo)['catch'](function(e){
      if(e && e.name === 'AbortError') return;
      descargar(texto, nombre, 'application/json'); listo();
    });
  } else {
    descargar(texto, nombre, 'application/json'); listo();
    ultimaCopiaTexto = texto; ultimaCopiaNombre = nombre;
    alertaCompartir('Copia descargada', 'Se guardó <b>' + nombre + '</b> en la carpeta <b>Descargas</b>. Este navegador no deja compartir el archivo directamente desde la app.<br><br>Abrí la app <b>Archivos</b> o <b>Descargas</b> del teléfono, mantené apretado el archivo y usá <b>Compartir</b> para mandarlo a Drive, al mail o a donde lo guardes. Que quede solo en el teléfono no te sirve de red de seguridad.');
  }
}

function restaurarCopia(f){
  var r = new FileReader();
  r.onload = function(){
    var j;
    try{ j = JSON.parse(r.result); }catch(e){ alerta('Ese archivo no se pudo leer', 'No parece una copia de kibFinanzas.'); return; }
    var anios = j && j.anios && typeof j.anios === 'object' ? j.anios
              : (j && Array.isArray(j.meses) ? (function(o){ var t = {}; t[num(j.anio)||new Date().getFullYear()] = j; return t; })() : null);
    if(!anios){ alerta('Ese archivo no se pudo leer', 'No parece una copia de kibFinanzas.'); return; }
    var claves = Object.keys(anios).filter(function(k){ return /^\d{4}$/.test(k); });
    if(!claves.length){ alerta('Copia vacía', 'El archivo no tiene ningún año adentro.'); return; }
    var teniaDatos = hayDatos();
    pendiente = function(){
      var ultimo = 0;
      for(var i=0;i<claves.length;i++){
        var d = normalizar(anios[claves[i]]); d.anio = +claves[i];
        try{ localStorage.setItem(PREF + d.anio, JSON.stringify(d)); }catch(e){}
        if(d.anio > ultimo) ultimo = d.anio;
      }
      // si la app tenía datos y ese año viene en la copia, me quedo ahí; si estaba vacía, abro el último año de la copia
      recordarAnio(teniaDatos && claves.indexOf(String(D.anio)) > -1 ? D.anio : ultimo);
      cargar();
      toast('Restauré ' + claves.length + (claves.length === 1 ? ' año' : ' años'));
    };
    abrirHoja('<h3>Restaurar copia</h3><div class="texto" style="margin-bottom:16px">La copia trae ' + claves.length + (claves.length === 1 ? ' año: ' : ' años: ')
      + '<b>' + claves.join(', ') + '</b>. Va a <b>reemplazar</b> lo que tengas guardado de esos años en este teléfono.</div>'
      + '<div class="fila"><button data-act="cerrarHoja">Cancelar</button><button class="pri mal" data-act="confirmar">Reemplazar</button></div>');
  };
  r.readAsText(f);
}

function exportarCSV(){
  var s = serie(D), l = [], i;
  function c(v){ return String(v).replace(/[;\n]/g,' '); }
  l.push(['Mes','Ingresos','Gastos fijos','Gastos variables','Gastos','Ahorro ARS','Pesos a dólares','Dólares comprados','Pagado a','Saqué del ahorro','Dólares vendidos','Repuse','A reponer','Deudas','Disponible final','Ahorro acumulado','USD del mes','USD acumulado'].join(';'));
  for(i=0;i<12;i++){
    var x = s[i];
    l.push([MESES[i], x.totalIngresos, x.subtotalFijos, x.subtotalVariables, x.totalGastos,
            x.ahorroMesARS, x.compraARS, x.compraUSD, Math.round(x.cotizacionPagada*100)/100, x.sacadoARS, x.ventaUSD, x.reposicionARS, x.aReponer, x.totalDeudas, x.disponibleFinal, x.ahorroAcumulado, x.usdMes, x.usdAcumulado]
           .map(function(v,k){ return k===0 ? c(v) : String(v).replace('.',','); }).join(';'));
  }
  descargar('\ufeff' + l.join('\r\n'), 'kibfinanzas-'+D.anio+'.csv', 'text/csv;charset=utf-8');
}
function duplicar(){
  var s = serie(D), n = JSON.parse(JSON.stringify(D)), i, j, k;
  n.anio = D.anio + 1;
  n.ahorroAnioAnterior = s[11].ahorroAcumulado;
  Object.keys(n.planDeudas).forEach(function(k){ var e = estadoDeuda(k, 11); if(e) n.planDeudas[k].pagadasAntes = e.pagadas; });
  n.usdAnioAnterior = s[11].usdAcumulado;
  n.aReponerAnterior = s[11].aReponer;
  n.actualizado = '';
  for(i=0;i<12;i++){
    var m = n.meses[i];
    for(j=0;j<SECS.length;j++){
      k = SECS[j].k;
      for(var q=0;q<m[k].length;q++) m[k][q].monto = 0;
    }
    m.ahorroMesARS = 0; m.ahorroMesUSD = 0; m.compraARS = 0; m.compraUSD = 0;
    m.retiroARS = 0; m.ventaUSD = 0; m.ventaARS = 0; m.reposicionARS = 0; m.movimientos = [];
  }
  if(sucio) guardar();
  if(leerAnio(n.anio)){ alerta('Ese año ya existe', 'El ' + n.anio + ' ya está guardado en este teléfono. Cambiá de año desde Ajustes en vez de crearlo de nuevo.'); return; }
  var viejo = D.anio;
  D = n; recordarAnio(D.anio); mes = 0; arrancado = true;
  var cargadas = 0;
  Object.keys(D.planDeudas).forEach(function(nn){
    var pp = D.planDeudas[nn];
    if(!pp.cuotas || !pp.total) return;
    cargadas += cargarCuotas(nn, 0).poner;
  });
  guardar(); render();
  alerta('Listo el ' + D.anio, 'Creé el año con los meses en cero, las mismas categorías y el cierre de '
    + viejo + ' como saldo inicial.'
    + (cargadas ? ' Además dejé cargadas ' + cargadas + ' cuotas de las deudas que seguían abiertas.' : '')
    + ' Ya estás trabajando en él; el ' + viejo + ' sigue guardado.');
}

  if(!e.touches || e.touches.length !== 1) return;
  if(hoja.scrollTop > 0) return;             // si está scrolleada, primero se scrollea
  arr.activo = true; arr.y0 = e.touches[0].clientY; arr.dy = 0;

}, {passive:true});

  if(!arr.activo || !e.touches) return;

  hoja.style.transform = 'translateY(' + arr.dy + 'px)';

document.addEventListener('click', function(ev){
  var b = ev.target.closest('[data-act]');
  if(!b) { if(ev.target === velo) cerrarHoja(); return; }
  var a = b.getAttribute('data-act');

  if(a === 'tab'){
    var TABS = ['mes','anio','usd','ajustes'], antes = TABS.indexOf(tab);
    tab = b.getAttribute('data-t'); ajVista = '';
    var haciaDer = TABS.indexOf(tab) > antes;
    var bs = document.querySelectorAll('#nav button');
    for(var i=0;i<bs.length;i++) bs[i].classList.toggle('on', bs[i] === b);
    var vs = document.querySelectorAll('.vista');
    for(i=0;i<vs.length;i++) vs[i].classList.toggle('on', vs[i].id === 'v'+'-'+tab);
    render(); window.scrollTo(0,0);
    var vv = document.getElementById('v-'+tab);
    if(vv && !menosMovimiento()){
      vv.classList.remove('der','izq'); void vv.offsetWidth;
      vv.classList.add(haciaDer ? 'der' : 'izq');
    }
    return;
  }
  if(a === 'mes'){ mes = +b.getAttribute('data-m'); renderMes(); return; }
  if(a === 'col'){
    var k = b.getAttribute('data-k');
    D.ui.col[k] = !D.ui.col[k];
    plegarAnim(b.parentNode, !!D.ui.col[k]);
    tocar();
    return;
  }
  if(a === 'add'){ pedirNombre(b.getAttribute('data-k')); return; }
  if(a === 'volverBorrado'){ volverBorrado(); return; }
  if(a === 'del'){
    var kk = b.getAttribute('data-k'), ii = +b.getAttribute('data-i');
    var nom = D.meses[mes][kk][ii].nombre || 'este ítem';
    confirmar('Borrar '+esc(nom), 'Se borra solo de '+MESES[mes]+'. Los otros meses quedan como están.', 'Borrar', function(){
      borrado = {k:kk, i:ii, mes:mes, it:D.meses[mes][kk][ii]};
      D.meses[mes][kk].splice(ii,1); tocar(); conScroll(renderMes);
      toast('Borré ' + esc(nom), 'Deshacer', 'volverBorrado');
    });
    return;
  }
  if(a === 'addCripto'){ D.cripto.push({activo:'',cantidad:0,precioUSD:0}); tocar(); renderUSD(); return; }
  if(a === 'delCripto'){
    var ic = +b.getAttribute('data-i'), ac = D.cripto[ic];
    confirmar('Borrar '+esc(ac.activo || 'este activo'), 'Se borra la cantidad y el precio que cargaste. No se puede deshacer.', 'Borrar', function(){
      D.cripto.splice(ic,1); tocar(); renderUSD(); toast('Activo borrado');
    });
    return;
  }
  if(a === 'guardar'){ guardar(false); return; }
  if(a === 'ojo'){ alternarOculto(); return; }
  if(a === 'ocultoSet'){ var q = b.getAttribute('data-v') === '1'; if(q !== oculto) alternarOculto(); return; }
  if(a === 'elegir'){ guardar(true); return; }
  if(a === 'expcsv'){ exportarCSV(); return; }
  if(a === 'verpc'){ versionPC(); return; }
  if(a === 'probarCompartir'){ cerrarHoja(); probarCompartir(); return; }
  if(a === 'ajVista'){ ajVista = b.getAttribute('data-v') || ''; renderAjustes(); window.scrollTo(0,0); return; }
  if(a === 'ajRaiz'){ ajVista = ''; renderAjustes(); window.scrollTo(0,0); return; }
  if(a === 'duplicar'){ duplicar(); return; }
  if(a === 'tema'){ D.ui.tema = b.getAttribute('data-v'); aplicarTema(); tocar(); renderAjustes(); return; }
  if(a === 'copia'){ hacerCopia(); return; }
  if(a === 'restaurar'){ document.getElementById('fileJson').click(); return; }
  if(a === 'imprimir'){ imprimir(); return; }
  if(a === 'anio'){ cambiarAnio(+b.getAttribute('data-v')); return; }
  if(a === 'cerrarAviso'){ document.getElementById('avisos').innerHTML = ''; return; }
  if(a === 'copiar'){ copiarAnterior(b.getAttribute('data-k')); return; }
  if(a === 'topes'){ abrirTopes(b.getAttribute('data-k')); return; }
  if(a === 'pagar'){
    var kp = b.getAttribute('data-k'), ip = +b.getAttribute('data-i'), itp = D.meses[mes][kp][ip];
    if(itp){ itp.pagado = !estaPagado(mes, itp); tocar(); guardar(); conScroll(renderMes); }
    return;
  }
  if(a === 'ordenar'){ abrirOrden(b.getAttribute('data-k')); return; }
  if(a === 'subir'){ moverOrden(+b.getAttribute('data-i'), -1); return; }
  if(a === 'bajar'){ moverOrden(+b.getAttribute('data-i'), 1); return; }
  if(a === 'ordenOk'){ guardarOrden(b.getAttribute('data-v') === 'ade'); return; }
  if(a === 'topesOk'){ guardarTopes(b.getAttribute('data-k'), b.getAttribute('data-v') === 'ade'); return; }
  if(a === 'quitarMov'){ quitarMov(b.getAttribute('data-id')); document.getElementById('toast').classList.remove('on'); return; }
  if(a === 'plan'){ abrirPlan(+b.getAttribute('data-i')); return; }
  if(a === 'guardarPlan'){ guardarPlan(false); return; }
  if(a === 'quitarPlan'){ guardarPlan(true); return; }
  if(a === 'colAyuda'){ var ka = b.getAttribute('data-k'); ayudaAbierta[ka] = !ayudaAbierta[ka]; plegarAnim(b.parentNode, !ayudaAbierta[ka]); return; }
  if(a === 'gastoRapido'){ gastoRapido(); return; }
  if(a === 'chip'){
    var cs = document.querySelectorAll('#grChips button');
    for(var j=0;j<cs.length;j++) cs[j].classList.toggle('on', cs[j] === b);
    gr.cat = +b.getAttribute('data-i'); gr.sec = b.getAttribute('data-sec');
    if(gr.monto) sumarGasto();
    return;
  }
  if(a === 'confirmarGasto'){ sumarGasto(); return; }
  if(a === 'cerrarHoja'){ pendiente = null; cerrarHoja(); return; }
  if(a === 'bienvOk'){ cerrarBienvenida(); return; }
  if(a === 'verBienvenida'){ bienvenida(); return; }
  if(a === 'confirmar'){ var f = pendiente; pendiente = null; cerrarHoja(); if(f) f(); return; }
  if(a === 'nuevoNombre'){ crearItem(); return; }
  if(a === 'propagar'){ propagar(b.getAttribute('data-v') === 'si'); return; }
});
velo.addEventListener('click', function(ev){ if(ev.target === velo){ pendiente = null; cerrarHoja(); } });

document.addEventListener('input', function(ev){
  var t = ev.target;
  if(t.classList.contains('monto') || t.classList.contains('nombre')){
    aplicarInput(t, false);
  }
});
document.addEventListener('keydown', function(ev){
  var t = ev.target;
  if(ev.key === 'Enter' && t && t.classList && (t.classList.contains('monto') || t.classList.contains('nombre'))){ ev.preventDefault(); t.blur(); }
});
document.addEventListener('focusin', function(ev){
  var t = ev.target;
  if(t.classList && t.classList.contains('monto')){
    var v = valorDe(t);
    t.value = t.classList.contains('pct') ? (Math.round(num(v)*10000)/100 || '') : crudo(v);
    if(t.select) t.select();
  }
});
document.addEventListener('focusout', function(ev){
  var t = ev.target;
  if(t.classList && t.classList.contains('monto')){
    aplicarInput(t, true);
    var v = valorDe(t);
    t.value = t.classList.contains('pct') ? fPct(v)
            : t.classList.contains('usd') ? fUSD(v)
            : t.classList.contains('cant') ? crudo(v)
            : fARS(v);
  }
});
function valorDe(t){
  var ci = t.getAttribute('data-cripto');
  if(ci !== null) return D.cripto[+ci][t.getAttribute('data-campo')];
  var campo = t.getAttribute('data-campo');
  if(campo){
    if(campo === 'ahorroAnioAnterior' || campo === 'usdAnioAnterior' || campo === 'cotizacionUSD') return D[campo];
    return D.meses[mes][campo];
  }
  return D.meses[mes][t.getAttribute('data-k')][+t.getAttribute('data-i')].monto;
}
function aplicarInput(t, final){
  var v = t.classList.contains('nombre') ? t.value : parseNum(t.value);
  var ci = t.getAttribute('data-cripto');
  if(ci !== null){
    var cc = D.cripto[+ci], cf = t.getAttribute('data-campo');
    if(cc[cf] !== v){ cc[cf] = v; tocar(); }
    if(final) renderUSD(); return;
  }
  var campo = t.getAttribute('data-campo');
  if(campo){
    if(campo === 'metaAhorroPct') v = num(v)/100;
    v = num(v);
    var cambio = false;
    if(campo === 'cotizacionUSD'){ if(v > 0 && D.cotizacionUSD !== v){ D.cotizacionUSD = v; D.cotizacionFecha = new Date().toISOString(); cambio = true; } }
    else if(campo === 'ahorroAnioAnterior' || campo === 'usdAnioAnterior'){ if(D[campo] !== v){ D[campo] = v; cambio = true; } }
    else if(D.meses[mes][campo] !== v){ D.meses[mes][campo] = v; cambio = true; }
    if(cambio) tocar();
    refrescar();
    if(final && (tab === 'anio' || tab === 'usd')) conScroll(render);
    return;
  }
  var it = D.meses[mes][t.getAttribute('data-k')][+t.getAttribute('data-i')];
  if(t.classList.contains('nombre')){
    if(t.getAttribute('data-k') === 'deudas'){
      var viejo = String(it.nombre||'').trim(), nuevo = String(v).trim();
      if(viejo !== nuevo && D.planDeudas[viejo] && !D.planDeudas[nuevo]){
        D.planDeudas[nuevo] = D.planDeudas[viejo]; delete D.planDeudas[viejo];
        // una deuda con plan es la misma en todos los meses: el nombre viaja con ella
        for(var mj=0;mj<12;mj++){ var ld = D.meses[mj].deudas; for(var mq=0;mq<ld.length;mq++) if(ld[mq] !== it && String(ld[mq].nombre||'').trim() === viejo) ld[mq].nombre = v; }
      }
    }
    if(it.nombre === v) return;
    it.nombre = v;
  } else {
    if(it.monto === num(v)) return;
    it.monto = num(v);
  }
  tocar(); refrescar();
}

document.getElementById('fileJson').addEventListener('change', function(){
  if(this.files && this.files[0]) restaurarCopia(this.files[0]);
  this.value = '';
});
window.addEventListener('beforeunload', function(e){
  if(sucio){ e.preventDefault(); e.returnValue = ''; return ''; }
});

/* alta de categoría + propagación */
var alta = null;
function pedirNombre(k){
  alta = {k:k, nombre:''};
  var S = SECS.filter(function(s){ return s.k === k; })[0];
  abrirHoja('<h3>Nueva categoría en '+S.t.toLowerCase()+'</h3>'
    + '<input type="text" id="nuevoNom" placeholder="Nombre" autocomplete="off">'
    + '<div class="fila"><button data-act="cerrarHoja">Cancelar</button>'
    + '<button class="pri" data-act="nuevoNombre">Agregar</button></div>');
  var i = document.getElementById('nuevoNom');
  i.focus();
  i.addEventListener('keydown', function(e){ if(e.key === 'Enter') crearItem(); });
}
function crearItem(){
  var i = document.getElementById('nuevoNom');
  var nom = (i ? i.value : '').trim();
  if(!nom){ if(i) i.focus(); return; }
  alta.nombre = nom;
  D.meses[mes][alta.k].push({nombre:nom, monto:0});
  tocar(); renderMes();
  if(mes < 11){
    abrirHoja('<h3>¿También en los meses que siguen?</h3>'
      + '<div class="texto" style="margin-bottom:16px">Puedo agregar <b>'+esc(nom)+'</b> vacía de '+MESES[mes+1]+' a diciembre.</div>'
      + '<div class="fila"><button data-act="propagar" data-v="no">Solo '+MESES[mes]+'</button>'
      + '<button class="pri" data-act="propagar" data-v="si">Agregar a todos</button></div>');
  } else cerrarHoja();
}
function propagar(si){
  if(si && alta){
    for(var i=mes+1;i<12;i++){
      var ls = D.meses[i][alta.k], existe = false;
      for(var j=0;j<ls.length;j++) if(ls[j].nombre === alta.nombre) existe = true;
      if(!existe) ls.push({nombre:alta.nombre, monto:0});
    }
    tocar();
  }
  alta = null; cerrarHoja();
}

/* ═══ 12 · tema ═════════════════════════════════════════════════ */
function botonOjo(){
  var t = oculto ? 'Mostrar montos' : 'Ocultar montos';
  return '<button class="ojo" data-act="ojo" aria-label="'+t+'" title="'+t+'">'
    + '<svg class="ojo-ver" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>'
    + '<svg class="ojo-no" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.2C11.05 5.07 11.5 5 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 3.9"/><path d="M6.6 6.6C3.7 8.6 2 12 2 12s3.5 7 10 7c1.7 0 3.2-.4 4.5-1.1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>'
    + '</button>';
}
function aplicarOculto(){
  if(oculto) document.documentElement.setAttribute('data-oculto', '1');
  else document.documentElement.removeAttribute('data-oculto');
  var bs = document.querySelectorAll('.ojo'), t = oculto ? 'Mostrar montos' : 'Ocultar montos', i;
  for(i=0;i<bs.length;i++){ bs[i].setAttribute('aria-label', t); bs[i].setAttribute('title', t); }
}
function alternarOculto(){
  oculto = !oculto;
  try{ localStorage.setItem(LSOCULTO, oculto ? '1' : '0'); }catch(e){}
  aplicarOculto(); render();
}
function aplicarTema(){
  if(D.ui.tema === 'auto') document.documentElement.removeAttribute('data-tema');
  else document.documentElement.setAttribute('data-tema', D.ui.tema);
}

/* ═══ 13 · recuperación del buffer ══════════════════════════════ */
function aviso(html, cerrable){
  document.getElementById('avisos').innerHTML =
    '<div class="aviso"><p>' + html + '</p>'
    + (cerrable === false ? '' : '<div class="fila"><button class="mini" data-act="cerrarAviso">Entendido</button></div>')
    + '</div>';
}
/* ═══ 14 · arranque ═══════════════════════════════════ */
try{ localStorage.setItem(PREF + 'test', '1'); localStorage.removeItem(PREF + 'test'); }
catch(e){ hayLS = false; }

D = leerEmbebido();
aplicarTema();
aplicarOculto();
render();
cargar();

if(location.search.indexOf('gasto=1') > -1) setTimeout(gastoRapido, 350);

if('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('./sw.js')['catch'](function(){});
}
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'hidden' && sucio) guardar();
});
})();
</script>
